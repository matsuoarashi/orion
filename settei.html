<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>設定 | 洋食オリオン</title>
<style>
:root{ --g:#2c4f39; --g-d:#1f3a2a; --g-l:#e4eee7; --cream:#faf6ee; --cream-d:#ece4d2; --ink:#2b2a26; --mute:#7a7265; --red:#a33c2e; --red-l:#f6e3df; --amber:#b7791f; --amber-l:#f7ebd3; --gold:#c9a24a; --line:#d9d1bd; --r:14px; --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom); }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.55}
.hide{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(10px + var(--sat)) 12px 10px;display:flex;align-items:center;gap:10px}
header .t{font-size:11px;letter-spacing:4px;opacity:.85} header .n{font-size:16px;font-weight:bold}
.tabs{position:sticky;top:0;z-index:4;display:flex;gap:6px;padding:8px 12px;background:var(--cream);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 4px;font-size:13px;color:var(--ink);position:relative}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:bold}
.tabs .bd{position:absolute;top:-5px;right:2px;min-width:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;line-height:16px}
main{padding:12px 12px calc(40px + var(--sab));max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px;justify-content:space-between}
h2 small{font-weight:normal;color:var(--mute);font-size:12px}
.mini{font-size:12.5px;color:var(--mute);line-height:1.6}
.msg{padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:12px;line-height:1.6}
.msg.err{background:var(--red-l);color:var(--red)} .msg.ok{background:var(--g-l);color:var(--g)} .msg.warn{background:var(--amber-l);color:#7a5210}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:bold;color:#fff;background:var(--g);font-family:inherit}
.btn.sec{background:var(--cream-d);color:var(--ink)} .btn.line{background:#fff;color:var(--g);border:1px solid var(--g)} .btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.5} .btn.full{display:block;width:100%;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)} .chips button.on{border-color:var(--g);color:var(--g);font-weight:bold;background:var(--g-l)}
.rv .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.star{color:var(--gold);letter-spacing:1px;font-size:15px} .star.low{color:var(--red)}
.rv .tx{white-space:pre-wrap;margin:6px 0;font-size:14.5px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin:0 4px 2px 0;background:var(--cream-d);color:var(--ink)} .tag.st{background:var(--amber-l);color:#7a5210} .tag.ok{background:var(--g-l);color:var(--g)} .tag.no{background:#eee;color:#777}
.reply{background:var(--g-l);border-radius:10px;padding:10px;font-size:14px;white-space:pre-wrap;margin-top:6px}
textarea,input,select{width:100%;font-family:inherit;font-size:16px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 3px}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap} th:first-child,td:first-child{text-align:left}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;font-size:14px} .kv span{color:var(--mute);font-size:12.5px}
.sw{display:flex;gap:6px;flex-wrap:wrap} .sw button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px} .sw button.on{background:var(--g);color:#fff;border-color:var(--g)}
.code{font-size:26px;font-weight:bold;letter-spacing:6px;color:var(--g);font-variant-numeric:tabular-nums}
pre{white-space:pre-wrap;font-family:inherit;font-size:13.5px;background:var(--cream);border-radius:10px;padding:10px;max-height:340px;overflow:auto}
.ovl{position:fixed;inset:0;background:rgba(20,30,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--cream);width:100%;max-width:600px;border-radius:18px 18px 0 0;padding:14px 16px calc(24px + var(--sab));max-height:92vh;overflow-y:auto}
.sheet h3{font-size:16px;color:var(--g);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1}
ol.steps{padding-left:20px;font-size:14px} ol.steps li{margin:6px 0}
</style>
</head>
<body>
<header><div style="flex:1"><div class="t">設定</div><div class="n">配信と連携</div></div></header>
<main>
  <div id="msg"></div>
  <h3 style="font-size:13px;color:var(--mute);letter-spacing:2px;margin:4px 2px 8px">LINE 配信（オーナー向け・お店全体のまとめ）</h3>
  <div id="lnBody"><div class="mini">読み込み中…</div></div>
  <h3 style="font-size:13px;color:var(--mute);letter-spacing:2px;margin:18px 2px 8px">Google ビジネスプロフィールとの連携</h3>
  <div id="gsBody"><div class="mini">読み込み中…</div></div>
</main>
<div id="ov"></div><div class="toast" id="toast"></div>
<script src="busy.js?v=1101b"></script>
<script>
// 設定（管理者）：公式 LINE のオーナー配信（owner.gs）と、Google ビジネスプロフィールの API 連携の進み具合（gbp.gs）。11/4 口コミ画面から移した
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzFNl4UM3fkoANru-agWmuOox-h3cS1yJmx4UZxpGFemEBnAUv45Gdp1VOvtCqOVUg/exec";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const YO = ["日","月","火","水","木","金","土"];
let TOKEN = "", LN = null, GS = null;
try{ TOKEN = localStorage.getItem("os-admin-token") || localStorage.getItem("os-token") || ""; }catch(e){}
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); }
function msg(t, c){ $("msg").innerHTML = t ? `<div class="msg ${c||"err"}">${t}</div>` : ""; }
function closeOv(){ $("ov").innerHTML=""; }
function sheet(h){ $("ov").innerHTML = `<div class="ovl" onclick="if(event.target===this)closeOv()"><div class="sheet">${h}</div></div>`; }
async function get(mode, p){ const q = Object.assign({mode, token:TOKEN, t:Date.now()}, p||{}); try{ const r = await fetch(SHEET_URL+"?"+Object.keys(q).map(k=>k+"="+encodeURIComponent(q[k])).join("&"), {cache:"no-store"}); return await r.json(); }catch(e){ return {error:"通信エラー"}; } }
async function post(type, b){ try{ const r = await fetch(SHEET_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(Object.assign({type, token:TOKEN}, b||{}))}); return await r.json(); }catch(e){ return {error:"通信エラー"}; } }
// ───── LINE 配信（オーナー向け）─────
async function loadLn(){ const r = await get("os_owner_list"); if (r.error){ $("lnBody").innerHTML = `<div class="msg err">${esc(r.error)}</div>`; return; } LN = r; renderLn(); }
function renderLn(){
  const add = LN.basicId ? `https://line.me/R/ti/p/${encodeURIComponent(LN.basicId)}` : "";
  $("lnBody").innerHTML = `<div class="card"><h2>公式 LINE「${esc(LN.botName||"洋食オリオン")}」 <small>${LN.lineReady?"つながっています":"未設定"}</small></h2>
    ${LN.lineReady ? `<div class="mini">オーナーにはこの公式アカウントを友だち追加してもらい、下の登録コードを「登録 123456」の形で送ってもらいます${add?`。友だち追加：<a href="${add}" target="_blank">${esc(LN.basicId)}</a>`:""}</div>` : `<div class="msg warn">LINE のチャネルアクセストークン（LINE_TOKEN）がまだ Apps Script に入っていません。松尾さんがスクリプト プロパティに貼ると使えるようになります。Webhook の URL も分析の Apps Script のデプロイ URL にしてください</div>`}
    <div class="mini" style="margin-top:6px">配信：日次＝営業日の16時（その日の売上・食数・出来事・口コミ・やること）／週次＝月曜8時（先週のまとめ）／即時＝星2以下の口コミ。オーナーが「今日」「今週」と送ると、その場で返します。プッシュは LINE の無料枠（月200通）を数えます</div></div>
    <div class="card"><h2>配信先 <button class="btn sec" style="padding:6px 10px;font-size:12px" onclick="addOwner()">＋ 足す</button></h2>
    ${LN.list.length ? LN.list.map(o=>`<div style="border-top:1px solid var(--line);padding:10px 0">
      <div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.name)}</b><span class="tag ${o.status==="有効"?"ok":o.status==="停止"?"no":"st"}">${esc(o.status)}</span></div>
      ${o.status==="招待中" ? `<div class="mini">LINE で「登録 ${esc(o.code)}」と送ってもらう（${esc(o.codeUntil)}まで）</div><div class="code">${esc(o.code)}</div>` : `<div class="mini">${o.linked?"LINE 登録済み（…"+esc(o.lineTail)+"）":""}${o.last?"・最後に送った "+esc(o.last):""}</div>`}
      <div class="sw" style="margin-top:6px">${[["daily","日次"],["weekly","週次"],["instant","即時"]].map(([k,l])=>`<button class="${o[k]?"on":""}" onclick="setOwner('${o.id}',{${k}:${!o[k]}})">${l}</button>`).join("")}</div>
      <div class="row">${o.linked?`<button class="btn line" onclick="testOwner('${o.id}')">テスト送信</button>`:""}${o.status==="有効"?`<button class="btn red" onclick="setOwner('${o.id}',{status:'停止'})">止める</button>`:o.status==="停止"&&o.linked?`<button class="btn sec" onclick="setOwner('${o.id}',{status:'有効'})">再開</button>`:""}<button class="btn sec" onclick="newCode('${o.id}')">コードを出し直す</button></div></div>`).join("") : `<div class="mini">まだありません。「＋ 足す」でオーナーを登録します</div>`}</div>
    <div class="card"><h2>中身を見る</h2><div class="row"><button class="btn sec" onclick="preview('日次')">今日の日次</button><button class="btn sec" onclick="preview('週次')">先週の週次</button></div><div id="pv"></div></div>`;
}
async function addOwner(){ const name = prompt("配信先の名前（例：長下さん）"); if (!name) return; const r = await post("os_owner_add", {name}); if (r.error){ toast(r.error); return; } toast("登録コード " + r.code + " を出しました"); loadLn(); }
async function setOwner(id, b){ const r = await post("os_owner_set", Object.assign({id}, b)); if (r.error){ toast(r.error); return; } loadLn(); }
async function newCode(id){ if (!confirm("新しい登録コードを出します。今の LINE の登録は外れます。よろしいですか？")) return; const r = await post("os_owner_code", {id}); if (r.error){ toast(r.error); return; } loadLn(); }
async function testOwner(id){ const r = await post("os_owner_test", {id}); toast(r.error ? r.error : "送りました"); }
async function preview(kind){ $("pv").innerHTML = `<div class="mini" style="margin-top:8px">作っています…</div>`; const r = await get("os_owner_preview", {kind});
  $("pv").innerHTML = r.error ? `<div class="msg err">${esc(r.error)}</div>` : `<pre style="margin-top:8px">${esc(r.text)}</pre><button class="btn line full" onclick="sendNow('${kind}',this)">いま${kind}を有効な配信先に送る</button>`; }
async function sendNow(kind, b){ if (!confirm(kind + "のまとめを、" + kind + "を受け取る配信先に今すぐ送りますか？")) return; b.disabled = true; const r = await post("os_owner_send", {kind}); b.disabled = false; toast(r.error ? r.error : r.sent + "件に送りました"); loadLn(); }


// ───── Google 連携の進み具合 ─────
async function loadGs(){ const r = await get("os_gbp_profile"); GS = r; renderGs(); }
function renderGs(){
  if (!GS || GS.error){ $("gsBody").innerHTML = `<div class="msg err">${esc((GS&&GS.error)||"読み込めませんでした")}</div>`; return; }
  if (GS.ready){ $("gsBody").innerHTML = `<div class="card"><h2>${esc(GS.title||"洋食オリオン")} <span class="tag ok">つながっています</span></h2><div class="mini">口コミは1時間ごと、数字は毎朝取り込みます。返信・祝日の休業・説明文は「口コミ」画面から</div></div>`; return; }
  $("gsBody").innerHTML = `<div class="card"><h2>まだつながっていません <span class="tag st">準備中</span></h2>
    <div class="mini">つながるまでは「口コミ」画面で、口コミを手で入れて返信の下書きを作れます</div>
    <ol class="steps">
      <li>Google Cloud でプロジェクトを作り、<b>プロジェクト番号</b>を控える</li>
      <li>Google ビジネスプロフィールで<b>組織アカウント</b>を作る</li>
      <li><b>利用申請</b>を出す（「Application for Basic API Access」）。プロフィールは確認済みで60日以上・ウェブサイトの記載が条件</li>
      <li>Apps Script の持ち主のアカウントを、プロフィールの<b>管理者</b>に招待する</li>
      <li>承認のメールが来たら、Cloud の割り当て（QPM）が 0 → 300 になっているか確かめる</li>
      <li>Claude が仕上げ：API を有効にし、Apps Script をそのプロジェクトにつなぎ替え、権限を足して承認、gbpSetup・gbpSetupTriggers を実行</li>
    </ol></div>`;
}
if (!TOKEN) msg("管理者アプリでログインしてから開いてください。<a href='kanri.html'>管理者アプリへ</a>");
else { loadLn(); loadGs(); }
</script>
</body>
</html>
