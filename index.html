<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>オリオン レジ</title>
<style>
  :root{
    --wood:#6b3f1c; --wood-d:#4e2d12; --cream:#fdf6e8; --cream-d:#e8dcc2;
    --enji:#93332a; --midori:#2c4f39; --ink:#3a2a18;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;background:linear-gradient(#7a4b22,#5c3413);min-height:100vh;color:var(--ink);display:flex;justify-content:center}
  .app{width:100%;max-width:520px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
  header{text-align:center;color:#f3ddb0;padding:6px 0 2px;letter-spacing:6px;font-size:15px}
  header b{display:block;font-size:22px;letter-spacing:10px;margin-top:2px}
  .disp{background:#0c1013;border-radius:14px;padding:10px 14px;border:3px solid var(--wood-d);box-shadow:inset 0 0 18px #000}
  .disp .total{color:#ffe9b8;font-size:46px;font-weight:bold;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
  .disp .items{color:#c8a866;font-size:13px;min-height:20px;margin-top:2px;line-height:1.4;word-break:break-all}
  .mode{display:flex;gap:8px}
  .mode button{flex:1;padding:7px;border-radius:10px;border:2px solid var(--wood-d);background:var(--cream-d);font-size:15px;font-weight:bold;color:var(--ink)}
  .mode button.on{background:var(--midori);color:#fff;border-color:var(--midori)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .key{border:none;border-radius:12px;padding:8px 4px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.35);background:linear-gradient(var(--cream),var(--cream-d));color:var(--ink);font-size:16px;line-height:1.25}
  .key .nm{display:block;white-space:nowrap;min-height:2.3em;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .key small{display:block;font-weight:normal;color:var(--enji);font-size:13px;margin-top:1px}
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .key.fn-minus{background:linear-gradient(#f0e8d8,#d8ccb2)}
  .key.fn-clear{background:linear-gradient(#b8483d,#8d2f26);color:#fff}
  .key.fn-clear small{color:#f3d2ca}
  .key.fn-total{background:linear-gradient(#3f6b4f,#274732);color:#fff;font-size:19px}
  .key.fn-total small{color:#cfe2cc}
  .overlay{position:fixed;inset:0;background:rgba(20,12,4,.65);display:none;justify-content:center;align-items:flex-end;z-index:10}
  .overlay.show{display:flex}
  .sheet{background:var(--cream);border-radius:18px 18px 0 0;padding:16px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--wood-d);max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .grid2 .fm{grid-template-columns:minmax(0,1fr) auto;padding:4px 0}
  .grid2 .fm input{width:58px;height:36px;font-size:17px}
  .sheet .lbl{font-size:13px;margin:4px 0 0;color:#5a4a3a}
  .sheet h2{font-size:16px;letter-spacing:4px;color:var(--midori);text-align:center}
  .sheet .row{display:flex;justify-content:space-between;font-size:19px;font-variant-numeric:tabular-nums}
  .sheet .row.change{font-size:30px;font-weight:bold;color:var(--enji)}
  .sheet .row.short .val{color:#8a6a1a}
  .tenkey{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tenkey button{padding:14px 2px;border-radius:10px;border:2px solid var(--wood-d);background:#fff;font-weight:bold;font-size:20px;font-variant-numeric:tabular-nums}
  .tenkey button:active{background:var(--cream-d)}
  .tenkey .op{background:var(--cream-d);font-size:15px}
  #ppBtn.on{background:#d33 !important;color:#fff !important}
  .tenkey .bs{background:#f2d9c8}
  .sheet .done{padding:14px;border-radius:12px;border:none;background:var(--midori);color:#fff;font-size:18px;font-weight:bold;letter-spacing:4px}
  .sheet .done:disabled{background:#9aa89b}
  .sheet .cancel{padding:10px;border-radius:10px;border:2px solid var(--wood-d);background:none;font-size:14px;color:var(--ink)}
  footer{background:rgba(0,0,0,.25);border-radius:12px;color:#e8d5ac;padding:7px 10px;font-size:13px;flex-wrap:wrap;gap:4px;display:flex;justify-content:space-between;align-items:center}
  footer button{background:none;border:1px solid #a98d5c;color:#e8d5ac;border-radius:8px;padding:5px 8px;font-size:12px}
  .sum-list{font-size:15px;line-height:1.9;max-height:40vh;overflow-y:auto}
  .sum-list .li{display:flex;justify-content:space-between;border-bottom:1px dashed #c9b891}
  .fm{display:grid;grid-template-columns:minmax(0,1fr) 118px 64px;align-items:center;gap:2px 6px;border-bottom:1px dashed #c9b891;padding:6px 0;font-size:15px}
  .fm .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fm .in{display:flex;align-items:center;justify-content:flex-end;gap:4px;white-space:nowrap}
  .fm input{width:72px;height:40px;font-size:18px;padding:6px;border:2px solid var(--wood-d);border-radius:8px;text-align:right;background:#fff}
  .fm .pt{font-size:11px;color:#8a7a5c;text-align:right;white-space:nowrap}
  .fm .hint{grid-column:1/-1;font-size:11px;color:#8a7a5c;line-height:1.3;min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fillBtn{width:100%;margin:0 0 8px;padding:9px;border-radius:10px;border:2px solid var(--midori);background:var(--cream-d);color:var(--midori);font-size:13px;font-weight:bold}
  .stSec{font-size:12px;font-weight:bold;letter-spacing:2px;color:#fff;background:var(--midori);border-radius:6px;padding:3px 8px;margin:10px 0 2px}
  .stSec.haiki{background:var(--enji)}
  .fm.waste input{border-color:var(--enji)}
  .fm.need{background:#ffe8e0;border-radius:6px;padding-left:6px;padding-right:6px}
  .fm.need .pt{color:#93332a;font-weight:bold}
  .shime-sum{margin-top:10px;border-top:2px solid var(--wood-d);padding-top:8px;font-size:15px;line-height:2}
  .shime-sum .diff-ok{color:#2c4f39;font-weight:bold}
  .shime-sum .diff-ng{color:#93332a;font-weight:bold}
  .save{width:100%;margin-top:12px;padding:14px;border-radius:12px;border:0;background:var(--midori);color:#fff;font-size:17px;font-weight:bold}
</style>
</head>

<!-- 会計シート -->
<div class="overlay" id="payOv">
  <div class="sheet">
    <h2>お 会 計</h2>

    <div class="row"><span>お預り</span><span id="pTender">0 円</span></div>
    <div class="row change" id="pChangeRow"><span id="pChangeLabel">お釣り</span><span class="val" id="pChange">0 円</span></div>
    <div class="tenkey">
      <button onclick="dig(7)">7</button><button onclick="dig(8)">8</button><button onclick="dig(9)">9</button>
      <button class="op" onclick="exactTender()">ぴったり</button>
      <button onclick="dig(4)">4</button><button onclick="dig(5)">5</button><button onclick="dig(6)">6</button>

      <button onclick="dig(1)">1</button><button onclick="dig(2)">2</button><button onclick="dig(3)">3</button>
      <button class="op" onclick="addTender(500)">+500</button>

      <button class="bs" onclick="backspace()">⌫</button>

  </div>
</div>

<script>
// ▼ スプレッドシート連携: Google Apps ScriptのウェブアプリURLを貼り付けてください（空なら連携オフ）
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzFNl4UM3fkoANru-agWmuOox-h3cS1yJmx4UZxpGFemEBnAUv45Gdp1VOvtCqOVUg/exec";

// ▼ カメラ解析機のローカルAPI(解析機構築後にIPを設定。空なら前回同期データのみ表示)
const CAMERA_LOCAL_URL = "";

// 初期メニュー(2026/9/19確定)。店内・持ち帰りとも同一メニュー・同一価格
// 折箱は無料だが個数を計測するためボタンを残す(0円)
// n=集計用の商品名 / l=ボタン表示(| の位置で改行)
const ITEMS = [
  {n:"オリオン",          l:"オリオン",          p:1100},
  {n:"オリオン ハーフ",   l:"オリオン|ハーフ",   p:900},
  {n:"ナシナシ",          l:"ナシナシ",          p:800},
  {n:"ナシナシ ハーフ",   l:"ナシナシ|ハーフ",   p:600},
  {n:"コカ・コーラ",      l:"コカ・コーラ",      p:300},
  {n:"コカ・コーラ ゼロ", l:"コカ・コーラ|ゼロ", p:300},
  {n:"ジンジャーエール",  l:"ジンジャー|エール", p:300},
  {n:"キリンラガー 小瓶", l:"キリンラガー|小瓶", p:500},
  {n:"折箱",              l:"折箱",              p:0},
  {n:"副菜追加",          l:"副菜|追加",         p:100, topping:true},
  {n:"副菜値引き",        l:"副菜|値引き",       p:-100, disc:true},
];
// 副菜追加(+100円)・副菜値引き(−100円)は店内・持ち帰り両方に出す。until:"YYYY-MM-DD" を付けると期限で自動的に消える
const TODAY_STR = (()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })();
for(let i=ITEMS.length-1;i>=0;i--){ if(ITEMS[i].until && TODAY_STR > ITEMS[i].until) ITEMS.splice(i,1); }
// 持ち帰り: ナポリタン4種のみ(商品名の頭に TG・価格は店内と同じ)。ドリンク・ビール・折箱は出さない
const TG_NAMES = ["オリオン","オリオン ハーフ","ナシナシ","ナシナシ ハーフ"];
const TG_ITEMS = ITEMS
  .filter(m => TG_NAMES.includes(m.n))
  .map(m => ({n:"TG" + m.n, l:"TG" + m.l, p:m.p}))
  .concat(ITEMS.filter(m => m.disc || m.topping));
const MENUS = { "店内": ITEMS, "持ち帰り": TG_ITEMS };
const ALL_ITEMS = [...MENUS["店内"], ...MENUS["持ち帰り"].filter(m=>!MENUS["店内"].some(e=>e.n===m.n))];

let items = [], tender = 0, mode = "店内", payMethod = "cash";
const $ = id => document.getElementById(id);

function todayKey(){
  const d = new Date();
  return "orion-sales-" + d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}
function emptyDaily(){ return {count:0, sum:0, paypay:0, disc:0, items:{}, modes:{"店内":0,"持ち帰り":0}}; }

async function loadDaily(){
  try{
    const r = localStorage.getItem(todayKey());
    if(!r) return emptyDaily();
    return Object.assign(emptyDaily(), JSON.parse(r));
  }catch(e){ return emptyDaily(); }
}
async function saveDaily(d){
  try{ localStorage.setItem(todayKey(), JSON.stringify(d)); }catch(e){}
}
async function refreshDaily(){
  const d = await loadDaily();
  $("daily").textContent = `本日 ${d.count}件 / ${d.sum.toLocaleString()}円`;
}

function total(){ return items.reduce((s,i)=>s+i.p,0); }
function counts(){
  const c = {};
  items.forEach(i => c[i.n] = (c[i.n]||0)+1);
  return Object.entries(c).map(([n,q])=>`${n}×${q}`).join("　");
}
function refresh(){
  $("total").textContent = total().toLocaleString() + " 円";
  $("items").textContent = items.length ? `[${mode}] ` + counts() : "ご注文をどうぞ";
}

function renderGrid(){
  $("grid").innerHTML = "";
  MENUS[mode].forEach((m)=>{
    const b = document.createElement("button");
    b.className = "key";
    const lines = (m.l || m.n).split("|");
    b.innerHTML = `<span class="nm">${lines.join("<br>")}</span><small>${m.p ? m.p.toLocaleString()+"円" : "無料"}</small>`;
    if(m.disc) b.style.background = "#e8dcc2";
    b.onclick = ()=>{ items.push(m); refresh(); };
    $("grid").appendChild(b);
  });
  // 機能キー(−/C/＝)。空セルを作らず、＝会計は行の残りいっぱいに広げる
  [["−<small>1つ取消</small>","fn-minus",()=>{items.pop();refresh();}],
   ["C<small>クリア</small>","fn-clear",()=>{items=[];refresh();}],
   ["＝<small>会計</small>","fn-total",showPay]
  ].forEach(([html,cls,fn])=>{
    const b = document.createElement("button");
    b.className = "key " + cls; b.innerHTML = html; b.onclick = fn;
    if(cls === "fn-total"){ const rem = 3 - ($("grid").children.length % 3); b.style.gridColumn = "span " + rem; }
    $("grid").appendChild(b);
  });
}
renderGrid();

function showPay(){
  if(!items.length) return;
  if(total() < 0){ alert("値引きだけでは会計できません"); return; }
  payMethod = "cash"; $("ppBtn").classList.remove("on");
  tender = 0;
  $("pTotal").textContent = total().toLocaleString() + " 円";
  updatePay();
  $("payOv").classList.add("show");
}
function hidePay(){ $("payOv").classList.remove("show"); }

function updatePay(){
  $("pTender").textContent = tender.toLocaleString() + " 円";
  const c = tender - total();
  if(c >= 0){
    $("pChangeLabel").textContent = "お釣り";
    $("pChange").textContent = c.toLocaleString() + " 円";
    $("pChangeRow").classList.remove("short");
    $("doneBtn").disabled = false;
  }else{
    $("pChangeLabel").textContent = "不足";
    $("pChange").textContent = (-c).toLocaleString() + " 円";
    $("pChangeRow").classList.add("short");
    $("doneBtn").disabled = true;
  }
}
function dig(v){
  const s = String(tender) === "0" ? "" : String(tender);
  const next = (s + String(v)).slice(0, 7);
  tender = parseInt(next || "0", 10);
  updatePay();
}
function backspace(){
  const s = String(tender);
  tender = parseInt(s.slice(0, -1) || "0", 10);
  updatePay();
}
function clearTender(){ tender = 0; payMethod = "cash"; $("ppBtn").classList.remove("on"); updatePay(); }
function payPayPay(){ payMethod = "paypay"; tender = total(); $("ppBtn").classList.add("on"); updatePay(); }
function addTender(v){ tender += v; updatePay(); }
function exactTender(){ tender = total(); updatePay(); }

function queueKey(){ return "orion-sheet-queue"; }
function loadQueue(){
  try{ return JSON.parse(localStorage.getItem(queueKey()) || "[]"); }catch(e){ return []; }
}
function saveQueue(q){ try{ localStorage.setItem(queueKey(), JSON.stringify(q)); }catch(e){} }

async function flushQueue(){
  if(!SHEET_URL) return;
  let q = loadQueue();
  if(!q.length) return;
  const rest = [];
  for(const rec of q){
    try{
      await fetch(SHEET_URL, {method:"POST", mode:"no-cors",
        headers:{"Content-Type":"text/plain"}, body: JSON.stringify(rec)});
    }catch(e){ rest.push(rec); }
  }
  saveQueue(rest);
}

async function finishSale(){
  if(tender < total()) return;
  const saleTotal = total();
  const d = await loadDaily();
  d.count += 1;
  d.sum += saleTotal;
  d.modes[mode] = (d.modes[mode]||0) + 1;
  if(payMethod === "paypay") d.paypay = (d.paypay||0) + saleTotal;
  items.forEach(i=>{ if(i.disc) d.disc = (d.disc||0) + 1; });
  items.forEach(i=>{
    if(!d.items[i.n]) d.items[i.n] = {q:0, yen:0};
    d.items[i.n].q += 1;
    d.items[i.n].yen += i.p;
  });
  await saveDaily(d);

  // スプレッドシート送信キューに積んで送信
  const itemCounts = {};
  items.forEach(i => itemCounts[i.n] = (itemCounts[i.n]||0)+1);
  const MEALS = ["オリオン","オリオン ハーフ","ナシナシ","ナシナシ ハーフ",
                 "TGオリオン","TGオリオン ハーフ","TGナシナシ","TGナシナシ ハーフ"];
  const DRINKS = ["コカ・コーラ","コカ・コーラ ゼロ","ジンジャーエール","キリンラガー 小瓶"];
  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const rec = {
    date: now.getFullYear()+"/"+pad(now.getMonth()+1)+"/"+pad(now.getDate()),
    time: pad(now.getHours())+":"+pad(now.getMinutes()),
    youbi: ["日","月","火","水","木","金","土"][now.getDay()],
    mode: mode,
    total: saleTotal,
    meals: MEALS.reduce((s,n)=>s+(itemCounts[n]||0),0),
    drinks: DRINKS.reduce((s,n)=>s+(itemCounts[n]||0),0),
    items: counts(),
    itemCounts: itemCounts,
    tender: tender,
    change: tender - saleTotal,
    pay: payMethod === "paypay" ? "PayPay" : "現金",
  };
  const q = loadQueue(); q.push(rec); saveQueue(q);
  flushQueue();

  items = []; tender = 0; payMethod = "cash";
  hidePay(); refresh(); refreshDaily();
}

// ===== 出退勤（この端末に記録。日計と一緒にLINEへ貼る） =====
const STAFF = ["柴村","大崎","マリエル","臨時"];
function clockKey(){ const d = new Date(); return "orion-clock-" + d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function loadClock(){ try{ return JSON.parse(localStorage.getItem(clockKey()) || "{}"); }catch(e){ return {}; } }
function saveClock(c){ try{ localStorage.setItem(clockKey(), JSON.stringify(c)); }catch(e){} }
function hmNow(){ const n = new Date(); const pad = x => String(x).padStart(2,"0"); return pad(n.getHours())+":"+pad(n.getMinutes()); }
function openClock(){ renderClock(); $("clockOv").classList.add("show"); }
function renderClock(){
  const c = loadClock();
  $("clockList").innerHTML = STAFF.map(n => {
    const r = c[n] || {};
    const btn = !r.in ? `<button class="save" style="margin:0;padding:8px 14px;width:auto" onclick="clockPunch('${n}','in')">出勤</button>`
      : !r.out ? `<button class="save" style="margin:0;padding:8px 14px;width:auto;background:#93332a" onclick="clockPunch('${n}','out')">退勤</button>`
      : `<span style="color:#8a7a5c;font-size:12px">完了</span>`;
    return `<div class="li" style="align-items:center"><span><b style="font-size:16px">${n}</b><br><small style="color:#8a7a5c">${r.in||"—"} 〜 ${r.out||""}</small></span>${btn}</div>`;
  }).join("");
}
function clockPunch(name, kind){
  if(!confirm(`${name} さんの${kind==="in"?"出勤":"退勤"}を ${hmNow()} で記録します。よろしいですか？`)) return;
  const c = loadClock(); c[name] = c[name] || {}; c[name][kind] = hmNow(); saveClock(c); renderClock();
}
function copyClock(){
  const c = loadClock(); const d = new Date();
  const text = `【オリオン 出退勤 ${d.getMonth()+1}/${d.getDate()}】\n` + STAFF.filter(n=>c[n]&&c[n].in).map(n => `${n}　${c[n].in} 〜 ${c[n].out||"（退勤未）"}`).join("\n");
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(()=>alert("コピーしました。LINEに貼り付けてください"), ()=>prompt("長押しでコピーしてください", text));
}

// ===== レジ締め =====
const DENOMS = [10000,5000,1000,500,100,50,10,5,1];
const PREP_DEFAULT = 40000; // 毎日レジに残す現金
function openShime(){
  $("shimeOv").classList.add("show");
  $("prepIn").value = localStorage.getItem("orion-prep2") || PREP_DEFAULT;
  $("shimeDenoms").innerHTML = DENOMS.map((d,i)=>
    `<div class="fm"><span>${d.toLocaleString()}円</span><span class="in"><input type="number" inputmode="numeric" id="dn${i}" placeholder="0" oninput="calcShime()"> 枚</span></div>`
  ).join("");
  $("vendorIn").value = "";
  $("shimeSlips").innerHTML = SLIP_MENUS.map((n,i)=>
    `<div class="fm"><span style="font-size:13px">${n.replace(" ","<br>")}<br><small id="sl${i}c" style="color:#888"></small></span><span class="in"><input type="number" inputmode="numeric" id="sl${i}" placeholder="0" oninput="calcShime()"> 枚</span></div>`
  ).join("");
  calcShime();
}
const SLIP_MENUS = ["オリオン","オリオン ハーフ","ナシナシ","ナシナシ ハーフ"];
function appCount(daily, n){ const a = daily.items[n] ? daily.items[n].q : 0; const b = daily.items["TG"+n] ? daily.items["TG"+n].q : 0; return a + b; }
function shimeCash(){
  return DENOMS.reduce((s,d,i)=>{
    const n = parseInt($("dn"+i) && $("dn"+i).value) || 0;
    return s + d*n;
  },0);
}
async function calcShime(){
  const prep = parseInt($("prepIn").value) || 0;
  localStorage.setItem("orion-prep2", prep);
  const daily = await loadDaily();
  const cash = shimeCash();
  const pp = daily.paypay || 0;
  const vendor = parseInt($("vendorIn") && $("vendorIn").value) || 0;
  const expected = prep + daily.sum - pp - vendor;
  const diff = cash - expected;
  const bank = Math.max(0, cash - PREP_DEFAULT);
  const cls = diff === 0 ? "diff-ok" : "diff-ng";
  const sign = diff > 0 ? "+" : "";
  // 伝票照合
  const slips = {}, app = {}; let slipHtml = "", slipOk = true, slipAny = false;
  SLIP_MENUS.forEach((n,i)=>{
    const sv = parseInt($("sl"+i) && $("sl"+i).value); const ac = appCount(daily, n);
    app[n] = ac; if($("sl"+i+"c")) $("sl"+i+"c").textContent = "(アプリ "+ac+")";
    if(isNaN(sv)) return; slipAny = true; slips[n] = sv; const dlt = sv - ac; if(dlt !== 0) slipOk = false;
    slipHtml += `<div class="li"><span>伝票 ${n}</span><span class="${dlt===0?"diff-ok":"diff-ng"}">${sv}枚 / アプリ${ac}${dlt!==0?" ("+(dlt>0?"+":"")+dlt+")":" ✓"}</span></div>`;
  });
  $("shimeSum").innerHTML =
    `<div class="li"><span>本日売上(アプリ)</span><span>${daily.sum.toLocaleString()} 円</span></div>`+
    `<div class="li"><span>うちPayPay(現金に含めない)</span><span>${pp.toLocaleString()} 円</span></div>`+
    (vendor ? `<div class="li"><span>業者支払い(現金から出した分)</span><span>−${vendor.toLocaleString()} 円</span></div>` : "")+
    `<div class="li"><span>あるべき現金(準備金+現金売上${vendor?"−業者支払い":""})</span><span>${expected.toLocaleString()} 円</span></div>`+
    `<div class="li"><span>数えた現金</span><span>${cash.toLocaleString()} 円</span></div>`+
    `<div class="li"><span>差異</span><span class="${cls}">${sign}${diff.toLocaleString()} 円</span></div>`+
    `<div class="li"><span>レジに残す</span><span>${PREP_DEFAULT.toLocaleString()} 円</span></div>`+
    `<div class="li"><span><b>回収する現金(数えた現金−${PREP_DEFAULT.toLocaleString()})</b></span><span><b>${bank.toLocaleString()} 円</b></span></div>`+
    slipHtml;
  window._shime = {prep, sales: daily.sum, expected, cash, diff, paypay: pp, bank, vendor, slips, app, slipOk: slipAny ? slipOk : null};
}
async function saveShime(){
  const s = window._shime;
  if(!s || s.cash === 0){ alert("金種を入力してください"); return; }
  if(s.diff !== 0 && !confirm(`差異が ${s.diff>0?"+":""}${s.diff.toLocaleString()}円 あります。このまま記録しますか?`)) return;
  if(s.slipOk === null && !confirm("伝票の枚数が未入力です。このまま記録しますか?")) return;
  if(s.slipOk === false && !confirm("伝票の枚数とアプリの件数が合っていません。LINEで報告してください。このまま記録しますか?")) return;
  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const rec = {
    type: "shime",
    date: `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}`,
    time: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
    prep: s.prep, sales: s.sales, expected: s.expected, cash: s.cash, diff: s.diff, paypay: s.paypay || 0, keep: PREP_DEFAULT, bank: s.bank || 0,
    vendor: s.vendor || 0, slips: s.slips || {}, app: s.app || {}, slipOk: s.slipOk
  };
  const q = loadQueue(); q.push(rec); saveQueue(q);
  flushQueue();
  $("shimeOv").classList.remove("show");
  alert("レジ締めを記録しました" + (s.diff===0 ? "(差異なし)" : ""));
}

// ===== 在庫チェック =====
// [品目, 単位, 発注点(nullなら発注管理外), 区分]
// 区分: 仕込=仕込み品 / 廃棄=本日の廃棄記録 / 冷蔵・冷凍・常温=保管場所
const STOCK_ITEMS = [
  ["茹で麺","玉",15,"仕込"], ["ソース(仕込済)","食",15,"仕込"],
  ["茹で麺 廃棄","玉",null,"廃棄"], ["ソース 廃棄","食",null,"廃棄"],
  ["コカ・コーラ","本",6,"冷蔵"], ["コカ・コーラ ゼロ","本",6,"冷蔵"], ["ジンジャーエール","本",6,"冷蔵"],
  ["キリンラガー 小瓶","本",6,"冷蔵"],
  ["冷凍ストック麺","玉",0,"冷凍"],
  ["乾麺","kg",5,"常温"], ["ケチャップ","個",2,"常温"], ["ラード","袋",1,"常温"],
  ["粉チーズ(卓上予備)","本",1,"常温"], ["タバスコ(卓上予備)","本",1,"常温"],
  ["折箱","枚",10,"常温"], ["持ち帰り袋","枚",20,"常温"], ["割り箸","膳",30,"常温"]
];
const SEC_ORDER = ["仕込","廃棄","冷蔵","冷凍","常温"];
const SEC_LABEL = {"仕込":"仕込み品(明日の分)","廃棄":"本日の廃棄","冷蔵":"冷蔵","冷凍":"冷凍","常温":"常温・資材"};
// 売れ数 → 消費量 換算(理論消費を引くのは茹で麺・仕込みソース)
// ハーフは麺・ソースとも通常の半量
const PASTA = [["オリオン",1],["オリオン ハーフ",0.5],["ナシナシ",1],["ナシナシ ハーフ",0.5],
               ["TGオリオン",1],["TGオリオン ハーフ",0.5],["TGナシナシ",1],["TGナシナシ ハーフ",0.5]];
const CONSUME = {
  "茹で麺": PASTA,
  "ソース(仕込済)": PASTA,
  "コカ・コーラ": [["コカ・コーラ",1]],
  "コカ・コーラ ゼロ": [["コカ・コーラ ゼロ",1]],
  "ジンジャーエール": [["ジンジャーエール",1]],
  "キリンラガー 小瓶": [["キリンラガー 小瓶",1]],
  "折箱": [["折箱",1],["TGオリオン",1],["TGオリオン ハーフ",1],["TGナシナシ",1],["TGナシナシ ハーフ",1]],
  "持ち帰り袋": [["折箱",1],["TGオリオン",1],["TGオリオン ハーフ",1],["TGナシナシ",1],["TGナシナシ ハーフ",1]]
};

function loadStockSaved(){
  try{
    const v = JSON.parse(localStorage.getItem("orion-stock") || "{}");
    return v.items ? v : {date:"", items:v}; // 旧形式互換
  }catch(e){ return {date:"", items:{}}; }
}
function usageToday(name, sold){
  const map = CONSUME[name];
  if(!map) return null; // 乾麺・ラード・割り箸などは自動計算対象外
  let u = 0;
  map.forEach(([menu,per])=>{ u += (sold[menu]||0) * per; });
  return Math.round(u * 100) / 100;
}

// 初回用デモ前回値(実記録が1回でもあれば使われません)
const DEMO_PREV = {"茹で麺":40,"ソース(仕込済)":30,"乾麺":8,"ケチャップ":4,"ラード":2,
  "コカ・コーラ":24,"コカ・コーラ ゼロ":12,"ジンジャーエール":12,"キリンラガー 小瓶":12,
  "冷凍ストック麺":10,"粉チーズ(卓上予備)":2,"タバスコ(卓上予備)":2,
  "折箱":30,"持ち帰り袋":50,"割り箸":100};

function stockCalc(n, saved, sold){
  const real = saved.items[n];
  const isDemo = real == null;
  const prev = isDemo ? DEMO_PREV[n] : real;
  const use = usageToday(n, sold);
  const theo = (prev != null && use != null) ? Math.max(0, Math.round((prev - use)*100)/100)
             : (prev != null ? prev : null);
  return {prev, use, theo, isDemo};
}
async function openStock(){
  $("stockOv").classList.add("show");
  const saved = loadStockSaved();
  const daily = await loadDaily();
  const sold = daily.items || {};
  window._stockCtx = {saved, sold};
  let html = "";
  SEC_ORDER.forEach(sec=>{
    const rows = STOCK_ITEMS.map((it,i)=>[it,i]).filter(([it])=>it[3]===sec);
    if(!rows.length) return;
    html += `<div class="stSec ${sec==="廃棄"?"haiki":""}">${SEC_LABEL[sec]}</div>`;
    rows.forEach(([[n,u,pt,cat],i])=>{
      const isWaste = cat === "廃棄";
      let hint, ptLabel;
      if(isWaste){
        hint = "余って捨てた数を入力(なければ0)";
        ptLabel = "";
      }else{
        const c = stockCalc(n, saved, sold);
        const tag = c.isDemo ? "(デモ)" : (saved.date ? "(" + saved.date.slice(5) + ")" : "");
        hint = `前回残 ${c.prev ?? "-"}${tag} / 本日出 ${c.use ?? "-"} → 理論残 ${c.theo ?? "-"}`;
        ptLabel = pt != null ? "発注点 " + pt : "";
      }
      html += `<div class="fm ${isWaste?"waste":""}" id="st${i}">
        <span class="nm">${n}</span>
        <span class="in"><input type="number" inputmode="decimal" id="sq${i}" placeholder="${isWaste?"0":"-"}" oninput="checkStock(${i})"> ${u}</span>
        <span class="pt" id="sp${i}">${ptLabel}</span>
        <span class="hint">${hint}</span>
      </div>`;
    });
  });
  $("stockList").innerHTML = html;
  STOCK_ITEMS.forEach((_,i)=>checkStock(i));
}
function fillTheoretical(){
  const {saved, sold} = window._stockCtx || {saved:{items:{}}, sold:{}};
  STOCK_ITEMS.forEach(([n,u,pt,cat],i)=>{
    if(cat === "廃棄") return; // 廃棄は実数のみ
    const c = stockCalc(n, saved, sold);
    if(c.theo != null){ $("sq"+i).value = c.theo; }
    checkStock(i);
  });
}
function checkStock(i){
  const v = $("sq"+i).value;
  const pt = STOCK_ITEMS[i][2];
  const cat = STOCK_ITEMS[i][3];
  if(pt == null || cat === "廃棄") return;
  const need = v !== "" && parseFloat(v) <= pt;
  $("st"+i).classList.toggle("need", need);
  $("sp"+i).textContent = need ? "要発注!" : "発注点 " + pt;
}
async function saveStock(){
  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const dateStr = `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}`;
  const stocks = [], items = {};
  STOCK_ITEMS.forEach(([n,u,pt,cat],i)=>{
    const v = $("sq"+i).value;
    if(v === "") return;
    const qty = parseFloat(v) || 0;
    if(cat !== "廃棄") items[n] = qty; // 廃棄は次回の「前回残」に含めない
    stocks.push({n, qty, pt: pt ?? "", cat, need: pt != null && cat !== "廃棄" && qty <= pt});
  });
  if(!stocks.length){ alert("残量を入力してください"); return; }
  localStorage.setItem("orion-stock", JSON.stringify({date: dateStr, items}));
  const rec = {
    type: "stock",
    date: dateStr,
    time: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
    stocks
  };
  const q = loadQueue(); q.push(rec); saveQueue(q);
  flushQueue();
  const needs = stocks.filter(x=>x.need).map(x=>x.n);
  $("stockOv").classList.remove("show");
  alert(needs.length ? "記録しました。要発注: " + needs.join("・") : "記録しました(発注不要)");
}

function camRow(label, val){
  return `<div class="li"><span>${label}</span><span><b>${val}</b></span></div>`;
}
function renderCam(d, sourceLabel){
  let html = "";
  html += camRow("現在の行列", (d.queue_now!=null? d.queue_now+"人":"-"));
  html += camRow("本日最大行列", (d.queue_max!=null? d.queue_max+"人":"-"));
  html += camRow("本日の通行", (d.passers!=null? d.passers+"人":"-"));
  html += camRow("行列参加", (d.joined!=null? d.joined+"人":"-"));
  html += camRow("入店", (d.entries!=null? d.entries+"人":"-"));
  html += camRow("離脱", (d.left!=null? d.left+"人":"-"));
  if(d.avg_wait) html += camRow("平均待ち時間", d.avg_wait);
  html += `<div class="li"><span style="font-size:11px;color:#8a7a5c">${sourceLabel}</span><span></span></div>`;
  $("camList").innerHTML = html;
}

async function openCamera(){
  $("camOv").classList.add("show");
  $("camList").innerHTML = "取得中...";

  // ① 解析機ローカルAPI(店内Wi-Fi接続時・通信量ゼロ)
  if(CAMERA_LOCAL_URL){
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 3000);
      const res = await fetch(CAMERA_LOCAL_URL, {signal: ctrl.signal});
      clearTimeout(timer);
      const d = await res.json();
      renderCam(d, "リアルタイム(解析機から直接取得) " + (d.time||""));
      return;
    }catch(e){ /* ローカル未接続 → 同期済みデータへ */ }
  }

  // ② 前回同期済みデータ(スプレッドシート経由)
  try{
    const res = await fetch(SHEET_URL);
    const data = await res.json();
    const today = data.daily.find(x=>x.date===data.todayKey);
    const cam = today && today.camera;
    if(cam){
      renderCam({
        passers: cam["通行"], entries: cam["入店"], joined: cam["行列参加"],
        left: cam["離脱"], queue_max: cam["最大行列"], queue_now: null
      }, "前回同期時点のデータ(" + data.updated + " 更新)");
    }else{
      $("camList").innerHTML = "本日のカメラデータはまだ同期されていません。<br><br>店内では解析機のWi-Fiに接続するとリアルタイム表示、それ以外では閉店後の同期以降に表示されます。";
    }
  }catch(e){
    $("camList").innerHTML = "取得できませんでした。通信状態を確認してください。";
  }
}

async function openSummary(){
  const d = await loadDaily();
  let html = "";
  html += `<div class="li"><span><b>合計</b></span><span><b>${d.count}件 / ${d.sum.toLocaleString()}円</b></span></div>`;
  html += `<div class="li"><span>店内 / 持ち帰り</span><span>${d.modes["店内"]||0}件 / ${d.modes["持ち帰り"]||0}件</span></div>`;
  html += `<div class="li"><span>現金 / PayPay</span><span>${(d.sum-(d.paypay||0)).toLocaleString()}円 / ${(d.paypay||0).toLocaleString()}円</span></div>`;
  if(d.disc) html += `<div class="li"><span>値引きの回数</span><span>${d.disc}回</span></div>`;
  const names = Object.keys(d.items);
  if(names.length){
    ALL_ITEMS.forEach(m=>{
      if(d.items[m.n]) html += `<div class="li"><span>${m.n}</span><span>${d.items[m.n].q}個　${d.items[m.n].yen.toLocaleString()}円</span></div>`;
    });
  }else{
    html += `<div class="li"><span>商品別の記録はまだありません</span><span></span></div>`;
  }
  $("sumList").innerHTML = html;
  $("sumOv").classList.add("show");
}

$("mEat").onclick = ()=>{ mode="店内"; $("mEat").classList.add("on"); $("mTo").classList.remove("on"); renderGrid(); refresh(); };
$("mTo").onclick  = ()=>{ mode="持ち帰り"; $("mTo").classList.add("on"); $("mEat").classList.remove("on"); renderGrid(); refresh(); };

refresh(); refreshDaily(); flushQueue();
