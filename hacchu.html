<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>発注 | 洋食オリオン</title>
<meta name="theme-color" content="#2c4f39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="発注">
<link rel="apple-touch-icon" sizes="180x180" href="icon-hacchu-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-hacchu-192.png">
<link rel="manifest" href="manifest-hacchu.json">
<style>
:root{ --g:#2c4f39; --g-d:#1f3a2a; --g-l:#e4eee7; --cream:#faf6ee; --cream-d:#ece4d2; --ink:#2b2a26; --mute:#7a7265; --red:#a33c2e; --red-l:#f6e3df; --amber:#b7791f; --amber-l:#f7ebd3; --line:#d9d1bd; --r:14px; --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer}
.login{padding:calc(36px + var(--sat)) 22px 40px;overflow-y:auto}
.login h1{font-size:14px;letter-spacing:6px;text-align:center;color:var(--g);margin:0 0 4px}
.login .store{text-align:center;color:var(--mute);font-size:13px;margin-bottom:14px}
.credo{display:flex;flex-direction:column;gap:3px;text-align:center;color:var(--g);font-size:14px;font-weight:bold;letter-spacing:1px;line-height:1.5;margin:0 0 26px;padding:12px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font-size:17px;background:#fff;font-family:inherit;color:var(--ink)}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--g);color:#fff;font-size:16px;font-weight:bold;letter-spacing:2px}
.btn.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;letter-spacing:0}
.btn.out{background:var(--red)}
.btn:disabled{opacity:.5}
header{background:var(--g);color:#fff;padding:calc(10px + var(--sat)) 14px 10px;display:flex;justify-content:space-between;align-items:center}
header .t{font-size:11px;letter-spacing:4px;opacity:.85}header .n{font-size:16px;font-weight:bold}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
main{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav button{flex:1;border:0;background:none;padding:8px 2px 6px;font-size:11px;color:var(--mute);position:relative}
nav button i{display:block;font-style:normal;font-size:18px;line-height:1.2}
nav button.on{color:var(--g);font-weight:bold}
nav .bd{position:absolute;top:4px;right:calc(50% - 20px);background:var(--red);color:#fff;font-size:10px;border-radius:999px;min-width:16px;height:16px;line-height:16px;padding:0 4px;text-align:center}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.card h2{font-size:12px;letter-spacing:2px;color:var(--g);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{letter-spacing:0;color:var(--mute);font-weight:normal}
.mini{font-size:12px;color:var(--mute)}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;background:var(--g-l);color:var(--g);font-weight:bold}
.pill.amber{background:var(--amber-l);color:var(--amber)}.pill.red{background:var(--red-l);color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .l{min-width:0;flex:1}.row .l small{display:block;font-size:11px;color:var(--mute)}
.todo{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;text-align:left;width:100%}
.todo.urgent{border-color:var(--amber);background:var(--amber-l)}
.todo .ic{font-size:22px;width:30px;text-align:center}
.todo .tt{flex:1}.todo .tt b{display:block;font-size:15px}.todo .tt small{color:var(--mute);font-size:12px}
.todo .ar{color:var(--mute)}
.sup .btn,.sup .btn + .btn{margin-top:0}
div.sec{font-size:11px;letter-spacing:2px;color:var(--mute);margin:14px 4px 6px} /* 区分の見出し。button.btn.sec（白いボタン）には効かせない */
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:bold;color:var(--g)}
.step .v{min-width:62px;text-align:center;font-size:19px;font-weight:bold;font-variant-numeric:tabular-nums}
.step .v small{font-size:10px;color:var(--mute);font-weight:normal;margin-left:2px}
.step .v.chg{color:var(--g)}
.tri{display:flex;gap:4px}
.tri button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:8px 9px;font-size:12px;font-weight:bold;color:var(--ink);min-width:46px}
.tri button.on{background:var(--g);color:#fff;border-color:var(--g)}
.tri button.on.low{background:var(--amber);border-color:var(--amber)}
.tri button.on.out{background:var(--red);border-color:var(--red)}
.seg{display:flex;background:var(--cream-d);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:13px;color:var(--mute);font-weight:bold}
.seg button.on{background:#fff;color:var(--g);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--cream) 30%);padding:10px 0 4px}
.qty{width:70px;padding:8px;text-align:right;font-size:17px}
.ovl{position:fixed;inset:0;background:rgba(20,30,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--cream);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + var(--sab));max-height:92vh;overflow-y:auto}
.sheet h3{margin:0 0 10px;font-size:16px;color:var(--g)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.toast{position:fixed;left:50%;bottom:calc(70px + var(--sab));transform:translateX(-50%);background:var(--g-d);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1}
#msg:empty{display:none}#msg{background:var(--red-l);color:var(--red);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.tbl th{font-size:11px;color:var(--mute);font-weight:normal}
.loading{text-align:center;color:var(--mute);padding:30px 0}
.flowbar{display:flex;align-items:center;gap:6px;justify-content:center;margin:2px 0 12px;font-size:13px;color:var(--mute)}
.flowbar span{padding:5px 10px;border-radius:999px;background:var(--g-l);color:var(--g)} .flowbar span.on{background:var(--amber);color:#fff;font-weight:bold} .flowbar i{font-style:normal}
.stp{display:flex;align-items:center;gap:8px;margin-bottom:4px} .stp b{font-size:17px;flex:1}
.stp .no{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;background:var(--amber);color:#fff} .stp .no.ok{background:var(--g)}
.stp .cnt{font-size:13px;color:var(--mute)}
.sup{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff} .suph{font-weight:bold;margin-bottom:4px} .suph small{font-weight:normal;color:var(--mute);font-size:12px;margin-left:4px}
.lnk{border:0;background:none;color:var(--g);font-size:14px;padding:6px 0;text-decoration:underline}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 16px} .links button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;text-align:center;font-size:13px;color:var(--ink)} .links small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.ar{color:var(--mute)}
.sup .btn,.sup .btn + .btn{margin-top:0}
.mstrip{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px;padding-bottom:2px;scrollbar-width:none}
.mstrip::-webkit-scrollbar{display:none}
.mday{flex:1 0 54px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 2px;text-align:center;font-family:inherit;color:var(--ink);position:relative}
.mday small{display:block;font-size:10px;color:var(--mute)}
.mday b{font-size:16px}
.mday i{position:absolute;top:-6px;right:-4px;background:var(--amber,#b7791f);color:#fff;font-style:normal;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}
.mday.plus{border-color:var(--amber,#b7791f)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.prow:first-of-type{border-top:0}
.big{font-size:20px;font-weight:bold;color:var(--g)}
.hint{background:var(--amber-l);color:var(--amber);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:13px}
.hint.red{background:var(--red-l);color:var(--red)}
.dl{font-size:12px;font-weight:bold;border-radius:999px;padding:2px 9px;white-space:nowrap}
.dl.red{background:var(--red-l);color:var(--red)}.dl.amb{background:var(--amber-l);color:var(--amber)}.dl.ok{background:var(--g-l);color:var(--g)}
.suph{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.lbar{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.lbar .nm{width:120px;flex:none;line-height:1.3}.lbar .tr{flex:1;height:8px;background:#eee8dc;border-radius:4px;overflow:hidden}.lbar .tr i{display:block;height:100%}
.lbar .d{width:96px;text-align:right;font-size:12px;flex:none}
.prog{height:8px;background:#eee8dc;border-radius:4px;overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--g)}
.trow .okb{border:2px solid var(--g);color:var(--g);background:#fff;border-radius:10px;padding:7px 8px;font-size:13px;font-weight:bold;white-space:nowrap;font-family:inherit}
.trow.done .l{color:var(--mute)}.trow.done .qty{border-color:var(--g);background:var(--g-l)}
</style>
</head>
<body>
<div class="app">
  <div id="vBoot" style="padding:80px 20px;text-align:center;color:#7a7265;font-size:14px">読み込み中…</div>
  <div id="vLogin" class="login hide">
    <h1>発 注</h1>
    <div class="store">洋食オリオン｜在庫・発注管理</div>
    <div class="credo"><span>古いけれど、清潔。</span><span>下町だけれど、丁寧。</span><span>親しみやすいけれど、雑ではない。</span></div>
    <div id="loginMsg"></div>
    <label>名前</label><select id="staffSel"><option value="">読み込み中…</option></select>
    <label>パスコード（勤怠アプリと同じ）</label>
    <input type="password" inputmode="numeric" pattern="[0-9]*" id="passIn" placeholder="●●●●" autocomplete="off">
    <div style="height:18px"></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">ログイン</button>
    <p class="mini" style="text-align:center;margin-top:16px">勤怠アプリにログイン済みのスマホでは、そのまま入れます</p>
  </div>

  <div id="vApp" class="hide" style="display:flex;flex-direction:column;height:100%">
    <header><button id="hBack" class="hide" onclick="if(PAGE==='home'&&FROM_STAFF){ location.href='staff/'; } else if(FROM_STAFF && (location.hash==='#chef'||location.hash==='#hall'||location.hash==='#report')){ location.href='staff/'; } else go('home')" style="margin-right:8px">‹ 戻る</button><div style="flex:1"><div class="t" id="hTitle">発 注</div><div class="n" id="hName">-</div></div><button onclick="loadHome(true)">更新</button></header>
    <main id="main">
      <div id="msg"></div>
      <section id="pHome"><div class="loading">読み込み中…</div></section>
      <section id="pStock" class="hide"></section>
      <section id="pPrep" class="hide"></section>
      <section id="pOrder" class="hide"></section>
      <section id="pReport" class="hide"></section>
      <section id="pMaster" class="hide"></section>
    </main>
  </div>
</div>
<div id="ov"></div>
<div class="toast" id="toast"></div>

<script src="busy.js?v=1101b"></script>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzFNl4UM3fkoANru-agWmuOox-h3cS1yJmx4UZxpGFemEBnAUv45Gdp1VOvtCqOVUg/exec";
const STAFF_API = "https://script.google.com/macros/s/AKfycbwgGW6rXzAW2rHVicdoCMdHOT_E3egrXPsaEJerX-_brZr0mYF6Qo_tRorX8PgLc7c/exec";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let TOKEN = localStorage.getItem("os-token") || "";
let HOME = null, ME = null, MASTER = [], CHEF = [], PAGE = "home", OWNER = "シェフ", PRICES = [], MQ = "";
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); }
function showMsg(m){ $("msg").textContent = m||""; }
function closeOv(){ $("ov").innerHTML=""; }
function sheet(html){ $("ov").innerHTML = `<div class="ovl" onclick="if(event.target===this)closeOv()"><div class="sheet"><div class="grab"></div>${html}</div></div>`; }
async function get(mode, params){ const q = Object.assign({mode, token:TOKEN, t:Date.now()}, params||{}); const u = SHEET_URL+"?"+Object.keys(q).map(k=>k+"="+encodeURIComponent(q[k])).join("&");
  try{ const r = await fetch(u, {cache:"no-store"}); return await r.json(); }catch(e){ return {error:"通信エラー"}; } }
async function post(type, body){ try{ const r = await fetch(SHEET_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(Object.assign({type, token:TOKEN}, body||{}))}); return await r.json(); }catch(e){ return {error:"通信エラー"}; } }
function fmtD(s){ if(!s) return "—"; const m = String(s).match(/(\d{4})\/(\d{2})\/(\d{2})/); return m ? Number(m[2])+"/"+Number(m[3]) : s; }
function daysAgo(s){ if(!s) return null; const m = String(s).match(/(\d{4})\/(\d{2})\/(\d{2})/); if(!m) return null; const d = new Date(Number(m[1]),Number(m[2])-1,Number(m[3])); const t = new Date(); t.setHours(0,0,0,0); return Math.round((t-d)/86400000); }

// ───── ログイン（勤怠アプリと同じ名前・パスコード） ─────
async function boot(){
  // 勤怠アプリ（os-token）か管理画面（os-admin-token）のログインをそのまま使う
  const cands = [localStorage.getItem("os-token"), localStorage.getItem("os-admin-token")].filter(Boolean);
  // 前回の内容があればすぐ表示し、裏で最新に差し替える（開くたびにログイン画面が出ないように）
  let cached = null; try{ cached = JSON.parse(localStorage.getItem("hacchu-home")||"null"); }catch(e){}
  const shown = !!(cands.length && cached && cached.items);
  if (shown){ TOKEN = cands[0]; enterApp(cached); }
  for (const tk of cands){ TOKEN = tk; const r = await get("inv_home"); if(!r.error){ saveHomeCache(r); if(shown){ applyHome(r); if(PAGE==="home") renderHome(); } else enterApp(r); return; }
    if(r.error!=="auth"){ if(shown){ showMsg(r.error); return; } showLogin(r.error); return; } }
  TOKEN = ""; try{ localStorage.removeItem("hacchu-home"); }catch(e){} showLogin();
}
function saveHomeCache(r){ try{ localStorage.setItem("hacchu-home", JSON.stringify(r)); }catch(e){} }
async function showLogin(msg){
  $("vBoot").classList.add("hide"); $("vLogin").classList.remove("hide"); $("vApp").classList.add("hide"); $("loginMsg").textContent = msg||"";
  try{ const r = await (await fetch(STAFF_API+"?action=staff_list")).json(); $("staffSel").innerHTML = `<option value="">名前を選んでください</option>` + (r.staff||[]).map(s=>`<option value="${s.staff_id}">${esc(s.name)}</option>`).join(""); }catch(e){ $("loginMsg").textContent="通信できません"; }
}
async function doLogin(){
  const id = $("staffSel").value, pass = $("passIn").value; if(!id){ $("loginMsg").textContent="名前を選んでください"; return; } if(!pass){ $("loginMsg").textContent="パスコードを入力してください"; return; }
  $("loginBtn").disabled = true;
  try{ const r = await (await fetch(STAFF_API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"login",staff_id:id,passcode:pass})})).json();
    if(!r.ok){ $("loginMsg").textContent = r.error||"ログインできません"; return; }
    TOKEN = r.token; localStorage.setItem("os-token", TOKEN); $("passIn").value=""; const h = await get("inv_home"); if(h.error){ $("loginMsg").textContent=h.error; return; } saveHomeCache(h); enterApp(h);
  }catch(e){ $("loginMsg").textContent="通信できません"; } finally{ $("loginBtn").disabled=false; }
}
const FROM_STAFF = /[?&]from=staff/.test(location.search);
function enterApp(h){ $("vBoot").classList.add("hide"); $("vLogin").classList.add("hide"); $("vApp").classList.remove("hide"); applyHome(h);
  const hk = (location.hash||"").slice(1);
  loadPreps();
  if (hk==="chef"){ OWNER="シェフ"; go("prep"); } else if (hk==="take"){ OWNER="シェフ"; go("stock"); } else if (hk==="hall"){ OWNER="ホール"; go("stock"); } else if (hk==="report"){ go("report"); } else { go("home"); if (hk==="recv") setTimeout(()=>{ const c = $("ordCard"); if (c) c.scrollIntoView({behavior:"smooth"}); }, 200); } autoRecv(); loadPrices().then(()=>{ if(PAGE==="master") renderMaster(); }); }
const TITLES = {home:"発 注", prep:"仕込み", stock:"棚卸し（在庫を数える）", order:"発 注", report:"不足・破損の報告", master:"品目と価格"};
function go(p){ if(p==="order") p="home"; PAGE = p; ["home","stock","order","report","master","prep"].forEach(x=>{ $("p"+x[0].toUpperCase()+x.slice(1)).classList.toggle("hide", x!==p); }); showMsg(""); closeOv();
  $("hTitle").textContent = TITLES[p]||"発 注"; $("hBack").classList.toggle("hide", p==="home" && !FROM_STAFF); $("hBack").textContent = (FROM_STAFF && (p==="home" || /chef|hall|report|take/.test(location.hash))) ? "‹ 勤怠" : "‹ 戻る";
  if(p==="home") renderHome(); if(p==="prep") renderPrep(); if(p==="stock") renderStock(); if(p==="report") renderReport(); if(p==="master"){ renderMaster(); if(!PRICES.length) loadPrices().then(renderMaster); } $("main").scrollTo(0,0); }
async function loadHome(reload){ const r = await get("inv_home"); if(!r.error) saveHomeCache(r); if(r.error){ if(r.error==="auth"){ TOKEN=""; localStorage.removeItem("os-token"); showLogin("ログインし直してください"); } else showMsg(r.error); return; } applyHome(r); if(reload) toast("更新しました"); go(PAGE); }
function applyHome(h){ HOME = h; ME = h.me; MASTER = h.items||[]; CHEF = h.chefNames||[]; $("hName").textContent = ME.name + (ME.role==="admin"?"（管理者）":""); OWNER = CHEF.includes(ME.name) ? "シェフ" : (ME.role==="admin" ? "シェフ" : "ホール"); FLOOR = !CHEF.includes(ME.name) && ME.role!=="admin";
  h.suggest = (h.suggest||[]).filter(x=>!x.plan).concat(buildPlan());
}

// ───── 発注計画（使用量 × 納品日 × 発注倍数）─────
// ・納品は営業終了（14:00）と同時刻以降に届くので、届いた日の昼には使えない
// ・発注量 ＝ 次の納品の翌日から、その次の納品日までの不足分。発注倍数（ケース・90個など）で切り上げ
// ・安全在庫ぶんで1単位増やすのは、不足が1単位の半分を超えるときだけ
// ・使う量は日ごとの見込み食数で計算（直近4週の同じ曜日の実績平均。足りなければ直近の営業日平均→55食）。増える日だけ「+食数」を足せる
let PLAN = {}, MEALS_DEF = 55, DAILY = null, EXTRA = {};
try{ EXTRA = JSON.parse(localStorage.getItem("inv-extra")||"{}") || {}; }catch(e){}
function loadDaily(){ try{ const c = JSON.parse(localStorage.getItem("dash-data")||"null"); if (c && c.daily) DAILY = c.daily; }catch(e){} }
loadDaily();
// 分析と同じ売上データ（日別の食数）を裏で取り直す。画面は待たない

    if (["1/1","2/11","2/23","4/29","5/3","5/4","5/5","8/11","11/3","11/23"].includes(mo+"/"+dd)) return true;
    const nm = (m, n)=>{ const f = new Date(yy, m-1, 1).getDay(); return 1 + ((8 - f) % 7) + (n-1)*7; };
    if ((mo===1&&dd===nm(1,2))||(mo===7&&dd===nm(7,3))||(mo===9&&dd===nm(9,3))||(mo===10&&dd===nm(10,2))) return true;
    const k = yy - 1980, sp = Math.floor(20.8431 + 0.242194*k - Math.floor(k/4)), au = Math.floor(23.2488 + 0.242194*k - Math.floor(k/4));
    return (mo===3&&dd===sp)||(mo===9&&dd===au); };

}

function tohoSlots(now, n){ const out = []; let d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  for (let i = 0; i < 21 && out.length < n; i++, d = addD(d,1)){ if (![1,3,5].includes(d.getDay()) || jpHoliday(d)) continue; const arr = atTime(d, "14:00"), co = atTime(addD(d,-1), "17:00"); if (arr <= now || co <= now) continue; out.push({ day:new Date(d), key:dayKey(d), co }); }
  return out; }
function isToho(it){ return /トーホー/.test(it.supplier||""); }
function isShop(it){ return /店頭/.test(it.supplier||"") || it.cutoff==="店頭"; }
// D1 着で D2 の昼までをまかなう量（planItem と同じ考え方）
function coverQty(it, now, D1, D2){ const rate = it.usage60/60, p = PLAN[it.id]; if (!p || p.cur === undefined) return 0; const mult = it.mult||1, safetyQ = (it.safety||0)*rate*MEALS_DEF;
  const arr1 = atTime(D1, it.time||"14:00"), end = atTime(D2, CLOSE); let s = p.cur, minS = Infinity;
  for (const e of simulate(it, rate, now, end)){ s += e.q; if (e.k===0 && e.t > arr1) minS = Math.min(minS, s); }
  if (minS === Infinity) return 0; const target = Math.max(0, -minS), safetyDef = Math.max(0, safetyQ - minS); let q = ceilTo(target, mult); if (q < safetyDef && safetyDef - q > mult/2) q += mult; return Math.max(q, 0); }
function lastOkLunch(short){ let d = addD(short,-1); for (let i=0;i<10 && !isOpen(d);i++) d = addD(d,-1); return d; }
function tohoPlan(now){ const slots = tohoSlots(now, 4); const by = {}; slots.forEach(s=>by[s.key] = { slot:s, items:[], ordered:[] }); const late = [];
  MASTER.filter(isToho).forEach(it=>{ const p = PLAN[it.id]; if (!p || !p.short || it.usage60===null) return; const sd = new Date(p.short.getFullYear(), p.short.getMonth(), p.short.getDate());
    let k = -1; slots.forEach((s,i)=>{ if (s.day < sd) k = i; });
    if (k < 0){ late.push({ it, short:p.short }); return; } if (k >= 3) return;
    const D2 = slots[k+1] ? slots[k+1].day : addD(slots[k].day, 2); const q = coverQty(it, now, slots[k].day, D2) || (it.mult||1);
    by[slots[k].key].items.push({ it, qty:q, short:p.short }); });

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>調査日</label><input id="pr_date" type="date" value="${esc((p.date||"").replace(/\//g,"-"))}"></div><div><label>出典</label><input id="pr_src" value="${esc(p.src)}" placeholder="実地調査・納品書など"></div></div>
    <label>メモ</label><input id="pr_memo" value="${esc(p.memo)}">
    <div style="height:14px"></div><button class="btn" onclick="savePrice('${id||""}')">保存</button>
    ${id?`<button class="btn sec" style="margin-top:8px;color:var(--red);border-color:var(--red)" onclick="delPrice('${id}')">この価格を削除</button>`:""}
    <button class="btn sec" style="margin-top:8px" onclick="closeOv();${p.item?`openItem('${esc(p.item)}')`:""}">やめる</button>`);
}
async function savePrice(id){
  const body = { id:id||undefined, item:$("pr_item").value.trim(), supplier:$("pr_sup").value.trim(), spec:$("pr_spec").value.trim(), qty:$("pr_qty").value, unit:$("pr_unit").value, price:$("pr_price").value, date:$("pr_date").value, src:$("pr_src").value.trim(), memo:$("pr_memo").value.trim() };
  const r = await post("inv_price_save", body); if(r.error){ toast(r.error); return; } toast("保存しました"); await loadPrices(); closeOv(); renderMaster(); openItem(body.item);
}
async function delPrice(id){ if(!confirm("この価格を削除しますか？")) return; const p = PRICES.find(x=>x.id===id); const r = await post("inv_price_delete", {id}); if(r.error){ toast(r.error); return; } toast("削除しました"); await loadPrices(); closeOv(); renderMaster(); if(p) openItem(p.item); }
function editItem(id){
  const it = id ? MASTER.find(x=>x.id===id) : null; const raw = it ? {"品目":it.name,"区分":it.cat,"仕入先":it.supplier,"購入方法":it.method,"規格(入数など)":it.spec,"仕入単価(税込)":it.price===null?"":it.price,"発注単位":it.orderUnit,"入力単位":it.unit,"担当":it.owner,"管理頻度":it.freq,"最低在庫":it.min===null?"":it.min,"発注方式":it.mode,"配送・納期":it.lead,"用途(商品)":it.use,"備考":it.note} : {};
  sheet(`<h3>${it?"品目を編集":"品目を追加"}</h3>${MFIELDS.map(([k,l],i)=>`<label>${esc(l)}</label><input id="mf_${i}" value="${esc(raw[k]===undefined?"":raw[k])}">`).join("")}
    <div style="height:14px"></div><button class="btn" onclick="saveItem('${id||""}')">保存</button>${it?`<button class="btn sec" style="margin-top:8px" onclick="stopItem('${id}')">この品目を使わない（非表示）</button>`:""}<button class="btn sec" style="margin-top:8px" onclick="closeOv()">やめる</button>`);
}
async function saveItem(id){ const fields = {}; MFIELDS.forEach(([k],i)=>{ fields[k] = $("mf_"+i).value.trim(); }); const r = await post("inv_master_save", {item_id:id||undefined, fields}); if(r.error){ showMsg(r.error); closeOv(); return; } closeOv(); toast("保存しました"); loadHome(); }
async function stopItem(id){ if(!confirm("この品目を一覧から外しますか？（記録は残ります）")) return; const r = await post("inv_master_save", {item_id:id, fields:{"状態":"stop"}}); if(r.error){ showMsg(r.error); return; } closeOv(); toast("非表示にしました"); loadHome(); }

boot();
</script>
</body>
</html>
