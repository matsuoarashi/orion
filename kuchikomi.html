<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口コミ | 洋食オリオン</title>
<style>
:root{ --g:#2c4f39; --g-d:#1f3a2a; --g-l:#e4eee7; --cream:#faf6ee; --cream-d:#ece4d2; --ink:#2b2a26; --mute:#7a7265; --red:#a33c2e; --red-l:#f6e3df; --amber:#b7791f; --amber-l:#f7ebd3; --gold:#c9a24a; --line:#d9d1bd; --r:14px; --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom); }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.55}
.hide{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(10px + var(--sat)) 12px 10px;display:flex;align-items:center;gap:10px}
header .t{font-size:11px;letter-spacing:4px;opacity:.85} header .n{font-size:16px;font-weight:bold}
.tabs{position:sticky;top:0;z-index:4;display:flex;gap:6px;padding:8px 12px;background:var(--cream);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 4px;font-size:13px;color:var(--ink);position:relative}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:bold}
.tabs .bd{position:absolute;top:-5px;right:2px;min-width:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;line-height:16px}
main{padding:12px 12px calc(40px + var(--sab));max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px;justify-content:space-between}
h2 small{font-weight:normal;color:var(--mute);font-size:12px}
.mini{font-size:12.5px;color:var(--mute);line-height:1.6}
.msg{padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:12px;line-height:1.6}
.msg.err{background:var(--red-l);color:var(--red)} .msg.ok{background:var(--g-l);color:var(--g)} .msg.warn{background:var(--amber-l);color:#7a5210}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:bold;color:#fff;background:var(--g);font-family:inherit}
.btn.sec{background:var(--cream-d);color:var(--ink)} .btn.line{background:#fff;color:var(--g);border:1px solid var(--g)} .btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.5} .btn.full{display:block;width:100%;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)} .chips button.on{border-color:var(--g);color:var(--g);font-weight:bold;background:var(--g-l)}
.rv .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.star{color:var(--gold);letter-spacing:1px;font-size:15px} .star.low{color:var(--red)}
.rv .tx{white-space:pre-wrap;margin:6px 0;font-size:14.5px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin:0 4px 2px 0;background:var(--cream-d);color:var(--ink)} .tag.st{background:var(--amber-l);color:#7a5210} .tag.ok{background:var(--g-l);color:var(--g)} .tag.no{background:#eee;color:#777}
.reply{background:var(--g-l);border-radius:10px;padding:10px;font-size:14px;white-space:pre-wrap;margin-top:6px}
textarea,input,select{width:100%;font-family:inherit;font-size:16px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 3px}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap} th:first-child,td:first-child{text-align:left}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;font-size:14px} .kv span{color:var(--mute);font-size:12.5px}
.sw{display:flex;gap:6px;flex-wrap:wrap} .sw button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px} .sw button.on{background:var(--g);color:#fff;border-color:var(--g)}
.code{font-size:26px;font-weight:bold;letter-spacing:6px;color:var(--g);font-variant-numeric:tabular-nums}
pre{white-space:pre-wrap;font-family:inherit;font-size:13.5px;background:var(--cream);border-radius:10px;padding:10px;max-height:340px;overflow:auto}
.ovl{position:fixed;inset:0;background:rgba(20,30,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--cream);width:100%;max-width:600px;border-radius:18px 18px 0 0;padding:14px 16px calc(24px + var(--sab));max-height:92vh;overflow-y:auto}
.sheet h3{font-size:16px;color:var(--g);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1}
ol.steps{padding-left:20px;font-size:14px} ol.steps li{margin:6px 0}
</style>
</head>
<body>
<header><div style="flex:1"><div class="t">口コミ</div><div class="n">Google ビジネスプロフィール</div></div></header>
<div class="tabs" id="tabs">
  <button id="t_rv" class="on" onclick="tab('rv')">口コミ<span class="bd hide" id="bdRv"></span></button>
  <button id="t_pf" onclick="tab('pf')">プロフィール<span class="bd hide" id="bdPf"></span></button>
  <button id="t_pm" onclick="tab('pm')">数字</button>
</div>
<main>
  <div id="msg"></div>
  <section id="p_rv"><div id="rvHead"></div><div class="chips" id="rvF"></div><div id="rvList"><div class="mini">読み込み中…</div></div></section>
  <section id="p_pf" class="hide"><div id="pfBody"><div class="mini">読み込み中…</div></div></section>
  <section id="p_pm" class="hide"><div id="pmBody"><div class="mini">読み込み中…</div></div></section>
</main>
<div id="ov"></div><div class="toast" id="toast"></div>
<script src="busy.js?v=1101b"></script>
<script>
// 口コミ（管理者）：Google の口コミ返信（AI 下書き→承認して送る）、プロフィール（祝日の休業・説明文）、数字。GAS：gbp.gs。LINE のオーナー配信は「設定」（settei.html）へ移した（11/4）
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzFNl4UM3fkoANru-agWmuOox-h3cS1yJmx4UZxpGFemEBnAUv45Gdp1VOvtCqOVUg/exec";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const YO = ["日","月","火","水","木","金","土"];
let TOKEN = "", RV = null, PF = null, PM = null, RVF = "wait", CUR = "rv";
try{ TOKEN = localStorage.getItem("os-admin-token") || localStorage.getItem("os-token") || ""; }catch(e){}
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); }
function msg(t, c){ $("msg").innerHTML = t ? `<div class="msg ${c||"err"}">${t}</div>` : ""; }
function closeOv(){ $("ov").innerHTML=""; }
function sheet(h){ $("ov").innerHTML = `<div class="ovl" onclick="if(event.target===this)closeOv()"><div class="sheet">${h}</div></div>`; }
async function get(mode, p){ const q = Object.assign({mode, token:TOKEN, t:Date.now()}, p||{}); try{ const r = await fetch(SHEET_URL+"?"+Object.keys(q).map(k=>k+"="+encodeURIComponent(q[k])).join("&"), {cache:"no-store"}); return await r.json(); }catch(e){ return {error:"通信エラー"}; } }
async function post(type, b){ try{ const r = await fetch(SHEET_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(Object.assign({type, token:TOKEN}, b||{}))}); return await r.json(); }catch(e){ return {error:"通信エラー"}; } }
function stars(n){ return `<span class="star ${n<=2?"low":""}">${"★".repeat(n)}${"☆".repeat(5-n)}</span>`; }
function tab(t){ CUR = t; ["rv","pf","pm"].forEach(x=>{ $("p_"+x).classList.toggle("hide", x!==t); $("t_"+x).classList.toggle("on", x===t); }); msg("");
  if (t==="rv") loadRv(); if (t==="pf") loadPf(); if (t==="pm") loadPm(); try{ localStorage.setItem("kc-tab", t); }catch(e){} }

// ───── 口コミ ─────
async function loadRv(){ const r = await get("os_gbp_reviews"); if (r.error){ msg(r.error==="auth"?"管理者アプリでログインしてください":esc(r.error)); return; } RV = r; renderRv(); }
const isWait = x => x.status==="新着" || x.status==="下書き済";
function renderRv(){
  const wait = RV.list.filter(isWait); $("bdRv").textContent = wait.length; $("bdRv").classList.toggle("hide", !wait.length);
  $("rvHead").innerHTML = `<div class="card"><h2>${RV.avg!==null?`平均 ${stars(Math.round(RV.avg))} ${RV.avg}`:"口コミ"} <small>${RV.count}件</small></h2>
    <div class="mini">${RV.ready ? `Google と連携中。1時間ごとに取り込み、新しい口コミには下書きを先に作ります${RV.lastSync?"（最後 "+esc(RV.lastSync)+"）":""}` : `Google の API の承認待ちです。それまでは Google の画面から口コミを「手で入れる」と、同じように下書きを作れます`}</div>
    <div class="row">${RV.ready?`<button class="btn line" onclick="syncNow(this)">今すぐ取り込む</button>`:""}<button class="btn sec" onclick="manualRv()">＋ 口コミを手で入れる</button></div></div>`;
  $("rvF").innerHTML = [["wait","返信待ち "+wait.length],["done","返信済み"],["all","すべて"]].map(([k,l])=>`<button class="${RVF===k?"on":""}" onclick="RVF='${k}';renderRv()">${l}</button>`).join("");
  const xs = RV.list.filter(x=>RVF==="all" ? true : RVF==="wait" ? isWait(x) : !isWait(x));
  $("rvList").innerHTML = xs.length ? xs.map(rvCard).join("") : `<div class="mini" style="padding:8px">${RVF==="wait"?"返信待ちの口コミはありません":"まだありません"}</div>`;
}
function rvCard(x){
  const st = isWait(x) ? `<span class="tag st">${x.status==="新着"?"新着":"下書きあり"}</span>` : x.status==="返信しない" ? `<span class="tag no">返信しない</span>` : `<span class="tag ok">返信済み</span>`;
  let body = "";
  if (isWait(x)) body = `<label>返信の下書き（洋食オリオン 店長）</label><textarea id="dr_${x.id}" rows="6">${esc(x.draft)}</textarea>
    <div class="row"><button class="btn sec" onclick="redraft('${x.id}','')">AIで作り直す</button><button class="btn sec" onclick="redraft('${x.id}','もっと短く')">短く</button><button class="btn sec" onclick="redraft('${x.id}','もっと丁寧に、お詫びを先に')">丁寧に</button><button class="btn sec" onclick="saveDraft('${x.id}')">下書きを保存</button></div>
    <div class="row">${x.src==="API" ? `<button class="btn" onclick="sendRv('${x.id}',this)">承認して Google に送る</button>` : `<button class="btn" onclick="copyRv('${x.id}')">コピーして Google を開く</button><button class="btn line" onclick="sendRv('${x.id}',this)">貼った（返信済みにする）</button>`}
      <button class="btn red" onclick="rvStatus('${x.id}','返信しない')">返信しない</button>${x.tags.length?`<button class="btn line" onclick="rvTodo('${x.id}')">やることにする</button>`:""}</div>`;
  else if (x.reply) body = `<div class="reply">${esc(x.reply)}</div><div class="mini" style="margin-top:4px">${esc(x.replyAt)}${x.by?"・"+esc(x.by):""}${x.result?"・"+esc(x.result):""}</div>`;
  else if (x.status==="返信しない") body = `<div class="row"><button class="btn sec" onclick="rvStatus('${x.id}','下書き済')">返信待ちに戻す</button></div>`;
  return `<div class="card rv"><div class="hd"><div>${stars(x.star)} <b>${esc(x.name||"（名前なし）")}</b></div><div class="mini">${esc(x.at.slice(0,10))}</div></div>
    <div>${st}${x.src==="手入力"?`<span class="tag">手入力</span>`:""}${x.tags.map(t=>`<span class="tag" style="background:var(--red-l);color:var(--red)">${esc(t)}</span>`).join("")}</div>
    <div class="tx">${esc(x.text)||'<span class="mini">（本文なし・星だけ）</span>'}</div>${body}</div>`;
}
async function syncNow(b){ b.disabled = true; b.textContent = "取り込み中…"; const r = await post("os_gbp_sync"); b.disabled = false; if (r.error){ msg(esc(r.error)); return; }
  const a = r.reviews||{}; toast(a.ok ? `取り込みました（新しい口コミ ${a.added||0}件）` : "取り込めませんでした"); loadRv(); }
function manualRv(){
  sheet(`<h3>口コミを手で入れる</h3><div class="mini">Google マップの口コミを見ながら写してください。入れるとすぐに返信の下書きを作ります</div>
    <label>投稿者の名前（表示名）</label><input id="mN" maxlength="40"><label>星</label><div class="sw" id="mS">${[1,2,3,4,5].map(n=>`<button onclick="[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')" data-v="${n}">★${n}</button>`).join("")}</div>
    <label>本文</label><textarea id="mT" rows="5"></textarea><label>投稿日</label><input type="date" id="mD" value="${new Date().toISOString().slice(0,10)}">
    <button class="btn full" id="mGo" onclick="manualGo()">入れて下書きを作る</button><button class="btn sec full" onclick="closeOv()">閉じる</button>`);
}
async function manualGo(){ const s = document.querySelector("#mS .on"); if (!s){ toast("星を選んでください"); return; }
  const b = $("mGo"); b.disabled = true; b.textContent = "下書きを作っています…";
  const r = await post("os_gbp_manual", {name:$("mN").value.trim(), star:+s.dataset.v, text:$("mT").value.trim(), date:$("mD").value.replace(/-/g,"/")}); b.disabled = false;
  if (r.error){ toast(r.error); b.textContent = "入れて下書きを作る"; return; } closeOv(); if (r.aiErr) msg("口コミは入れましたが、下書きを作れませんでした：" + esc(r.aiErr), "warn"); RVF = "wait"; loadRv(); }
async function redraft(id, hint){ const ta = $("dr_"+id); ta.disabled = true; const old = ta.value; ta.value = "作っています…"; const r = await post("os_gbp_draft", {id, hint}); ta.disabled = false;
  if (r.error){ ta.value = old; toast(r.error); return; } ta.value = r.draft; const x = RV.list.find(v=>v.id===id); if (x){ x.draft = r.draft; x.tags = r.tags||x.tags; if (x.status==="新着") x.status = "下書き済"; } }
async function saveDraft(id){ const r = await post("os_gbp_save", {id, draft:$("dr_"+id).value}); if (r.error){ toast(r.error); return; } toast("保存しました"); const x = RV.list.find(v=>v.id===id); if (x) x.draft = $("dr_"+id).value; }
async function copyRv(id){ const t = $("dr_"+id).value.trim(); if (!t){ toast("下書きが空です"); return; }
  try{ await navigator.clipboard.writeText(t); toast("コピーしました。Google で貼り付けてください"); }catch(e){ $("dr_"+id).select(); document.execCommand("copy"); toast("コピーしました"); }
  window.open((PF && PF.maps) || "https://business.google.com/reviews", "_blank"); }
async function sendRv(id, b){ const t = $("dr_"+id).value.trim(); if (!t){ toast("返信が空です"); return; } const x = RV.list.find(v=>v.id===id);
  if (!confirm(x && x.src==="API" ? "この返信を Google に送ります。よろしいですか？（送った返信は Google で公開されます）" : "Google に貼り付けましたか？「返信済み」として記録します")) return;
  b.disabled = true; const r = await post("os_gbp_send", {id, text:t}); b.disabled = false; if (r.error){ msg("送れませんでした：" + esc(r.error)); return; } toast(x && x.src==="API" ? "Google に送りました" : "返信済みにしました"); loadRv(); }
async function rvStatus(id, status){ const r = await post("os_gbp_status", {id, status}); if (r.error){ toast(r.error); return; } loadRv(); }
async function rvTodo(id){ const x = RV.list.find(v=>v.id===id); if (!x) return; const text = `口コミの指摘（${x.tags.join("・")}）を確かめる：${x.text.slice(0,40)}`;
  if (!confirm("やることに足しますか？\n\n" + text + "\n\n担当と期限は分析の「やること」で決めてください")) return;
  const r = await post("os_todo_save", {text, src:"口コミ", srcId:id, whoIds:[], whoNames:[], due:"", repeat:""}); if (r.error){ toast(r.error); return; } toast("やることに足しました"); }

// ───── プロフィール ─────
async function loadPf(fresh){ const r = await get("os_gbp_profile", fresh?{fresh:1}:{}); if (r.error){ $("pfBody").innerHTML = `<div class="msg err">${esc(r.error)}</div>`; return; } PF = r; renderPf(); }
function hm(t){ return t ? String(t.hours||0).padStart(2,"0")+":"+String(t.minutes||0).padStart(2,"0") : ""; }
const DAYMAP = {MONDAY:"月",TUESDAY:"火",WEDNESDAY:"水",THURSDAY:"木",FRIDAY:"金",SATURDAY:"土",SUNDAY:"日"};
function renderPf(){
  if (!PF.ready){ $("pfBody").innerHTML = setupHtml(); $("bdPf").classList.add("hide"); return; }
  const hol = PF.holidays||[]; $("bdPf").textContent = hol.length; $("bdPf").classList.toggle("hide", !hol.length);
  const sp = (PF.special||[]).map(s=>{ const d = s.startDate; return d ? `${d.month}/${d.day} ${s.closed?"休業":hm(s.openTime)+"〜"+hm(s.closeTime)}` : ""; }).filter(String);
  $("pfBody").innerHTML = `${hol.length?`<div class="card" style="border-color:var(--amber)"><h2>祝日の休業が入っていません</h2><div class="mini">平日の祝日は「特別営業時間」に休業を入れないと、Google では営業中と表示されます</div><div style="margin:8px 0;font-weight:bold">${hol.map(d=>`${d.slice(5)}(${YO[new Date(d.replace(/\//g,"-")+"T00:00:00").getDay()]})`).join("・")}</div><button class="btn" onclick="addClosed(${esc(JSON.stringify(hol))},this)">この祝日を休業として Google に入れる</button></div>`:""}
    <div class="card"><h2>${esc(PF.title)} <button class="btn sec" style="padding:6px 10px;font-size:12px" onclick="loadPf(true)">読み直す</button></h2><div class="kv">
      <span>住所</span><div>${esc(PF.address)}</div><span>電話</span><div>${esc(PF.phone)}</div><span>ウェブ</span><div>${PF.web?`<a href="${esc(PF.web)}" target="_blank">${esc(PF.web)}</a>`:"なし"}</div>
      <span>営業時間</span><div>${(PF.regular||[]).map(p=>`${DAYMAP[p.openDay]||p.openDay} ${hm(p.openTime)}〜${hm(p.closeTime)}`).join("<br>")||"なし"}</div>
      <span>特別営業時間</span><div>${sp.join("<br>")||"なし"}</div></div>
      <div class="row"><button class="btn line" onclick="addClosedAsk()">臨時休業を入れる</button>${PF.maps?`<a class="btn sec" href="${esc(PF.maps)}" target="_blank" style="text-decoration:none">Google マップで見る</a>`:""}</div></div>
    <div class="card"><h2>店の説明文 <small id="dsN">${(PF.desc||"").length}/750字</small></h2><textarea id="ds" rows="7" maxlength="750" oninput="$('dsN').textContent=this.value.length+'/750字'">${esc(PF.desc)}</textarea>
      <div class="mini">価格・営業時間などの数字はレジの登録価格・正本と合わせてください</div><button class="btn full" onclick="saveDesc(this)">承認して Google に反映</button></div>`;
}
function setupHtml(){ return `<div class="card"><h2>Google との連携はまだです</h2><div class="mini">B案（API）で口コミの自動取り込み・返信の送信・営業時間の反映を行うには、次の準備が要ります。承認までは「口コミ」タブの手入力で回せます</div>
  <ol class="steps"><li>Google Cloud にプロジェクトを作り、この分析の Apps Script をそのプロジェクトにつなぐ（Apps Script の設定 → Google Cloud プロジェクト）</li>
  <li>Business Profile API の利用申請を出す（プロジェクト番号・会社名・使い方）。審査は数日〜数週間</li>
  <li>承認後、4つの API（My Business Account Management／Business Information／Business Profile Performance／Google My Business）を有効にする</li>
  <li>プロフィールのオーナー（orion.napolitan@gmail.com）から、Apps Script の持ち主のアカウントを「管理者」に招待する</li>
  <li>Apps Script のエディタで gbpSetup → gbpSetupTriggers を1回ずつ実行（Claude が行います）</li></ol></div>`; }
async function addClosed(dates, b){ if (!confirm(dates.join("・") + " を Google の特別営業時間に「休業」で入れます。よろしいですか？")) return;
  if (b) b.disabled = true; const r = await post("os_gbp_closed", {dates}); if (b) b.disabled = false; if (r.error){ msg(esc(r.error)); return; } toast("Google に入れました"); loadPf(true); }
function addClosedAsk(){ const d = prompt("臨時休業の日付（例 2026/12/29）。複数はカンマ区切り"); if (!d) return; addClosed(d.split(/[,、\s]+/).map(x=>x.trim().replace(/-/g,"/")).filter(Boolean)); }
async function saveDesc(b){ const desc = $("ds").value.trim(); if (!confirm("この説明文を Google に反映します。よろしいですか？")) return; b.disabled = true; const r = await post("os_gbp_desc", {desc}); b.disabled = false; if (r.error){ msg(esc(r.error)); return; } toast("反映しました"); loadPf(true); }

// ───── 数字 ─────
async function loadPm(){ const r = await get("os_gbp_perf"); if (r.error){ $("pmBody").innerHTML = `<div class="msg err">${esc(r.error)}</div>`; return; } PM = r; renderPm(); }
function renderPm(){
  const cols = PM.cols, ym = new Date(Date.now() - 20*864e5).toISOString().slice(0,7).replace("-","/");
  $("pmBody").innerHTML = `<div class="card"><h2>Google での見られ方 <small>${PM.ready?"毎朝自動で取り込み":"月ごとに手入力"}</small></h2>
    <div class="mini">検索・マップで店が表示された回数と、ルート・電話・ウェブを押した回数。MEO・広告（月30,000円）の効果を、入店数・食数と並べて見ます</div>
    <div style="overflow-x:auto;margin-top:8px"><table><tr><th>月</th>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>${PM.months.map(m=>`<tr><td>${m.ym}<br><span class="mini">${esc(m.src)}</span></td>${cols.map(c=>`<td>${(m.v[c]||0).toLocaleString()}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length+1}" class="mini">まだありません</td></tr>`}</table></div></div>
    ${PM.ready ? "" : `<div class="card"><h2>月の数字を入れる</h2><div class="mini">Google ビジネスプロフィールの「パフォーマンス」画面の数字を写します</div>
    <label>月</label><input id="pmYm" value="${ym}">${cols.map((c,i)=>`<label>${c}</label><input type="number" inputmode="numeric" id="pm${i}">`).join("")}<button class="btn full" onclick="savePm()">保存</button></div>`}`;
}
async function savePm(){ const v = {}; PM.cols.forEach((c,i)=>v[c] = +($("pm"+i).value||0)); const r = await post("os_gbp_perf_save", {ym:$("pmYm").value.trim(), v}); if (r.error){ toast(r.error); return; } toast("保存しました"); loadPm(); }

if (!TOKEN) msg("管理者アプリでログインしてから開いてください。<a href='kanri.html'>管理者アプリへ</a>");
else { let t = "rv"; try{ t = localStorage.getItem("kc-tab") || "rv"; }catch(e){} if (!["rv","pf","pm"].includes(t)) t = "rv"; tab(t); get("os_gbp_profile").then(r=>{ if (r && r.ok){ PF = r; if (CUR==="pf") renderPf(); const n = (r.holidays||[]).length; $("bdPf").textContent = n; $("bdPf").classList.toggle("hide", !n); } }); }
</script>
</body>
