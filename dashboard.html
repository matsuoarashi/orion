<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダッシュボード | 洋食オリオン 神田淡路町店</title>
<style>
  :root{ --wood:#6b3f1c; --wood-d:#4e2d12; --cream:#fdf6e8; --cream-d:#e8dcc2;
         --enji:#93332a; --midori:#2c4f39; --ink:#3a2a18; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
       background:linear-gradient(#7a4b22,#5c3413);min-height:100vh;color:var(--ink);
       display:flex;justify-content:center;padding:14px}
  .app{width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px}
  header{display:flex;justify-content:space-between;align-items:center;color:#f3ddb0;padding:2px 2px}
  header .t small{display:block;font-size:10px;letter-spacing:4px;color:#c8a866}
  header .t b{font-size:22px;letter-spacing:6px}
  .store{background:var(--cream);color:var(--ink);border:2px solid var(--wood-d);
       border-radius:10px;padding:6px 12px;font-weight:bold;font-size:14px;letter-spacing:2px}
  .demoBanner{display:none;background:#f4e08a;border:2px solid #b89a2a;border-radius:10px;
       padding:8px 12px;font-size:12px;font-weight:bold;text-align:center}
  .tabs{display:flex;gap:8px}
  .tabs button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--wood-d);
       background:var(--cream-d);font-size:14px;font-weight:bold;color:var(--ink)}
  .tabs button.on{background:var(--midori);color:#fff;border-color:var(--midori)}
  .datebar{display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:12px;
       border:3px solid var(--wood-d);padding:8px 10px;justify-content:space-between}
  .datebar button{border:2px solid var(--wood-d);background:var(--cream-d);border-radius:8px;
       padding:6px 14px;font-size:16px;font-weight:bold}
  .datebar .d{font-size:15px;font-weight:bold;letter-spacing:1px}
  .datebar .today-btn{font-size:12px;padding:6px 8px}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{background:var(--cream);border-radius:14px;padding:12px 14px;border:3px solid var(--wood-d)}
  .card h2{font-size:12px;letter-spacing:3px;color:var(--midori);margin-bottom:6px}
  .big{font-size:30px;font-weight:bold;font-variant-numeric:tabular-nums;line-height:1.1}
  .big small{font-size:13px;font-weight:normal}
  .sub{font-size:12px;color:#6b5a40;margin-top:4px;line-height:1.6}
  .wide{grid-column:1/-1}
  .goal{height:14px;background:var(--cream-d);border-radius:7px;overflow:hidden;margin-top:8px;border:1px solid #c9b891}
  .goal i{display:block;height:100%;background:var(--midori)}
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  td,th{padding:5px 3px;border-bottom:1px dashed #c9b891;text-align:right;white-space:nowrap}
  td:first-child,th:first-child{text-align:left}
  th{color:var(--midori);font-size:11px}
  .bar{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px}
  .bar div{flex:1;background:var(--enji);border-radius:3px 3px 0 0;position:relative;min-height:2px}
  .bar div.today{background:var(--midori)}
  .bar span{position:absolute;bottom:-16px;left:0;right:0;font-size:8px;text-align:center;color:#6b5a40}
  .camGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
  .camGrid .c{background:var(--cream-d);border-radius:10px;padding:8px 4px;text-align:center}
  .camGrid .c b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .camGrid .c span{font-size:10px;color:#6b5a40}
  .err{background:#fff3f0;border-radius:12px;padding:14px;color:#8d2f26;display:none;font-size:13px;line-height:1.7}
  footer{text-align:center;color:#c8a866;font-size:11px;padding-bottom:8px}
  footer button{background:none;border:1px solid #a98d5c;color:#e8d5ac;border-radius:8px;padding:6px 14px;font-size:12px;margin:6px 4px 0}
  .pd{border-top:1px dashed #c9b891;padding:10px 0 8px}
.pd:first-child{border-top:none;padding-top:2px}
.pd-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#6b5a40}
.pd-h b{font-size:15px;color:var(--ink);letter-spacing:1px}
.pd-main{display:flex;gap:22px;margin:4px 0 2px}
.pd-main div small{display:block;font-size:10px;letter-spacing:2px;color:var(--midori)}
.pd-main div b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.pd-main div i{font-style:normal;font-size:12px;margin-left:2px}
.pd-sub{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:#6b5a40;line-height:1.7}
.pd-sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.pd-sub em{font-style:normal;font-size:11px;margin-left:3px}
.pd-sub em.up{color:var(--midori)} .pd-sub em.dn{color:var(--enji)}
.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="t"><small>洋食オリオン</small><b>ダッシュボード</b></div>
    <span class="store">神田淡路町店</span>
  </header>
  <div class="demoBanner" id="demoBanner">⚠ デモデータ表示中(「↻ 実データ」で戻ります)</div>
  <div class="err" id="err"></div>

  <div class="tabs">
    <button id="tab-day" class="on" onclick="setTab('day')">日次</button>
    <button id="tab-week" onclick="setTab('week')">週次</button>
    <button id="tab-month" onclick="setTab('month')">月次</button>
  </div>

  <!-- ===== 日次 ===== -->
  <div id="view-day">
    <div class="datebar">
      <button onclick="moveDate(-1)">◀</button>
      <span class="d" id="dateLabel">-</span>
      <span>
        <button class="today-btn" onclick="goToday()">今日へ</button>
        <button onclick="moveDate(1)">▶</button>
      </span>
    </div>
    <div style="height:10px"></div>
    <div class="cards">
      <div class="card"><h2>食数</h2><div class="big" id="dMeals">-</div>
        <div class="sub" id="dGoal"></div>
        <div class="goal"><i id="goalBar" style="width:0%"></i></div></div>
      <div class="card"><h2>売上</h2><div class="big" id="dSales">-</div>
        <div class="sub" id="dCount"></div></div>
      <div class="card"><h2>客単価(売上÷食数)</h2><div class="big" id="dAvg">-</div>
        <div class="sub">計画 945円</div></div>
      <div class="card"><h2>ドリンク率(本÷食数)</h2><div class="big" id="dDrink">-</div>
        <div class="sub">計画 30%</div></div>

      <div class="card wide"><h2>店内 / 持ち帰り</h2>
        <table id="modeTable"></table></div>

      <div class="card wide"><h2>直近14日の食数(緑=表示中の日)</h2>
        <div class="bar" id="chart"></div><div style="height:16px"></div></div>

      <div class="card wide"><h2>店頭カメラ(人流)</h2>
        <div class="camGrid" id="camGrid"></div>
        <div class="sub" id="camNote"></div></div>

      <div class="card"><h2>時間帯別 会計数</h2><div class="sub" id="dHours" style="font-size:13px"></div></div>
      <div class="card"><h2>商品別 売れ数(上位)</h2><div class="sub" id="dItemsMini" style="font-size:13px"></div></div>

      <div class="card wide"><h2>商品別 売れ数(この日・全品)</h2><table id="dItems"></table></div>
    </div>
  </div>

  <!-- ===== 週次 ===== -->
  <div id="view-week" class="hide">
    <div class="cards"><div class="card wide"><h2>週次集計(月曜始まり・直近12週)</h2>
      <div id="weekTable"></div></div></div>
  </div>

  <!-- ===== 月次 ===== -->
  <div id="view-month" class="hide">
    <div class="cards"><div class="card wide"><h2>月次集計</h2>
      <div id="monthTable"></div>
      <div class="sub">※営業日=会計が1件以上あった日</div></div></div>
  </div>

  <footer>
    <span id="ts"></span><br>
    <button onclick="load()">↻ 実データ</button>
    <button onclick="loadDemo()">デモデータ</button>
  </footer>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzFNl4UM3fkoANru-agWmuOox-h3cS1yJmx4UZxpGFemEBnAUv45Gdp1VOvtCqOVUg/exec";
const GOAL_MEALS = 60;

const $ = id => document.getElementById(id);
const yen = n => (n||0).toLocaleString() + "円";
let DATA = null, viewDate = null;

function setTab(t){
  ["day","week","month"].forEach(x=>{
    $("view-"+x).classList.toggle("hide", x!==t);
    $("tab-"+x).classList.toggle("on", x===t);
  });
}
function dayByDate(dt){ return DATA.daily.find(d=>d.date===dt) || null; }
function dateAdd(dt, n){
  const [y,m,d] = dt.split("/").map(Number);
  const dd = new Date(y, m-1, d + n);
  const p = x => String(x).padStart(2,"0");
  return dd.getFullYear()+"/"+p(dd.getMonth()+1)+"/"+p(dd.getDate());
}
function youbi(dt){
  const [y,m,d] = dt.split("/").map(Number);
  return ["日","月","火","水","木","金","土"][new Date(y,m-1,d).getDay()];
}
function fmtWait(sec){
  if(!sec) return "-";
  return Math.floor(sec/60) + "分" + String(sec%60).padStart(2,"0") + "秒";
}
function moveDate(n){ viewDate = dateAdd(viewDate, n); renderDay(); }
function goToday(){ viewDate = DATA.todayKey; renderDay(); }

function renderDay(){
  const d = dayByDate(viewDate) || {count:0,meals:0,drinks:0,sales:0,eatin:0,togo:0,
    salesEatin:0,salesTogo:0,mealsEatin:0,mealsTogo:0,items:{},hours:{},camera:null};
  $("dateLabel").textContent = `${viewDate}(${youbi(viewDate)})${viewDate===DATA.todayKey?" 本日":""}`;
  $("dMeals").innerHTML = d.meals + '<small> 食</small>';
  $("dSales").textContent = yen(d.sales);
  $("dAvg").textContent = d.meals ? yen(Math.round(d.sales/d.meals)) : "-";
  $("dDrink").textContent = d.meals ? Math.round(100*d.drinks/d.meals) + "%" : "-";
  const fk = (d.items||{})["副菜追加"] || 0;
  $("dCount").textContent = `${d.count}会計 / 副菜追加 ${fk}個${d.meals?"("+Math.round(100*fk/d.meals)+"%)":""}`;
  $("dGoal").textContent = `目標 ${GOAL_MEALS}食まであと ${Math.max(0, GOAL_MEALS - d.meals)}食`;
  $("goalBar").style.width = Math.min(100, 100*d.meals/GOAL_MEALS) + "%";

  // 店内/持ち帰りテーブル
  const se = d.salesEatin, st = d.salesTogo;
  const hasModeData = (se + st > 0) || d.count === 0;
  $("modeTable").innerHTML =
    "<tr><th></th><th>会計数</th><th>食数</th><th>売上</th><th>客単価</th><th>売上構成比</th></tr>" +
    `<tr><td>店内</td><td>${d.eatin}</td><td>${d.mealsEatin??"-"}</td><td>${yen(se)}</td>`+
    `<td>${d.mealsEatin?yen(Math.round(se/d.mealsEatin)):"-"}</td>`+
    `<td>${d.sales?Math.round(100*se/d.sales)+"%":"-"}</td></tr>`+
    `<tr><td>持ち帰り</td><td>${d.togo}</td><td>${d.mealsTogo??"-"}</td><td>${yen(st)}</td>`+
    `<td>${d.mealsTogo?yen(Math.round(st/d.mealsTogo)):"-"}</td>`+
    `<td>${d.sales?Math.round(100*st/d.sales)+"%":"-"}</td></tr>` +
    (!hasModeData ? '<tr><td colspan="6" style="text-align:left;color:#8a6a1a">※売上の店内/TG内訳はApps Script v4への更新後から記録されます</td></tr>' : "");

  // 14日チャート
  const days = [];
  for (let i=13;i>=0;i--) days.push(dateAdd(viewDate,-i));
  const rows = days.map(dt=>({dt, meals:(dayByDate(dt)||{meals:0}).meals}));
  const max = Math.max(1, ...rows.map(r=>r.meals));
  $("chart").innerHTML = rows.map(r=>{
    const h = Math.max(2, Math.round(100*r.meals/max));
    return `<div class="${r.dt===viewDate?"today":""}" style="height:${h}%" title="${r.dt}: ${r.meals}食"><span>${r.dt.slice(5)}</span></div>`;
  }).join("");

  // カメラ詳細
  const c = d.camera;
  if(c){
    const passers = c["通行"]||0, joined = c["行列参加"]||0, entries = c["入店"]||0;
    const cells = [
      ["通行", passers + "人"],
      ["入店", entries + "人"],
      ["行列参加", joined + "人"],
      ["離脱", (c["離脱"]||0) + "人"],
      ["最大行列", (c["最大行列"]||0) + "人"],
      ["平均待ち", fmtWait(c["平均待ち秒"])],
      ["行列参加率", passers ? Math.round(100*joined/passers)+"%" : "-"],
      ["入店転換率", passers ? Math.round(100*entries/passers)+"%" : "-"],
    ];
    $("camGrid").innerHTML = cells.map(([k,v])=>`<div class="c"><b>${v}</b><span>${k}</span></div>`).join("");
    $("camNote").textContent = "行列参加率=行列に並んだ人÷通行人 / 入店転換率=入店÷通行人";
  }else{
    $("camGrid").innerHTML = "";
    $("camNote").textContent = "この日のカメラデータはありません(人流システム稼働後に表示されます)";
  }

  $("dHours").innerHTML = Object.keys(d.hours).sort().map(h=>`${h}時台 <b>${d.hours[h]}</b>件`).join("<br>") || "-";

  const items = Object.entries(d.items||{}).sort((a,b)=>b[1]-a[1]);
  $("dItemsMini").innerHTML = items.slice(0,4).map(([n,q])=>`${n} <b>${q}</b>`).join("<br>") || "-";
  $("dItems").innerHTML = "<tr><th>商品</th><th>個数</th></tr>" +
    (items.map(([n,q])=>`<tr><td>${n}</td><td>${q}</td></tr>`).join("") || "<tr><td>記録なし</td><td></td></tr>");
}

function mondayOf(dt){
  const [y,m,d] = dt.split("/").map(Number);
  const dd = new Date(y,m-1,d);
  dd.setDate(dd.getDate()-((dd.getDay()+6)%7));
  const p = x => String(x).padStart(2,"0");
  return dd.getFullYear()+"/"+p(dd.getMonth()+1)+"/"+p(dd.getDate());
}
function sumDays(list, pick){
  const g = {};
  DATA.daily.forEach(d=>{
    const k = pick(d);
    if(!g[k]) g[k] = {days:0,meals:0,sales:0,count:0,eatin:0,togo:0,mealsTogo:0,drinks:0,salesEatin:0,salesTogo:0,fk:0};
    const x = g[k];
    if(d.count>0) x.days++;
    x.meals+=d.meals; x.sales+=d.sales; x.count+=d.count; x.eatin+=d.eatin; x.togo+=d.togo;
    x.mealsTogo+=(d.mealsTogo||0); x.drinks+=(d.drinks||0);
    x.salesEatin+=(d.salesEatin||0); x.salesTogo+=(d.salesTogo||0);
    x.fk+=((d.items||{})["副菜追加"]||0);
  });
  return g;
}
function pctOf(a,b){ return b ? Math.round(100*a/b)+"%" : "-"; }
function periodCard(label, x, prev, extra){
  const avgM = x.days ? (x.meals/x.days) : 0;
  let delta = "";
  if(prev && prev.days){
    const pv = prev.meals/prev.days, df = avgM - pv;
    delta = `<em class="${df>=0?"up":"dn"}">${df>=0?"+":""}${df.toFixed(1)}</em>`;
  }
  return `<div class="pd">`+
    `<div class="pd-h"><b>${label}</b><span>営業 ${x.days}日 ・ ${x.count}会計</span></div>`+
    `<div class="pd-main">`+
      `<div><small>食数</small><b>${x.meals}</b><i>食</i></div>`+
      `<div><small>売上</small><b>${x.sales.toLocaleString()}</b><i>円</i></div>`+
    `</div>`+
    `<div class="pd-sub">`+
      `<span>食数/日 <b>${x.days?avgM.toFixed(1):"-"}</b>${delta}</span>`+
      `<span>客単価 <b>${x.meals?Math.round(x.sales/x.meals).toLocaleString()+"円":"-"}</b></span>`+
      `<span>持ち帰り <b>${x.mealsTogo}</b>食(${pctOf(x.mealsTogo,x.meals)})</span>`+
      `<span>ドリンク <b>${x.drinks}</b>本(${pctOf(x.drinks,x.meals)})</span>`+
      `<span>副菜追加 <b>${x.fk}</b>(${pctOf(x.fk,x.meals)})</span>`+
      (extra||"")+
    `</div></div>`;
}
function renderWeek(){
  const weeks = sumDays(DATA.daily, d=>mondayOf(d.date));
  const keys = Object.keys(weeks).sort().slice(-12);
  $("weekTable").innerHTML = keys.slice().reverse().map((k,i)=>{
    const idx = keys.indexOf(k); const prev = idx>0 ? weeks[keys[idx-1]] : null;
    return periodCard(`${k.slice(5)}〜${dateAdd(k,6).slice(5)}`, weeks[k], prev);
  }).join("") || "<div class='sub'>記録なし</div>";
}
function renderMonth(){
  const months = sumDays(DATA.daily, d=>d.date.slice(0,7));
  const keys = Object.keys(months).sort();
  $("monthTable").innerHTML = keys.slice().reverse().map(k=>{
    const idx = keys.indexOf(k); const prev = idx>0 ? months[keys[idx-1]] : null;
    const m = months[k];
    return periodCard(k.replace("/","年")+"月", m, prev,
      `<span>店内売上 <b>${m.salesEatin.toLocaleString()}</b>円 / TG売上 <b>${m.salesTogo.toLocaleString()}</b>円</span>`);
  }).join("") || "<div class='sub'>記録なし</div>";
}

function renderAll(){
  if(!viewDate || !dayByDate(viewDate)) viewDate = DATA.todayKey;
  renderDay(); renderWeek(); renderMonth();
}

async function load(){
  try{
    $("err").style.display = "none";
    $("demoBanner").style.display = "none";
    const res = await fetch(SHEET_URL + "?t=" + Date.now(), {cache:"no-store"});
    DATA = await res.json();
    viewDate = null;
    renderAll();
    $("ts").textContent = "最終更新 " + DATA.updated;
  }catch(e){
    $("err").style.display = "block";
    $("err").textContent = "データを取得できませんでした。通信状態と、Apps Scriptの再デプロイ(新バージョン)を確認してください。";
  }
}

// ===== デモデータ =====
function loadDemo(){
  const p = x => String(x).padStart(2,"0");
  const today = new Date();
  const daily = [];
  for(let i=29;i>=0;i--){
    const dd = new Date(today); dd.setDate(dd.getDate()-i);
    const date = dd.getFullYear()+"/"+p(dd.getMonth()+1)+"/"+p(dd.getDate());
    const dow = dd.getDay();
    if(dow===0){ daily.push({date,count:0,meals:0,drinks:0,sales:0,eatin:0,togo:0,
      salesEatin:0,salesTogo:0,mealsEatin:0,mealsTogo:0,items:{},hours:{},camera:null}); continue; } // 日曜定休
    const base = [0,52,55,58,60,68,73][dow]; // 曜日ごとの基準食数
    const meals = base + Math.floor(Math.random()*9) - 4;
    const togoMeals = Math.round(meals*0.22);
    const eatinMeals = meals - togoMeals;
    const orion = Math.round(meals*0.52), nashi = meals - orion;
    const nacoppe = 6 + Math.floor(Math.random()*5);
    const count = Math.round(meals*0.96);
    const eatin = count - Math.round(count*0.22), togo = count - eatin;
    const drinks = Math.round(count*0.31);
    const salesEatin = eatinMeals*880 + Math.round(drinks*0.9)*260;
    const salesTogo = togoMeals*940 + nacoppe*310;
    const camera = {
      "通行": 620 + Math.floor(Math.random()*220) + (dow>=5?150:0),
      "入店": count + 2,
      "行列参加": Math.round(meals*0.55),
      "離脱": 1 + Math.floor(Math.random()*3),
      "最大行列": 5 + Math.floor(Math.random()*6),
      "平均待ち秒": 200 + Math.floor(Math.random()*220),
    };
    daily.push({date, count, meals, drinks,
      sales: salesEatin+salesTogo, eatin, togo,
      salesEatin, salesTogo, mealsEatin: eatinMeals, mealsTogo: togoMeals,
      items: {"名物オリオン":orion-3, "ナシナシ":nashi-2, "TGオリオン":3, "TGナシナシ":2,
              "ナコッペ":nacoppe, "ナコッペチーズ":Math.round(nacoppe*0.6),
              "瓶コーラ":Math.round(drinks*0.45), "ジンジャー":Math.round(drinks*0.2),
              "コーヒー牛乳":Math.round(drinks*0.25), "小瓶ビール":Math.round(drinks*0.1),
              "コッペパン":8, "折箱":4},
      hours: {"11": Math.round(count*0.22), "12": Math.round(count*0.46),
              "13": Math.round(count*0.24), "14": Math.round(count*0.08)},
      camera});
  }
  DATA = {
    updated: "デモ",
    todayKey: daily[daily.length-1].date,
    daily
  };
  viewDate = null;
  renderAll();
  $("err").style.display = "none";
