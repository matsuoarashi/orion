<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5c3413">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>オリオン</title>
<style>
  :root{--wood:#6b3f1c;--wood-d:#4e2d12;--cream:#fdf6e8;--cream-d:#e8dcc2;--enji:#93332a;--midori:#2c4f39;--ink:#3a2a18;--gray:#8a7a5c;--line:#c9b891;--amber:#e0b36a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;background:var(--cream);color:var(--ink);font-size:15px}
  button,input,textarea,select{font-family:inherit;font-size:inherit}
  button{cursor:pointer}
  #app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  .hide{display:none!important}
  /* header */
  .hd{background:#5c3413;color:#f3ddb0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
  .hd .logo{font-size:15px;letter-spacing:3px;font-weight:bold}
  .hd .who{display:flex;align-items:center;gap:8px;font-size:12px}
  .hd .who b{background:var(--midori);color:#fff;padding:3px 9px;border-radius:999px;font-weight:bold}
  .band{background:var(--enji);color:#fff;padding:8px 14px;font-size:14px;line-height:1.5}
  .band b{font-size:15px}
  .band.ok{background:var(--midori)}
  .band.amber{background:#fff3e0;color:#7a4b22;border-bottom:1px solid var(--amber)}
  /* content */
  .main{flex:1;padding:10px 14px 90px;display:flex;flex-direction:column;gap:8px}
  .sec{font-size:11px;color:var(--gray);letter-spacing:2px;padding:6px 0 2px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .card.dim{background:var(--cream);border-style:dashed;color:#a09070}
  .card.now{border:2px solid var(--enji)}
  .card.alert{background:#fff3f0;border-color:var(--enji)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .item{display:flex;gap:10px;align-items:center}
  .item .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold}
  .item.done{color:var(--gray)}
  .item.done .ck{background:var(--midori);border-color:var(--midori);color:#fff}
  .item.done .lb{text-decoration:line-through}
  .item.now .ck{border-color:var(--enji)}
  .item .lb{flex:1;font-size:15px}
  .item .tm{font-size:11px;color:var(--gray);white-space:nowrap}
  .item .sub{font-size:11px;color:var(--gray);display:block;margin-top:2px}
  .btn{border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:bold;background:var(--midori);color:#fff;width:100%;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .btn:disabled{background:var(--line);box-shadow:none}
  .btn.sub{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
  .btn.danger{background:var(--enji)}
  .btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
  .btn.ghost{background:transparent;border:2px solid var(--midori);color:var(--midori);box-shadow:none}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px}
  .chip.on{border-color:var(--enji);background:#fbe4e0;color:var(--enji);font-weight:bold}
  .chip.ok{border-color:var(--midori);background:#e6efe8;color:var(--midori);font-weight:bold}
  .chip.warn{border-color:var(--amber);background:#fff3e0;color:#7a4b22;font-weight:bold}
  input[type=number],input[type=text],input[type=password],input[type=email],textarea,select{width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
  input.num{text-align:right;font-size:20px;font-weight:bold}
  label.ck{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0}
  label.ck input{width:20px;height:20px}
  .num3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .num3 label{font-size:11px;color:var(--gray);white-space:nowrap}
  .num3 .in{display:flex;align-items:center;gap:4px}
  .num3 input{padding:8px 6px;font-size:18px}
  .num3 .bad input{border-color:var(--enji);color:var(--enji);background:#fff3f0}
  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--cream-d);font-size:14px}
  .kv:last-child{border-bottom:none}
  .kv b{font-size:16px}
  .muted{color:var(--gray);font-size:12px;line-height:1.5}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
  .tile span{font-size:11px;color:var(--gray)}
  .tile b{font-size:22px}
  .tile b small{font-size:12px;font-weight:normal}
  /* tab bar */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--cream);border-top:1px solid var(--line);display:grid;padding:4px 0 max(10px,env(safe-area-inset-bottom));z-index:6}
  nav.tabs .inner{max-width:520px;margin:0 auto;display:grid;width:100%}
  nav.tabs a{text-decoration:none;color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:500;position:relative}
  nav.tabs a.on{color:var(--midori);font-weight:bold}
  nav.tabs a .dot{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--enji)}
  /* register */
  .regi{background:linear-gradient(#7a4b22,#5c3413);margin:-10px -14px;padding:10px 12px 90px;min-height:calc(100vh - 44px);display:flex;flex-direction:column;gap:8px}
  .mode{display:flex;gap:8px}
  .mode button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--wood-d);background:var(--cream-d);font-size:15px;font-weight:bold;color:var(--ink)}
  .mode button.on{background:var(--midori);color:#fff;border-color:var(--midori)}
  .mode button.pr.on{background:#2b4f8f;border-color:#2b4f8f}
  .disp{background:#0c1013;border-radius:14px;padding:14px 16px;border:3px solid var(--wood-d);box-shadow:inset 0 0 18px #000}
  .disp .total{color:#ffe9b8;font-size:52px;font-weight:bold;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
  .disp .items{color:#c8a866;font-size:13px;min-height:34px;margin-top:4px;line-height:1.5;word-break:break-all}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .key{border:none;border-radius:14px;padding:10px 4px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.35);background:linear-gradient(var(--cream),var(--cream-d));color:var(--ink);font-size:16px;line-height:1.25;min-height:74px}
  .key .nm{display:flex;align-items:center;justify-content:center;min-height:2.5em}
  .key small{display:block;font-weight:normal;color:var(--enji);font-size:13px;margin-top:2px}
  .key.other{background:linear-gradient(#f0e8d8,#d8ccb2)}
  .key.other small{color:var(--gray)}
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .key.fn-clear{background:linear-gradient(#b8483d,#8d2f26);color:#fff;font-size:22px}
  .key.fn-clear small{color:#f3d2ca}
  .pay{border:none;border-radius:14px;padding:16px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.35);background:linear-gradient(#3f6b4f,#274732);color:#fff;font-size:22px;text-align:center;width:100%}
  .pay small{font-size:14px;font-weight:normal;color:#cfe2cc;margin-left:8px}
  .pay:disabled{opacity:.5}
  .regi .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .regi .acts button{border:2px solid var(--line);background:var(--cream);color:var(--ink);border-radius:10px;padding:10px 4px;font-size:13px;font-weight:bold}
  .regi .acts button.warn{border-color:var(--amber);background:#fff3e0;color:#7a4b22}
  /* overlay/sheet */
  .overlay{position:fixed;inset:0;background:rgba(20,12,4,.7);display:none;justify-content:center;align-items:flex-end;z-index:20}
  .overlay.show{display:flex}
  .sheet{background:var(--cream);border-radius:18px 18px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--wood-d);max-height:92vh;overflow-y:auto}
  .sheet h2{font-size:15px;letter-spacing:3px;color:var(--midori);text-align:center}
  .paysel{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .paysel button{border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:14px 8px;font-size:20px;font-weight:bold;display:flex;flex-direction:column;align-items:center;gap:2px}
  .paysel button small{font-size:12px;font-weight:normal;color:var(--gray)}
  .paysel button.on{border-color:var(--midori);background:var(--midori);color:#fff}
  .paysel button.on small{color:#cfe2cc}
  .paysel button.pp{color:#2b4f8f}
  .paysel button.pp.on{background:#2b4f8f;border-color:#2b4f8f;color:#fff}
  .amt{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:8px 14px;border:1px solid var(--line)}
  .amt b{font-size:28px;font-variant-numeric:tabular-nums}
  .amt.chg b{color:var(--enji)}
  .tenkey{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tenkey button{padding:13px 2px;border-radius:12px;border:none;background:var(--cream-d);font-weight:bold;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .tenkey .op{background:#d8ccb2;font-size:14px}
  .pin{display:flex;gap:10px;justify-content:center;padding:6px}
  .pin span{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
  .pin span.f{background:var(--ink)}
  .pinkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pinkeys button{border:none;border-radius:12px;padding:16px 0;font-size:24px;font-weight:bold;background:var(--cream-d);box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .pinkeys button.op{background:#d8ccb2;font-size:16px}
  .pinkeys button.go{background:var(--midori);color:#fff;font-size:16px}
  .names{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .names button{border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:14px 8px;font-size:18px;font-weight:bold}
  .names button.on{border-color:var(--midori);background:var(--midori);color:#fff}
  .login{background:linear-gradient(#7a4b22,#5c3413);min-height:100vh;padding:36px 20px 24px;display:flex;flex-direction:column;gap:16px}
  .login .title{text-align:center;color:#f3ddb0}
  .login .title small{display:block;font-size:12px;letter-spacing:6px}
  .login .title b{display:block;font-size:32px;letter-spacing:8px;margin:4px 0}
  .login .box{background:var(--cream);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;border:3px solid var(--wood-d)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .h{font-size:11px;color:var(--gray);text-align:center}
  .cal button{height:44px;border:2px dashed var(--line);border-radius:8px;background:#fff;color:var(--gray);font-size:13px;line-height:1.1}
  .cal button.ok{border:none;background:var(--midori);color:#fff;font-weight:bold}
  .cal button.maybe{border:none;background:var(--amber);color:var(--ink);font-weight:bold}
  .cal button.ng{border:none;background:var(--line);color:var(--ink);font-weight:bold}
  .cal .off{height:44px;display:flex;align-items:center;justify-content:center;color:var(--line);font-size:12px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:70px}
  .bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
  .bars div i{width:100%;background:var(--line);border-radius:3px 3px 0 0}
  .bars div.t i{background:var(--midori)}
  .bars div span{font-size:10px;color:var(--gray)}
  .md h3{font-size:16px;margin:10px 0 4px}
  .md p{margin:4px 0;line-height:1.6}
  .md ul{margin:4px 0 4px 18px;line-height:1.6}
  .toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#3a2a18;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:50;opacity:0;transition:.2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  .sync{font-size:11px;color:#c9b891}
  .sync.bad{color:#ffb4a8}
  table.tb{width:100%;border-collapse:collapse;font-size:13px}
  table.tb td{padding:6px 4px;border-bottom:1px dashed var(--cream-d);vertical-align:middle}
  table.tb td button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 4px;font-size:13px;font-weight:bold;width:100%}
  table.tb td button.set{background:#e6efe8;color:var(--midori);border-color:var(--line)}
  table.tb td button.none{border:2px dashed var(--enji);color:var(--enji)}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" class="overlay"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ===================== 設定 =====================
const CONFIG = {
  SUPABASE_URL: "https://zffvtgxbofgrfawyfkmq.supabase.co",
  SUPABASE_ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZnZ0Z3hib2ZncmZhd3lma21xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzODEzMzEsImV4cCI6MjEwNTk1NzMzMX0.pgKBD9plPuoFfOHQdGdUeu6mEMIL8XqsMzKUpo-04BI",
  STORE_ID: "kanda",
  MAIL_URL: "",   // メール通知用 GAS ウェブアプリURL（空なら送らない）
  PIN_SALT: "orion",
  VERSION: "1.0.0"
};

// ===================== ユーティリティ =====================
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = (n) => (n ?? 0).toLocaleString() + "円";
const pad = (n) => String(n).padStart(2, "0");
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
const nowISO = () => new Date().toISOString();
const hm = (d) => pad(d.getHours()) + ":" + pad(d.getMinutes());
const dateKey = (d = new Date()) => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const today = () => dateKey();
const YOUBI = ["日","月","火","水","木","金","土"];
const pd = (k) => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const jdate = (k) => { const dt = pd(k); return `${dt.getMonth()+1}/${dt.getDate()}(${YOUBI[dt.getDay()]})`; };
const minutes = (t) => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
async function sha256(s){ const b = new TextEncoder().encode(s); const h = await crypto.subtle.digest("SHA-256", b); return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
let toastT; function toast(msg, ms=2200){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), ms); }
function openSheet(html){ $("sheet").innerHTML = html; $("ov").classList.add("show"); }
function closeSheet(){ $("ov").classList.remove("show"); $("sheet").innerHTML=""; }
$("ov").addEventListener("click", e => { if(e.target.id === "ov") closeSheet(); });
const ls = { get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

// ===================== Supabase & データ層 =====================
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON, { auth: { persistSession: true, autoRefreshToken: true } });
const S = CONFIG.STORE_ID;

// キャッシュ（オフライン時は最後に読めたものを表示）
const cache = ls.get("orion-cache", {});
function setCache(k, v){ cache[k] = v; ls.set("orion-cache", cache); }

// 書き込みキュー（端末に溜めて、通信できる時に送る）
let queue = ls.get("orion-queue", []);
function enqueue(table, row, conflict){ queue.push({table, row, conflict: conflict || "id"}); ls.set("orion-queue", queue); flush(); }
let flushing = false;
async function flush(){
  if(flushing || !queue.length || !navigator.onLine) { renderSync(); return; }
  flushing = true;
  while(queue.length){
    const q = queue[0];
    try{
      const conflict = q.conflict === "id_update" ? "id" : q.conflict;
      const { error } = await sb.from(q.table).upsert(q.row, { onConflict: conflict, ignoreDuplicates: q.conflict === "id" });
      if(error){ console.warn("upsert", q.table, error.message); if(/JWT|auth|401|403/i.test(error.message)) break; if(/duplicate|conflict/i.test(error.message)){ /* skip */ } else break; }
      queue.shift(); ls.set("orion-queue", queue);
    }catch(e){ console.warn(e); break; }
  }
  flushing = false; renderSync();
}
window.addEventListener("online", flush);
function renderSync(){ const el = document.querySelector(".sync"); if(!el) return; const n = queue.length; el.textContent = n ? `未送信 ${n} 件` : "同期済み"; el.classList.toggle("bad", n>0 && !navigator.onLine); }

// ローカルにも同じ行を反映（画面を即更新するため）
function localAdd(key, row){ const arr = cache[key] || []; const i = arr.findIndex(r => r.id === row.id); if(i>=0) arr[i] = row; else arr.push(row); setCache(key, arr); }

async function loadMaster(){
  const [store, staff, products, tasks, tdefs, manuals] = await Promise.all([
    sb.from("stores").select("*").eq("id", S).single(),
    sb.from("staff").select("*").eq("store_id", S).order("sort"),
    sb.from("products").select("*").eq("store_id", S).eq("active", true).order("sort"),
    sb.from("task_defs").select("*").eq("store_id", S).eq("active", true).order("sort"),
    sb.from("training_defs").select("*").eq("store_id", S).order("sort"),
    sb.from("manuals").select("*").eq("store_id", S).order("sort"),
  ]);
  if(store.data) setCache("store", store.data);
  if(staff.data) setCache("staff", staff.data);
  if(products.data) setCache("products", products.data);
  if(tasks.data) setCache("task_defs", tasks.data);
  if(tdefs.data) setCache("training_defs", tdefs.data);
  if(manuals.data) setCache("manuals", manuals.data);
}
async function loadToday(){
  const d = today();
  const y = dateKey(new Date(Date.now() - 86400000*1));
  const [sales, moves, logs, reports, clocks] = await Promise.all([
    sb.from("sales").select("*").eq("store_id", S).eq("biz_date", d),
    sb.from("cash_moves").select("*").eq("store_id", S).eq("biz_date", d),
    sb.from("task_logs").select("*").eq("store_id", S).gte("biz_date", dateKey(new Date(Date.now()-86400000*7))),
    sb.from("reports").select("*").eq("store_id", S).gte("biz_date", dateKey(new Date(Date.now()-86400000*14))).order("ts"),
    sb.from("clocks").select("*").eq("store_id", S).gte("biz_date", dateKey(new Date(Date.now()-86400000*45))),
  ]);
  if(sales.data) setCache("sales", sales.data);
  if(moves.data) setCache("cash_moves", moves.data);
  if(logs.data) setCache("task_logs", logs.data);
  if(reports.data) setCache("reports", reports.data);
  if(clocks.data) setCache("clocks", clocks.data);
}
async function loadMine(name){
  const from = dateKey(new Date(Date.now()-86400000*45)), to = dateKey(new Date(Date.now()+86400000*70));
  const [shifts, reqs, periods, tlogs] = await Promise.all([
    sb.from("shifts").select("*").eq("store_id", S).gte("day", from).lte("day", to),
    sb.from("shift_requests").select("*").eq("store_id", S).gte("day", from).lte("day", to),
    sb.from("shift_periods").select("*").eq("store_id", S),
    sb.from("training_logs").select("*").eq("store_id", S),
  ]);
  if(shifts.data) setCache("shifts", shifts.data);
  if(reqs.data) setCache("shift_requests", reqs.data);
  if(periods.data) setCache("shift_periods", periods.data);
  if(tlogs.data) setCache("training_logs", tlogs.data);
}

function taskBody(t){

let notePri = "normal";
function bindTaskBodies(){
  const st = store();
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const card = b.closest(".card"); const id = card && card.dataset.t; const act = b.dataset.act;
    if(act==="clockin"){ clockIn(); openTask=null; return; }
    if(act==="clockout"){ clockOut(); openTask=null; return; }
    if(act==="done"){ addLog(id); openTask=null; toast("記録しました"); render(); return; }
    if(act==="ack"){ addLog(id); (cache.reports||[]).filter(r=>r.kind==="handoff"&&!r.ack_by).forEach(r=>{ r.ack_by=session.name; r.ack_ts=nowISO(); enqueue("reports", r, "id_update"); }); openTask=null; render(); return; }
    if(act==="cashdone"){
      const counted = parseInt($("counted").value||"",10); if(isNaN(counted)){ toast("数えた金額を入れてください"); return; }
      const c = cashExpected(); const diff = counted - c.expected;
      const reason = document.querySelector("#diffBox .chip.on"); const memo = $("diffMemo") ? $("diffMemo").value : "";
      if(diff !== 0 && !reason){ toast("差異の理由を選んでください"); return; }
      addLog(id, { counted, expected: c.expected, diff, reason: reason ? reason.textContent : "", memo, cash_sales: c.cash, paypay: c.paypay, expense: c.expense }, diff !== 0);
      if(diff !== 0) alertMail(`現金差異 ${diff>0?"+":""}${diff}円（${jdate(today())}）`, `数えた現金 ${counted}円 / あるはず ${c.expected}円\n理由: ${reason?reason.textContent:""} ${memo}\n担当: ${session.name}`);
      openTask=null; toast("締めを記録しました"); render(); return;
    }
    if(act==="tempdone"){
      const vals = {}; let bad = [];
      document.querySelectorAll(".num3 [data-k]").forEach(d => { const v = parseFloat(d.querySelector("input").value); if(isNaN(v)) return; vals[d.dataset.k] = v; const limit = d.dataset.kind==="freezer" ? st.freezer_warn : st.fridge_max; if(v > limit) bad.push(d.dataset.k); });
      if(Object.keys(vals).length === 0){ toast("温度を入れてください"); return; }
      if(bad.length){
        const chk = $("tempAlert").querySelectorAll("input[type=checkbox]");
        if(chk.length && [...chk].filter(c=>c.checked).length < chk.length){ toast("対応の3項目にチェックしてください"); return; }
        vals.recheck = parseFloat(($("recheck")||{}).value); vals.action = ($("tempMemo")||{}).value || "";
      }
      addLog(id, vals, bad.length>0);
      if(bad.length) alertMail(`温度異常（${jdate(today())}）`, Object.entries(vals).map(([k,v])=>`${k}: ${v}`).join("\n") + `\n担当: ${session.name}`);
      openTask=null; toast("記録しました"); render(); return;
    }
    if(act==="notedone"){
      const text = $("noteText").value.trim();
      addLog(id, { text, auto: autoNote(), priority: notePri });
      openTask=null; toast("記録しました"); render(); return;
    }
  });

  });

    box.innerHTML = `<div class="card alert" style="display:flex;flex-direction:column;gap:6px"><b style="color:var(--enji)">${Math.abs(diff).toLocaleString()}円 ${diff<0?"足りません":"多いです"}。理由を1つ選ぶ</b><div class="chips">${reasons.map(r=>`<button class="chip">${esc(r)}</button>`).join("")}</div><input id="diffMemo" type="text" placeholder="メモ（任意）"></div>`;
    box.querySelectorAll(".chip").forEach(ch => ch.onclick = () => { box.querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); ch.classList.add("on"); });
  }; }
  document.querySelectorAll("[data-pri]").forEach(ch => ch.onclick = () => { notePri = ch.dataset.pri; document.querySelectorAll("[data-pri]").forEach(x=>x.classList.remove("on")); ch.classList.add("on"); });

function salesSummary(){
  const rows = (cache.sales||[]).filter(s => s.biz_date===today() && s.mode!=="練習");
  const voided = new Set(rows.filter(s=>s.void_of).map(s=>s.void_of));
  const live = rows.filter(s => !s.void_of && !voided.has(s.id));
  const meals = live.reduce((n,s)=> n + s.items.filter(i=>i.category==="meal").reduce((a,i)=>a+i.qty,0), 0);
  const drinks = live.reduce((n,s)=> n + s.items.filter(i=>i.category==="drink").reduce((a,i)=>a+i.qty,0), 0);
  return { count: live.length, total: live.reduce((a,s)=>a+s.total,0), cash: live.filter(s=>s.payment==="cash").reduce((a,s)=>a+s.total,0), paypay: live.filter(s=>s.payment==="paypay").reduce((a,s)=>a+s.total,0), meals, drinks, eatin: live.filter(s=>s.mode==="店内").length, togo: live.filter(s=>s.mode==="持ち帰り").length, live };
}
function cashExpected(){
  const st = store(); const s = salesSummary();
  const mv = (cache.cash_moves||[]).filter(m => m.biz_date===today());
  const expense = mv.filter(m=>m.kind==="expense").reduce((a,m)=>a+m.amount,0);
  const prep = mv.filter(m=>m.kind==="prep").reduce((a,m)=>a+m.amount,0);
  return { fund: st.change_fund, cash: s.cash, paypay: s.paypay, expense, prep, expected: st.change_fund + s.cash - expense + prep };
}
function autoNote(){
  const rs = (cache.reports||[]).filter(r => r.biz_date===today() && r.kind!=="handoff");
  const mv = (cache.cash_moves||[]).filter(m => m.biz_date===today() && m.kind==="expense");

const nextMonthKey = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+1); return d.getFullYear()+"-"+pad(d.getMonth()+1); };
const thisMonthKey = () => today().slice(0,7);
function monthDays(mk){ const [y,m]=mk.split("-").map(Number); const n=new Date(y,m,0).getDate(); return Array.from({length:n},(_,i)=>`${mk}-${pad(i+1)}`); }
function hoursFromClocks(name, mk){
  const cs = (cache.clocks||[]).filter(c=>c.staff_name===name&&c.biz_date.startsWith(mk));
  const days = {}; cs.forEach(c => { (days[c.biz_date] ||= {})[c.kind] = c.ts; });
  let h=0, n=0, missing=[]; Object.entries(days).forEach(([d,v]) => { if(v.in) n++; if(v.in&&v.out) h += (new Date(v.out)-new Date(v.in))/3600000; else if(v.in) missing.push(d); });
  return { days:n, hours: Math.round(h*2)/2, missing };
}

function published(mk){ return (cache.shift_periods||[]).some(p=>p.month===mk&&p.published); }
function calCells(mk){
  const days = monthDays(mk); const first = pd(days[0]); const lead = (first.getDay()+6)%7;

      <a href="#staff" class="btn sub" style="text-align:center;text-decoration:none">担当者</a>
      <a href="#settings" class="btn sub" style="text-align:center;text-decoration:none">設定</a>
      <a href="#csv" class="btn sub" style="text-align:center;text-decoration:none">CSV書き出し</a>
    </div>`;
  $("app").innerHTML = shell(html);
  document.querySelectorAll("[data-ack]").forEach(b => b.onclick = () => { const r = (cache.reports||[]).find(x=>x.id===b.dataset.ack); r.ack_by=session.name; r.ack_ts=nowISO(); setCache("reports", cache.reports); enqueue("reports", r, "id_update"); render(); });
}
function renderStaffAdmin(){
  const list = cache.staff||[];
  const html = `<div class="row"><a href="#admin" style="color:var(--midori);text-decoration:none">‹ 管理</a><b>担当者</b><span></span></div>
    <div class="card" style="padding:4px 12px">${list.map(s => `<div class="kv"><span><b>${esc(s.name)}</b> <small class="muted">${s.role==="admin"?"管理者":"スタッフ"}${s.active?"":"・無効"}</small><br><small style="color:${s.pin_initial?"var(--enji)":"var(--gray)"}">${s.pin_initial?"PIN 0000（初期値のまま）":"PIN 設定済み"}</small></span><span class="chips"><button class="chip" data-reset="${s.id}">PINを0000に</button><button class="chip" data-toggle="${s.id}">${s.active?"無効にする":"有効にする"}</button></span></div>`).join("")}</div>
    <div class="card" style="border-style:dashed;display:flex;flex-direction:column;gap:8px"><b>担当者を追加</b><input id="nsName" type="text" placeholder="名前（例：田中）"><label class="ck"><input id="nsAdmin" type="checkbox"> 管理者</label><div class="muted">初回PINは 0000。本人に「学ぶ」の一番下から変えてもらう</div><button class="btn" id="nsGo">追加する</button></div>
    <div class="muted">辞めた人は削除せず「無効」にします（過去の記録に名前が残るため）</div>`;
  $("app").innerHTML = shell(html);
  const h0 = () => sha256("0000"+CONFIG.PIN_SALT);
  document.querySelectorAll("[data-reset]").forEach(b => b.onclick = async () => { if(!confirm("PINを0000に戻しますか？")) return; const h = await h0(); const { error } = await sb.from("staff").update({ pin_hash:h, pin_initial:true }).eq("id", b.dataset.reset); if(error){ toast("失敗しました"); return; } await loadMaster(); render(); });
  document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => { const s = list.find(x=>x.id===b.dataset.toggle); const { error } = await sb.from("staff").update({ active: !s.active }).eq("id", s.id); if(error){ toast("失敗しました"); return; } await loadMaster(); render(); });
  $("nsGo").onclick = async () => { const name = $("nsName").value.trim(); if(!name){ toast("名前を入れてください"); return; } const h = await h0(); const { error } = await sb.from("staff").insert({ store_id:S, name, role: $("nsAdmin").checked?"admin":"staff", pin_hash:h, pin_initial:true, sort: 50+list.length }); if(error){ toast("追加できませんでした："+error.message); return; } await loadMaster(); toast(name+" を追加しました"); render(); };
}
function renderSettings(){
  const st = store();
  const html = `<div class="row"><a href="#admin" style="color:var(--midori);text-decoration:none">‹ 管理</a><b>設定</b><span></span></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px">
      <div class="grid3"><div><label class="muted">開店</label><input id="sOpen" type="time" value="${st.open_time}"></div><div><label class="muted">営業終了</label><input id="sClose" type="time" value="${st.close_time}"></div><div><label class="muted">退勤目安</label><input id="sLeave" type="time" value="${st.leave_time}"></div></div>
      <div class="grid3"><div><label class="muted">釣銭準備金</label><input id="sFund" type="number" value="${st.change_fund}"></div><div><label class="muted">冷蔵 基準℃</label><input id="sFridge" type="number" step="0.5" value="${st.fridge_max}"></div><div><label class="muted">冷凍 基準℃</label><input id="sFreezer" type="number" step="0.5" value="${st.freezer_warn}"></div></div>
      <label class="ck"><input id="sPayPay" type="checkbox" ${st.paypay_enabled?"checked":""}> レジにPayPayボタンを出す</label>
      <div><label class="muted">通知メール</label><input id="sMail" type="email" value="${esc(st.alert_email||"")}"></div>
      <button class="btn" id="sGo">保存</button>
    </div>
    <div class="sec">来月のシフト希望の締切</div>
    <div class="card"><div class="row"><span>${Number(nextMonthKey().split("-")[1])}月分</span><input id="sDeadline" type="date" value="${((cache.shift_periods||[]).find(p=>p.month===nextMonthKey())||{}).deadline||""}" style="width:auto"><button class="btn sm" id="sDl">設定</button></div><div class="muted">設定すると全員の「シフト」タブに未提出の帯が出ます</div></div>
    <div class="muted">商品と価格の変更は、当面はSupabaseの products テーブルで直接行います</div>`;
  $("app").innerHTML = shell(html);
  $("sGo").onclick = async () => { const upd = { open_time:$("sOpen").value, close_time:$("sClose").value, leave_time:$("sLeave").value, change_fund:parseInt($("sFund").value,10), fridge_max:parseFloat($("sFridge").value), freezer_warn:parseFloat($("sFreezer").value), paypay_enabled:$("sPayPay").checked, alert_email:$("sMail").value }; const { error } = await sb.from("stores").update(upd).eq("id", S); if(error){ toast("保存できませんでした"); return; } Object.assign(cache.store, upd); setCache("store", cache.store); toast("保存しました"); };
  $("sDl").onclick = async () => { const row = { store_id:S, month: nextMonthKey(), deadline: $("sDeadline").value||null, published:false }; const { error } = await sb.from("shift_periods").upsert(row, { onConflict:"store_id,month" }); if(error){ toast("失敗しました"); return; } await loadMine(session.name); toast("設定しました"); render(); };
}
let saMonth = null;
function renderShiftAdmin(){
  const mk = saMonth || nextMonthKey(); const days = monthDays(mk).filter(d=>pd(d).getDay()!==0);
  const reqs = (cache.shift_requests||[]).filter(r=>r.day.startsWith(mk));
  const shifts = (cache.shifts||[]).filter(s=>s.day.startsWith(mk));
  const names = staffList().map(s=>s.name);
  const submitted = [...new Set(reqs.map(r=>r.staff_name))];
  const period = (cache.shift_periods||[]).find(p=>p.month===mk);
  const perName = {}; shifts.forEach(s => perName[s.staff_name] = (perName[s.staff_name]||0)+1);
  const mark = (n,d) => { const r = reqs.find(x=>x.staff_name===n&&x.day===d); return r ? (r.pref==="ok"?"○":r.pref==="maybe"?"△":"×") : ""; };
  const html = `<div class="row"><a href="#admin" style="color:var(--midori);text-decoration:none">‹ 管理</a><b>${Number(mk.split("-")[1])}月のシフトを組む</b><span class="chips"><button class="chip" id="saPrev">‹</button><button class="chip" id="saNext">›</button></span></div>
    <div class="band amber" style="margin:0 -14px;font-size:12px"><div class="row"><span>希望 提出済 ${submitted.length} 人（${esc(submitted.join("・"))||"なし"}）${period&&period.deadline?`　締切 ${jdate(period.deadline)}`:""}</span><span style="color:var(--enji);font-weight:bold">${period&&period.published?"公開済み":"未公開"}</span></div></div>
    <div class="muted">名前を押して入れる／外す。数字は希望（○△×）</div>
    <div class="card" style="padding:4px 12px"><table class="tb">${days.map(d => `<tr><td style="width:64px;white-space:nowrap">${jdate(d)}</td><td><div class="chips">${names.map(n => { const on = shifts.some(s=>s.staff_name===n&&s.day===d); const m = mark(n,d); return `<button class="chip ${on?"ok":m==="×"?"":""}" data-d="${d}" data-n="${esc(n)}" style="${m==="×"&&!on?"opacity:.45":""}">${esc(n)}${m?` ${m}`:""}</button>`; }).join("")}</div>${shifts.filter(s=>s.day===d).length===0?'<div style="color:var(--enji);font-size:11px;margin-top:2px">未定</div>':""}</td></tr>`).join("")}</table></div>
    <div class="sec">今月の人別</div><div class="card" style="font-size:13px">${names.map(n=>`<div class="kv"><span>${esc(n)}</span><span>${perName[n]||0}日</span></div>`).join("")}</div>
    <div class="row" style="gap:10px"><button class="btn sub" id="saCopy" style="flex:1">先月と同じ曜日パターンで埋める</button><button class="btn ${period&&period.published?"sub":""}" id="saPub" style="flex:1">${period&&period.published?"公開を取り消す":"確定して公開"}</button></div>
    <div class="sec">先月の出退勤（給与計算用）</div><div class="card" style="font-size:13px">${names.map(n=>{ const h=hoursFromClocks(n, prevMonthKey()); return `<div class="kv"><span>${esc(n)}</span><span>${h.days}日　${h.hours}h ${h.missing.length?`<span style="color:var(--enji)">退勤打刻なし ${h.missing.map(x=>x.slice(5)).join(",")}</span>`:""}</span></div>`; }).join("")}</div>`;
  $("app").innerHTML = shell(html);
  $("saPrev").onclick = () => { const [y,m]=mk.split("-").map(Number); const d=new Date(y,m-2,1); saMonth=d.getFullYear()+"-"+pad(d.getMonth()+1); render(); };
  $("saNext").onclick = () => { const [y,m]=mk.split("-").map(Number); const d=new Date(y,m,1); saMonth=d.getFullYear()+"-"+pad(d.getMonth()+1); render(); };
  document.querySelectorAll("[data-d][data-n]").forEach(b => b.onclick = async () => { const d=b.dataset.d, n=b.dataset.n; const ex = shifts.find(s=>s.staff_name===n&&s.day===d); if(ex){ await sb.from("shifts").delete().eq("id", ex.id); cache.shifts = cache.shifts.filter(s=>s.id!==ex.id); setCache("shifts", cache.shifts); } else { const row = { id:uuid(), store_id:S, staff_name:n, day:d, start_time:"10:15", end_time:"15:15", published: !!(period&&period.published) }; localAdd("shifts", row); enqueue("shifts", row, "store_id,staff_name,day"); } render(); });
  $("saPub").onclick = async () => { const pub = !(period&&period.published); const { error } = await sb.from("shift_periods").upsert({ store_id:S, month:mk, deadline: period?period.deadline:null, published: pub }, { onConflict:"store_id,month" }); if(error){ toast("失敗しました"); return; } await sb.from("shifts").update({ published: pub }).eq("store_id", S).gte("day", mk+"-01").lte("day", mk+"-31"); await loadMine(session.name); toast(pub?"公開しました":"公開を取り消しました"); render(); };
  $("saCopy").onclick = () => { const pm = prevMonthKey(); const prev = (cache.shifts||[]).filter(s=>s.day.startsWith(pm)); if(!prev.length){ toast("先月のシフトがありません"); return; } days.forEach(d => { const dow = pd(d).getDay(); const who = [...new Set(prev.filter(s=>pd(s.day).getDay()===dow).map(s=>s.staff_name))]; who.forEach(n => { if(!shifts.some(s=>s.staff_name===n&&s.day===d)){ const row = { id:uuid(), store_id:S, staff_name:n, day:d, start_time:"10:15", end_time:"15:15", published:false }; localAdd("shifts", row); enqueue("shifts", row, "store_id,staff_name,day"); } }); }); render(); };
}
function prevMonthKey(){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function renderCsv(){
  const html = `<div class="row"><a href="#admin" style="color:var(--midori);text-decoration:none">‹ 管理</a><b>CSV書き出し</b><span></span></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px"><label class="muted">月</label><input id="csvMonth" type="month" value="${thisMonthKey()}"><div class="grid2"><button class="btn sub" data-csv="sales">会計</button><button class="btn sub" data-csv="cash_moves">現金の出入り</button><button class="btn sub" data-csv="clocks">出退勤</button><button class="btn sub" data-csv="task_logs">リスト記録</button><button class="btn sub" data-csv="reports">報告</button></div><div class="muted">端末にダウンロードされます（税理士・給与計算用）</div></div>`;
  $("app").innerHTML = shell(html);
  document.querySelectorAll("[data-csv]").forEach(b => b.onclick = async () => { const mk = $("csvMonth").value; const t = b.dataset.csv; const col = t==="clocks"||t==="task_logs"||t==="reports"||t==="sales"||t==="cash_moves" ? "biz_date" : "day"; const { data, error } = await sb.from(t).select("*").eq("store_id", S).gte(col, mk+"-01").lte(col, mk+"-31").order(col); if(error||!data){ toast("取得できませんでした"); return; } if(!data.length){ toast("データがありません"); return; } const keys = Object.keys(data[0]); const csv = "﻿" + [keys.join(","), ...data.map(r => keys.map(k => { let v = r[k]; if(v && typeof v === "object") v = JSON.stringify(v); return '"' + String(v ?? "").replace(/"/g,'""') + '"'; }).join(","))].join("\n"); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = `orion_${t}_${mk}.csv`; a.click(); });
}

// ===================== 起動 =====================
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
boot();
</script>
