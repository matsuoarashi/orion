<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>管理者 | 洋食オリオン</title>
<meta name="apple-mobile-web-app-title" content="管理者">
<link rel="manifest" href="manifest-kanri.json">
<link rel="apple-touch-icon" href="icon-admin-180.png?v=b">
<style>
:root{ --g:#2c4f39; --g-d:#1f3a2a; --g-l:#e4eee7; --cream:#faf6ee; --cream-d:#ece4d2; --ink:#2b2a26; --mute:#7a7265; --red:#a33c2e; --red-l:#f6e3df; --amber:#b7791f; --line:#d9d1bd; --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom); }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--cream);color:var(--ink);font-size:16px}
.hide{display:none!important}
.app{display:flex;flex-direction:column;height:100%}
header{background:var(--g-d);color:#fff;padding:calc(6px + var(--sat)) 10px 4px;flex:none}
.top{display:flex;align-items:center;gap:8px;padding:2px 2px 6px}
.top .t{font-size:11px;letter-spacing:3px;opacity:.75;flex:none}
.top .n{font-size:17px;font-weight:bold;flex:1;letter-spacing:1px}
.top .logo{height:24px;width:auto;display:block;margin-right:auto}
.top button.rl{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
/* 下のタブ（スタッフアプリ・経費と同じ形）。ホームバーにかからないよう下に余白 */
nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:max(var(--sab), 6px)}
nav button{flex:1;border:0;background:none;padding:9px 1px 5px;font-size:11px;color:var(--mute);min-height:54px;white-space:nowrap;position:relative}
nav button i{display:block;font-style:normal;font-size:19px;line-height:1.2;margin-bottom:1px}
nav button.on{color:var(--g);font-weight:bold}
/* タブのアイコン：アプリアイコンと同じ太めの線。選んでいるタブには金の三つ星 */
nav button i{display:flex!important;justify-content:center;align-items:center;height:24px;margin:0 auto 2px;font-size:0!important;position:relative;width:24px}
nav button i svg{display:block}
nav button.on i::before{content:"";position:absolute;top:-4px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#c9a24a;box-shadow:-5px 1.5px 0 #c9a24a,5px -1.5px 0 #c9a24a}
nav .bd{position:absolute;top:3px;right:calc(50% - 22px);min-width:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;line-height:16px}
#frames{flex:1;position:relative;background:var(--cream)}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--cream)}
.login{max-width:400px;margin:0 auto;padding:calc(40px + var(--sat)) 20px 20px}
.login h1{font-size:22px;letter-spacing:6px;text-align:center;color:var(--g)}
.login .s{text-align:center;color:var(--mute);font-size:13px;margin:6px 0 24px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
select,input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:17px;background:#fff;font-family:inherit}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:bold;color:#fff;background:var(--g);margin-top:20px}
.msg{background:var(--red-l);color:var(--red);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:10px}
.msg:empty{display:none}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:16px;line-height:1.6}
/* メニュー（11/5）：普段使わない画面・設定・勤怠・ログアウトはここに */
#menuOv{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
#menuOv .sh{background:var(--cream);width:100%;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + var(--sab));max-height:85%;overflow:auto}
#menuOv .me{font-size:12px;color:var(--mute);margin:0 4px 10px}
#menuOv .gr{font-size:11px;color:var(--mute);letter-spacing:2px;margin:12px 4px 6px}
#menuOv .it{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;font-size:16px;color:var(--ink);text-align:left}
#menuOv .it i{display:flex;width:24px;justify-content:center;color:var(--g);font-style:normal}
#menuOv .it small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
#menuOv .it.on{border-color:var(--g);border-width:2px}
#menuOv .cl{display:block;width:100%;border:0;background:none;color:var(--mute);padding:12px;font-size:15px}
</style>
</head>
<body>
<div id="vLogin" class="login hide">
  <h1>管 理 者</h1>
  <div class="s">洋食オリオン｜分析・発注・経費・スタッフ・採用</div>
  <div class="msg" id="loginMsg"></div>
  <label>名前（管理者）</label><select id="staffSel"><option value="">読み込み中…</option></select>
  <label>パスコード（勤怠アプリと同じ）</label><input type="password" inputmode="numeric" id="passIn" placeholder="●●●●" autocomplete="off">
  <button class="btn" id="loginBtn" onclick="doLogin()">ログイン</button>
  <div class="note">ここに 1 回ログインすると、分析・発注・経費・スタッフ管理の全部に入れます。<br>スタッフの方は「勤怠アプリ」を使ってください。</div>
</div>

<div id="vApp" class="app hide">
  <header>
    <div class="top"><img class="logo" src="logo-mark.png" alt="オリオン"><span class="n" id="secTitle" hidden></span><button class="rl" onclick="reloadCur()" aria-label="更新" title="更新"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button></div>
  </header>
  <div id="frames"></div>
  <nav id="nav"></nav>
</div>

<script src="busy.js?v=1101b"></script>
<script>
// 管理者アプリ：1 つの入口。中身は既存の画面を順に移していく（段階統合の第1段）
const STAFF_API = "https://script.google.com/macros/s/AKfycbwgGW6rXzAW2rHVicdoCMdHOT_E3egrXPsaEJerX-_brZr0mYF6Qo_tRorX8PgLc7c/exec";
// 中の画面を更新したら V を変える（スマホに残った古い画面を読み直させるため）
const V = "1106c";
const SECTIONS = [
  { id:"shime", label:"分析", ic:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-5M10 20v-9M15 20v-6M20 20V7"/></svg>', src:"dashboard.html?embed=1&v="+V },
  { id:"hacchu", label:"発注", ic:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8l8-4 8 4v8.5L12 21l-8-4.5z"/><path d="M4 8l8 4.3L20 8M12 12.3V21"/></svg>', src:"hacchu.html?embed=1&v="+V },
  { id:"keihi", label:"経費", ic:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-3-1.8-3 1.8-3-1.8-3 1.8z"/><path d="M9.2 8.5h5.6M9.2 12.5h5.6"/></svg>', src:"keihi.html?embed=1&v="+V },
  { id:"staff", label:"スタッフ", ic:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12.5" r="7.5"/><path d="M12 8.5v4.3l3 1.9"/></svg>', src:"staff/admin.html?embed=1&v="+V },
  { id:"recruit", menu:true, sub:"応募者・面接", label:"採用", ic:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.5" cy="8" r="3.3"/><path d="M3.5 20c0-3.5 2.7-6.2 6-6.2s6 2.7 6 6.2"/><path d="M18.5 8.5v6M15.5 11.5h6"/></svg>', src:"recruit.html?embed=1&v="+V },
  { id:"google", menu:true, sub:"口コミ返信・プロフィール", label:"口コミ", ic:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v10.5H10l-4.5 3.5V16H4z"/><path d="M12 7.8l1.1 2.2 2.4.3-1.8 1.6.5 2.4-2.2-1.2-2.2 1.2.5-2.4-1.8-1.6 2.4-.3z"/></svg>', src:"kuchikomi.html?embed=1&v="+V },
  { id:"settei", label:"設定", hidden:true, sub:"LINE配信・Google連携", src:"settei.html?embed=1&v="+V },   // 上の帯の「設定」から開く（下のタブには出さない）
  { id:"start", menu:true, sub:"出店の案件・物件探し", label:"出店", ic:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10h17l-1.8-5.5H5.3z"/><path d="M5 10v10h14V10"/><path d="M10 20v-5.2h4V20"/></svg>', src:"start.html?embed=1&v="+V },
];
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let CUR = null;
function ls(k, v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }

// 前回ログインした管理者なら確認を待たずにすぐ開く（確認は裏で。期限切れならログイン画面へ）
async function boot(){
  const tok = ls("os-admin-token") || ls("os-token");
  let cached = null; try{ cached = JSON.parse(ls("kanri-me")||"null"); }catch(e){}
  if (tok && cached && cached.role === "admin"){
    enter(tok, cached);
    const me = await whoami(tok);
    if (me === false){ ls("kanri-me", null); showLogin("ログインの期限が切れました。もう一度ログインしてください"); }
    return;
  }
  if (tok){ $("vLogin").classList.remove("hide"); $("loginMsg").textContent = ""; $("staffSel").innerHTML = '<option value="">確認中…</option>';
    const me = await whoami(tok); if (me && me.role === "admin"){ enter(tok, me); return; } }
  showLogin();
}
// 戻り値：管理者情報／false（ログイン無効）／null（通信できず＝判断しない）
// ログイン切れ・管理者でない＝無効（false）、それ以外の失敗は判断保留（null）
async function whoami(tok){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), 15000);
  try{ const r = await fetch(STAFF_API, {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({action:"home", token:tok}), signal:c.signal, busy:false}).then(r=>r.json()); if (r.ok) return (r.staff && r.staff.role === "admin") ? r.staff : false; return r.code === "noauth" ? false : null; }catch(e){ return null; } finally{ clearTimeout(t); }
}
async function showLogin(msg){
  $("frames").innerHTML = ""; // 中の画面は古いログイン状態のままなので捨てる（再ログイン後に読み直す）
  $("vApp").classList.add("hide"); $("vLogin").classList.remove("hide"); $("loginMsg").textContent = msg||"";
  try{ const r = await fetch(STAFF_API+"?action=staff_list").then(r=>r.json());
    const adm = (r.staff||[]).filter(s=>s.role==="admin"); const list = adm.length ? adm : (r.staff||[]);
    $("staffSel").innerHTML = `<option value="">名前を選んでください</option>` + list.map(s=>`<option value="${esc(s.staff_id)}">${esc(s.name)}</option>`).join("");
  }catch(e){ $("loginMsg").textContent = "通信できません。電波を確認してください"; }
}
async function doLogin(){
  const id = $("staffSel").value, pass = $("passIn").value.trim(); if(!id){ $("loginMsg").textContent="名前を選んでください"; return; } if(!pass){ $("loginMsg").textContent="パスコードを入力してください"; return; }
  $("loginBtn").disabled = true;
  try{ const r = await fetch(STAFF_API, {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({action:"login", staff_id:id, passcode:pass, ua:navigator.userAgent})}).then(r=>r.json());
    if(!r.ok){ $("loginMsg").textContent = r.error||"ログインできません"; return; }
    if(!r.staff || r.staff.role !== "admin"){ $("loginMsg").textContent = "管理者ではありません。スタッフの方は勤怠アプリを使ってください"; return; }
    $("passIn").value = ""; enter(r.token, r.staff);
  }catch(e){ $("loginMsg").textContent = "通信できません"; } finally{ $("loginBtn").disabled = false; }
}
function enter(tok, me){
  // 中の画面は同じ場所のログイン情報を読むので、両方の鍵に入れておく
  ls("os-token", tok); ls("os-admin-token", tok); try{ ls("kanri-me", JSON.stringify({name:me.name, role:me.role, staff_id:me.staff_id})); }catch(e){}
  $("vLogin").classList.add("hide"); $("vApp").classList.remove("hide"); ME_NAME = me.name;
  $("nav").innerHTML = SECTIONS.filter(s=>!s.hidden && !s.menu).map(s=>`<button id="nb_${s.id}" onclick="show('${s.id}')"><i>${s.ic||"•"}</i>${esc(s.label)}</button>`).join("")
    + `<button id="nb_menu" onclick="openMenu()"><i>${MENU_IC}</i>メニュー</button>`;
  const first = (location.hash||"").slice(1); show(SECTIONS.some(s=>s.id===first) ? first : (ls("kanri-tab")||"shime"));
}
// 画面は開いたときに初めて読み込み、以後は切り替えても保持（行き来しても入力が消えない）
function show(id){
  if (LOCKED && CUR) return;
  const sec = SECTIONS.find(s=>s.id===id) || SECTIONS[0]; if (CUR && CUR !== "settei" && sec.id === "settei") ls("kanri-prev", CUR); CUR = sec.id; if (!sec.hidden) ls("kanri-tab", CUR); history.replaceState(null, "", "#"+CUR);
  closeMenu(); $("secTitle").textContent = sec.label; const nm = $("nb_menu"); if (nm) nm.classList.toggle("on", !!(sec.menu || sec.hidden));
  SECTIONS.forEach(s=>{ const nb = $("nb_"+s.id); if (nb) nb.classList.toggle("on", s.id===CUR); const f = $("fr_"+s.id); if (f) f.classList.toggle("hide", s.id!==CUR); });
  if (!$("fr_"+CUR)){ const f = document.createElement("iframe"); f.id = "fr_"+CUR; f.src = sec.src; f.title = sec.label; f.onload = ()=>tidy(f); $("frames").appendChild(f); }
}
// 中の画面の見出し・ログイン表示は管理者アプリと重なるので隠す。中から別の画面を開くときは管理者アプリのタブで開く
const HIDE_CSS = {
  shime: ".app > header{display:none!important}",
  keihi: "header{display:none!important} nav{order:-1;border-top:0!important;border-bottom:1px solid #d9d1bd;padding-bottom:0!important}",   // 経費の切り替えは上に（下は管理者アプリのタブ）
  staff: "header{display:none!important} .tabs{top:0!important}",
  hacchu: "header:has(#hBack.hide){display:none!important}",   // 発注のトップでは見出しを出さない（品目・棚卸しなど中の画面では「戻る」があるので出す）
  recruit: "",
  start: "header{display:none!important} .tabs{top:0!important}",
  google: "header{display:none!important} .tabs{top:0!important}",
  settei: "header{display:none!important}"
};
const OPEN_MAP = [[/(^|\/)admin\.html/, "staff"], [/hacchu\.html/, "hacchu"], [/keihi\.html/, "keihi"], [/dashboard\.html/, "shime"], [/recruit\.html/, "recruit"], [/kuchikomi\.html/, "google"]];
function tidy(f){
  try{
    const w = f.contentWindow, d = f.contentDocument, id = f.id.slice(3);
    if (HIDE_CSS[id]){ const st = d.createElement("style"); st.textContent = HIDE_CSS[id]; d.head.appendChild(st); }
    const orig = w.open.bind(w);
    w.open = function(url){ const u = String(url||""); const m = OPEN_MAP.find(x=>x[0].test(u)); if (m){ show(m[1]); return null; } return orig.apply(w, arguments); };
  }catch(e){}
}
// 新しい版が出ていたらアプリごと読み直す（ホーム画面のアプリは古い画面を持ち続けるため）。開いたとき・戻ってきたとき・「更新」で確認
async function checkUpdate(){
  if (LOCKED) return false;
  try{ const t = await (await fetch("kanri.html?check="+Date.now(), {cache:"no-store", busy:false})).text(); const m = t.match(/const V = "([^"]+)"/);
    if (m && m[1] !== V){ location.replace("kanri.html?v="+encodeURIComponent(m[1])+location.hash); return true; } }catch(e){}
  return false;
}
// 中の画面が送信中（経費のアップロードなど）は、上下のボタン・タブ・自動の読み直しを止める（11/3）
// 中の画面から {orionLock:true/false} が届く。届かなくなっても 3 分で外す
let LOCKED = false, LOCK_TO = null;
function setLock(on){
  LOCKED = !!on; clearTimeout(LOCK_TO); if (LOCKED) LOCK_TO = setTimeout(()=>setLock(false), 180000);
  let lk = $("pLock"); if (!lk){ lk = document.createElement("div"); lk.id = "pLock"; lk.style.cssText = "position:fixed;inset:0;z-index:99990;background:transparent;display:none;touch-action:none"; document.body.appendChild(lk);
    ["click","touchstart","pointerdown"].forEach(ev=>lk.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); }, true)); }
  lk.style.display = LOCKED ? "block" : "none";
  document.querySelectorAll("header, #nav").forEach(el=>{ el.style.opacity = LOCKED ? ".45" : ""; });
}
window.addEventListener("message", e=>{ if (e.origin !== location.origin) return; const d = e.data || {}; if ("orionLock" in d) setLock(d.orionLock); });
window.addEventListener("beforeunload", e=>{ if (LOCKED){ e.preventDefault(); e.returnValue = "送信中です"; return "送信中です"; } });
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible" && !LOCKED) checkUpdate(); });
async function reloadCur(){ if (LOCKED) return; if (await checkUpdate()) return; const f = $("fr_"+CUR); if (f) f.contentWindow.location.reload(); }
// メニュー：下のタブに置かない画面（採用・口コミ・出店・設定）と、勤怠・ログアウト
let ME_NAME = "";
const MENU_IC = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
function openMenu(){ if (LOCKED) return; closeMenu();
  const it = s=>`<button class="it ${s.id===CUR?"on":""}" onclick="show('${s.id}')"><i>${s.ic||"⚙︎"}</i><span>${esc(s.label)}<small>${esc(s.sub||"")}</small></span></button>`;
  const ov = document.createElement("div"); ov.id = "menuOv"; ov.onclick = e=>{ if (e.target === ov) closeMenu(); };
  ov.innerHTML = `<div class="sh"><div class="me">${esc(ME_NAME)}（管理者）でログイン中</div>
    <div class="gr">ときどき使う</div>${SECTIONS.filter(s=>s.menu).map(it).join("")}
    <div class="gr">設定・その他</div>${SECTIONS.filter(s=>s.id==="settei").map(it).join("")}
    <button class="it" onclick="location.href='staff/'"><i>🕘</i><span>勤怠アプリへ<small>打刻・店の仕事</small></span></button>
    <button class="it" onclick="logout()"><i>↩︎</i><span>ログアウト</span></button>
    <button class="cl" onclick="closeMenu()">閉じる</button></div>`;
  document.body.appendChild(ov); }
function closeMenu(){ const o = $("menuOv"); if (o) o.remove(); }
function logout(){ if (LOCKED) return; if(!confirm("ログアウトしますか？")) return; ls("os-admin-token", null); ls("os-token", null); ls("kanri-me", null); $("frames").innerHTML = ""; showLogin(); }
boot(); checkUpdate();
</script>
</body>
</html>
