<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2c4f39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icon-192.png">
<title>ORION STAFF</title>
<style>
:root{ --g:#2c4f39; --g-d:#1f3a2a; --g-l:#e4eee7; --cream:#faf6ee; --cream-d:#ece4d2; --ink:#2b2a26; --mute:#7a7265; --red:#a33c2e; --red-l:#f6e3df; --amber:#b7791f; --amber-l:#f7ebd3; --blue:#3b5a9a; --blue-l:#e6ebf7; --line:#d9d1bd; --r:14px; --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom); }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.5}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{height:100%;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--cream)}
header{flex:none;background:var(--g);color:#fff;padding:calc(10px + var(--sat)) 16px 10px;display:flex;justify-content:space-between;align-items:center}
header .t{font-size:11px;letter-spacing:4px;opacity:.8}
header .n{font-size:17px;font-weight:bold}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:7px 12px;font-size:13px}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}
nav{flex:none;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--sab)}
nav button{flex:1;border:0;background:none;padding:8px 2px 6px;font-size:11px;color:var(--mute);min-height:56px}
nav button i{display:block;font-style:normal;font-size:20px;line-height:1.2;margin-bottom:1px}
nav button.on{color:var(--g);font-weight:bold}
nav button .bd{display:inline-block;min-width:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;line-height:16px;margin-left:3px;vertical-align:top}
.hide{display:none !important}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:12px;letter-spacing:3px;color:var(--g);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{letter-spacing:0;color:var(--mute);font-weight:normal;font-size:12px}
.big{font-size:30px;font-weight:bold;line-height:1.2;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--mute);margin-top:4px}
.mini{font-size:13px;color:var(--mute);line-height:1.5}
.btn{display:block;width:100%;border:0;border-radius:var(--r);padding:18px 12px;font-size:21px;font-weight:bold;color:#fff;background:var(--g);letter-spacing:2px;line-height:1.3}
.btn.out{background:var(--red)}
.btn.sec{background:var(--cream-d);color:var(--ink);font-size:16px;padding:14px 12px;letter-spacing:0}
.btn.sm{font-size:15px;padding:12px}
.btn:disabled{opacity:.45}
.btn + .btn{margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .l{min-width:0}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--g-l);color:var(--g);white-space:nowrap}
.pill.red{background:var(--red-l);color:var(--red)} .pill.amber{background:var(--amber-l);color:var(--amber)} .pill.blue{background:var(--blue-l);color:var(--blue)}
.status{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:#c8c0ae;flex:none}
.dot.on{background:#2e8b57;box-shadow:0 0 0 4px rgba(46,139,87,.18)}
.dot.done{background:var(--g)}
.login{padding:calc(36px + var(--sat)) 22px 40px;overflow-y:auto;height:100%}
.login h1{font-size:14px;letter-spacing:6px;color:var(--g);text-align:center;margin-bottom:6px}
.login .store{text-align:center;color:var(--mute);font-size:13px;margin-bottom:26px}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sel button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:16px 6px;font-size:17px;font-weight:bold;min-height:60px}
.sel button.on{border-color:var(--g);background:var(--g-l)}
input,select,textarea{width:100%;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;min-height:50px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.msg{padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:12px;line-height:1.5}
.msg.err{background:var(--red-l);color:var(--red)} .msg.ok{background:var(--g-l);color:var(--g)}
.toast{position:fixed;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:8}
.sheet{background:var(--cream);border-radius:18px 18px 0 0;padding:16px 16px calc(22px + var(--sab));width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto}
.sheet h3{font-size:17px;margin-bottom:6px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
/* 時刻入力（表示は24時間、タップで端末のドラムピッカー） */
.timebox{display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:stretch;margin:12px 0 8px}
.timebox button{border:2px solid var(--line);background:#fff;border-radius:12px;font-size:15px;font-weight:bold;min-height:64px}
.tdisp{position:relative;border:2px solid var(--line);border-radius:12px;background:#fff;text-align:center;font-size:40px;font-weight:bold;padding:6px 4px 4px;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.1}
.tdisp small{display:block;font-size:11px;font-weight:normal;color:var(--mute);letter-spacing:0;line-height:1.4}
.tdisp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;min-height:0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.chips.c3{grid-template-columns:repeat(3,1fr)} .chips.c4{grid-template-columns:repeat(4,1fr)}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-size:15px;font-weight:bold;min-height:52px;line-height:1.3}
.chip.on{border-color:var(--g);background:var(--g-l)}
.chip:disabled{opacity:.4}
.chip small{display:block;font-weight:normal;font-size:11px;color:var(--mute)}
/* 希望カレンダー */
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.modes button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 2px;font-size:13px;font-weight:bold;min-height:54px;line-height:1.3}
.modes button small{display:block;font-weight:normal;font-size:10px;color:var(--mute)}
.modes button.on.ok{border-color:var(--g);background:var(--g-l);color:var(--g)}
.modes button.on.time{border-color:var(--amber);background:var(--amber-l);color:var(--amber)}
.modes button.on.off{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal .h{text-align:center;font-size:11px;color:var(--mute);padding:2px 0}
.cal .d{border:1.5px solid var(--line);border-radius:9px;height:58px;padding:3px 2px;font-size:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;overflow:hidden;cursor:pointer;user-select:none}
.cal .d.closed{background:var(--cream-d);color:#b5ad9c;cursor:default}
.cal .d .n{font-weight:bold;line-height:1.2}
.cal .d .k{font-size:10px;line-height:1.2;border-radius:5px;padding:2px 2px;width:100%;text-align:center;white-space:nowrap;overflow:hidden}
.cal .d.ok{background:var(--g-l);border-color:var(--g)} .cal .d.ok .k{color:var(--g)}
.cal .d.time{background:var(--amber-l);border-color:var(--amber)} .cal .d.time .k{color:var(--amber)}
.cal .d.off{background:var(--blue-l);border-color:var(--blue)} .cal .d.off .k{color:var(--blue)}
.cal .d.sun .n{color:var(--red)} .cal .d.sat .n{color:var(--blue)}
.cal .d.closed .n{color:#b5ad9c}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.legend .ok::before{background:var(--g-l);border-color:var(--g)} .legend .time::before{background:var(--amber-l);border-color:var(--amber)} .legend .off::before{background:var(--blue-l);border-color:var(--blue)} .legend .closed::before{background:var(--cream-d)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.summary div{background:var(--cream);border-radius:10px;padding:8px 4px;text-align:center}
.summary b{display:block;font-size:20px;line-height:1.2}
.summary span{font-size:11px;color:var(--mute)}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px;font-size:13px;min-height:44px}
.monthnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.monthnav button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;font-size:16px;min-height:44px}
.monthnav b{font-size:17px}
.foot{margin:4px 0 8px}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;background:linear-gradient(90deg,transparent 0%,#e9b949 40%,#e9b949 60%,transparent 100%);background-size:200% 100%;opacity:0;transition:opacity .2s;pointer-events:none}
#bar.on{opacity:1;animation:slide 1s linear infinite}
@keyframes slide{from{background-position:200% 0}to{background-position:-200% 0}}
body.lock .btn,body.lock .chip,body.lock .cal .d,body.lock .modes button,body.lock .tools button{pointer-events:none;opacity:.55}
#punchArea .btn{margin-bottom:12px}
.stale{opacity:.6}
.link{background:none;border:0;color:var(--g);text-decoration:underline;font-size:14px;padding:8px 0}
.editrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.editrow button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;min-height:64px;text-align:center}
.editrow button small{display:block;font-size:11px;color:var(--mute)}
.editrow button b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.editrow button.changed{border-color:var(--amber);background:var(--amber-l)}
.editrow button.changed b{color:var(--amber)}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
</style>
</head>
<body>
<div class="app">
  <!-- ログイン -->
  <div id="vLogin" class="login">
    <h1>ORION STAFF</h1>
    <div class="store" id="loginStore">洋食オリオン</div>
    <div id="loginMsg"></div>
    <div class="mini" style="margin-bottom:6px">名前を選んでください</div>
    <div class="sel" id="staffSel"></div>
    <label>パスコード（数字）</label>
    <input type="password" inputmode="numeric" pattern="[0-9]*" id="passIn" placeholder="●●●●●●" autocomplete="off">
    <div style="height:18px"></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">ログイン</button>
    <p class="mini center" style="margin-top:16px">パスコードを忘れたときは管理者に連絡してください</p>
  </div>

  <!-- 本体 -->
  <div id="vApp" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header>
      <div><div class="t">ORION STAFF</div><div class="n" id="hName">-</div></div>
      <button onclick="doLogout()">ログアウト</button>
    </header>
    <main id="main">
      <div id="msg"></div>

      <!-- ホーム -->
      <section id="pHome">
        <div class="card">
          <h2>本日 <small id="hToday"></small></h2>
          <div class="big" id="hShift">-</div>
          <div class="sub" id="hShiftSub"></div>
        </div>
        <div id="punchArea"></div>
        <div class="card">
          <div class="row"><span class="l">次回の勤務</span><b id="hNext">-</b></div>
          <div class="row" id="hWishRow"><span class="l">来月の希望</span><b id="hWish"></b></div>
        </div>
        <button class="btn sec" id="hWishBtn" onclick="go('wish')">来月の希望を入力する</button>
      </section>

      <!-- 希望シフト -->
      <section id="pWish" class="hide">
        <div class="card">
          <div class="monthnav"><button onclick="wishMove(-1)">◀</button><b id="wishMonth"></b><button onclick="wishMove(1)">▶</button></div>
          <div class="mini" id="wishInfo"></div>
          <div id="wishBody">
            <div class="modes" id="modes">
              <button class="ok on" onclick="setMode('ok')">○ 出られる<small>タップで付け外し</small></button>
              <button class="time" onclick="setMode('time')">時間を指定<small id="modeTimeLabel">11:00〜14:00</small></button>
              <button class="off" onclick="setMode('off')">休み希望<small>この日は避けたい</small></button>
            </div>
            <div id="timePick" class="hide">
              <div class="chips c3" id="timePresets"></div>
              <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center">
                <input type="time" id="wStart" value="11:00" onchange="syncTimeLabel()"><span>〜</span><input type="time" id="wEnd" value="14:00" onchange="syncTimeLabel()">
              </div>
              <div class="mini" style="margin-top:4px">この時間で、日をタップしてください</div>
            </div>
            <div class="cal" id="wishCal"></div>
            <div class="legend"><span class="ok">出られる</span><span class="time">時間指定</span><span class="off">休み希望</span><span class="closed">定休日</span><span>白＝出られない</span></div>
            <div class="tools"><button onclick="selectAllOpen()">営業日をぜんぶ○にする</button><button onclick="clearAll()">すべて消す</button></div>
          </div>
        </div>
        <div id="wishFoot">
          <div class="card" style="padding:10px 14px">
            <div class="summary" id="wishSummary"></div>
            <label style="margin-top:0">ひとこと（任意）</label>
            <input type="text" id="wNote" maxlength="80" placeholder="例: 第2週は試験のため少なめ希望">
          </div>
          <div class="foot"><button class="btn" id="wishSaveBtn" onclick="saveWish()">この内容で提出する</button></div>
        </div>
      </section>

      <!-- 確定シフト -->
      <section id="pShift" class="hide">
        <div class="card">
          <div class="monthnav"><button onclick="shiftMove(-1)">◀</button><b id="shiftMonth"></b><button onclick="shiftMove(1)">▶</button></div>
          <div id="shiftList"></div>
        </div>
      </section>

      <!-- 勤務履歴 -->
      <section id="pHist" class="hide">
        <div class="card">
          <div class="monthnav"><button onclick="histMove(-1)">◀</button><b id="histMonth"></b><button onclick="histMove(1)">▶</button></div>
          <div class="summary" style="grid-template-columns:1fr 1fr"><div><b id="histDays">-</b><span>勤務日数</span></div><div><b id="histHours">-</b><span>労働時間</span></div></div>
          <div class="mini" style="margin:4px 0 6px">時刻が違う日は、その行をタップして修正を申請できます</div>
          <div id="histList"></div>
        </div>
        <div class="card" id="fixCard">
          <h2>修正申請の状況</h2>
          <div id="fixList"></div>
        </div>
        <div class="card">
          <h2>パスコード</h2>
          <button class="btn sec sm" onclick="openPass()">パスコードを変更する</button>
        </div>
      </section>
    </main>
    <nav>
      <button id="n_home" class="on" onclick="go('home')"><i>⌂</i>ホーム</button>
      <button id="n_wish" onclick="go('wish')"><i>✎</i>希望<span class="bd hide" id="bdWish">!</span></button>
      <button id="n_shift" onclick="go('shift')"><i>▦</i>シフト</button>
      <button id="n_hist" onclick="go('hist')"><i>≡</i>履歴</button>
    </nav>
  </div>
</div>
<div id="bar"></div>
<div class="toast" id="toast"></div>
<div id="ov"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwgGW6rXzAW2rHVicdoCMdHOT_E3egrXPsaEJerX-_brZr0mYF6Qo_tRorX8PgLc7c/exec";
const $ = id => document.getElementById(id);
let TOKEN = localStorage.getItem("os-token") || "";
let ME = null, SET = null, HOME = null;
let busy = false;

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); }
function showMsg(el, text, cls){ el.innerHTML = text ? `<div class="msg ${cls||"err"}">${text}</div>` : ""; }
// 書き込み系は同時に1つだけ（二重タップ防止）。進行中は上部に黄色いバー。
const WRITES = new Set(["punch","wishes_save","fix_request","change_pass","login","logout"]);
let inflight = 0;
async function api(action, body){
  const isWrite = WRITES.has(action);
  if (isWrite && document.body.classList.contains("lock")) return {ok:false, error:"処理中です。少しお待ちください", code:"busy"};
  inflight++; $("bar").classList.add("on"); if (isWrite) document.body.classList.add("lock");
  try{
    body = Object.assign({action, token: TOKEN}, body||{});
    const res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(body)});
    const j = await res.json();
    if (!j.ok && j.code==="noauth"){ localStorage.removeItem("os-token"); TOKEN=""; cclear(); showLogin("ログインの期限が切れました"); }
    return j;
  }catch(e){ return {ok:false, error:"通信エラーです。電波を確認してもう一度お試しください", code:"net"}; }
  finally{ inflight--; if (inflight<=0){ inflight=0; $("bar").classList.remove("on"); } if (isWrite) document.body.classList.remove("lock"); }
}
// 画面ごとの前回結果を端末に残し、まず表示してから裏で更新
let CACHE = (()=>{ try{ return JSON.parse(localStorage.getItem("os-cache")||"{}"); }catch(e){ return {}; } })();
function cget(k){ return CACHE[k]; }
function cset(k,v){ CACHE[k]=v; try{ localStorage.setItem("os-cache", JSON.stringify(CACHE)); }catch(e){} }
function cclear(){ CACHE={}; try{ localStorage.removeItem("os-cache"); }catch(e){} }
function todayStr(){ const d=new Date(); return d.getFullYear()+"/"+pad2(d.getMonth()+1)+"/"+pad2(d.getDate()); }
function pad2(n){ return String(n).padStart(2,"0"); }
function ymAdd(ym, n){ let [y,m]=ym.split("/").map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+"/"+pad2(m); }
function thisMonth(){ const d=new Date(); return d.getFullYear()+"/"+pad2(d.getMonth()+1); }
const YO = ["日","月","火","水","木","金","土"];
function youbi(ds){ const [y,m,d]=ds.split("/").map(Number); return YO[new Date(y,m-1,d).getDay()]; }
function fmtMin(m){ return Math.floor(m/60)+"時間"+pad2(m%60)+"分"; }
function nowHM(){ const d=new Date(); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function round5(hm){ let [h,m]=hm.split(":").map(Number); m=Math.round(m/5)*5; if(m===60){m=0;h=(h+1)%24;} return pad2(h)+":"+pad2(m); }
function toMinC(hm){ const [h,m]=String(hm).split(":").map(Number); return h*60+m; }
function shortT(t){ return String(t).replace(/^0/,"").replace(/:00$/,""); }
function mdLabel(ds){ return ds.slice(5)+"("+youbi(ds)+")"; }
function monthLabel(ym){ return ym.replace("/","年")+"月"; }
function closeOv(){ $("ov").innerHTML = ""; }
function sheet(html){ $("ov").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeOv()"><div class="sheet"><div class="grab"></div>${html}</div></div>`; }

// ───── ログイン ─────
async function showLogin(msg){
  $("vLogin").classList.remove("hide"); $("vApp").classList.add("hide");
  showMsg($("loginMsg"), msg||"", "err");
  try{
    const r = await fetch(API_URL+"?action=staff_list").then(r=>r.json());
    $("loginStore").textContent = r.store_name || "洋食オリオン";

// ───── ホーム・打刻 ─────

function renderPunch(r){

    <div class="chips">
      <button class="chip" onclick="ptSet('${now}')">今の時刻<small>${now}</small></button>

function ptSet(v){ $("pt").value=v; ptSync(); }
function ptSync(){ const v=$("pt").value; if(v) $("ptd").textContent=v; }
function ptAdd(n){ const el=$("pt"); if(!el.value) return; let m=toMinC(el.value)+n; m=(m+1440)%1440; ptSet(pad2(Math.floor(m/60))+":"+pad2(m%60)); }
function setBrk(n){ document.querySelectorAll("#brkChips .chip").forEach((b,i)=>b.classList.toggle("on",[0,15,30,45][i]===n)); $("brk").value=n; }
async function punch(type, breakMin, time){

// ───── 希望シフト ─────
// 使い方：モード（○ / 時間 / 休）を選び、日をタップで付け外し。白＝出られない日。最後に提出。
let WISH = {month:null, days:{}, locked:false, openDays:[], mode:"ok", note:""};
async function loadWish(month){
  const key = "wish:"+(month||"next"); const c = cget(key); if (c){ renderWish(c); }
  else { $("wishMonth").textContent = month ? monthLabel(month) : "…"; $("wishInfo").textContent = "読み込み中…"; }
  WISH.dirty = false;
  const r = await api("wishes_get", {month}); if(!r.ok){ if(!c) showMsg($("msg"), r.error); return; }
  cset(key, r); if (WISH.dirty && c) return; // 編集中なら上書きしない
  renderWish(r);
}
function renderWish(r){
  WISH.month = r.month; WISH.locked = r.locked; WISH.openDays = r.openDays; WISH.days = {}; WISH.note = "";
  r.days.forEach(d=>{ if (d.kind==="ng") return; WISH.days[d.date] = d; if (d.note && !WISH.note) WISH.note = d.note; });
  $("wNote").value = WISH.note;
  $("wishMonth").textContent = monthLabel(r.month);
  $("wishInfo").innerHTML = r.locked
    ? `<span class="pill red">締切済み（${r.deadline.slice(5)}）</span> この月の希望は締め切りました。変更は松尾さん・長下さんに直接伝えてください。`
    : `締切 <b>${r.deadline.slice(5)}(${youbi(r.deadline)})</b>。出られる日をタップして○を付け、最後に「提出する」。締切までは何度でも直せます。`;
  $("wishBody").classList.toggle("hide", r.locked); $("wishFoot").classList.toggle("hide", r.locked);
  renderPresets(); setMode("ok"); renderWishCal();
}
function wishMove(n){ loadWish(ymAdd(WISH.month, n)); }
function renderPresets(){
  const ps = (SET && SET.presets && SET.presets.length) ? SET.presets : ["10:15-15:15","11:00-14:00","10:15-14:00"];
  $("timePresets").innerHTML = ps.slice(0,3).map(p=>{ const [a,b]=p.split("-"); return `<button class="chip" onclick="setPreset('${a}','${b}')">${shortT(a)}〜${shortT(b)}</button>`; }).join("");
}
function setPreset(a,b){ $("wStart").value=a; $("wEnd").value=b; syncTimeLabel(); }
function syncTimeLabel(){ const a=$("wStart").value, b=$("wEnd").value; if(a&&b) $("modeTimeLabel").textContent = a+"〜"+b; document.querySelectorAll("#timePresets .chip").forEach(c=>c.classList.toggle("on", c.textContent===shortT(a)+"〜"+shortT(b))); }
function setMode(m){ WISH.mode = m; document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on", b.classList.contains(m))); $("timePick").classList.toggle("hide", m!=="time"); syncTimeLabel(); }
function renderWishCal(){
  const [y,m] = WISH.month.split("/").map(Number); const first = new Date(y,m-1,1).getDay();
  let html = YO.map(x=>`<div class="h">${x}</div>`).join("");
  for (let i=0;i<first;i++) html += `<div></div>`;
  WISH.openDays.forEach(d=>{
    const dn = Number(d.date.slice(8)); const dow = new Date(y,m-1,dn).getDay(); const w = WISH.days[d.date];
    const cls = ["d", d.open?"":"closed", dow===0?"sun":dow===6?"sat":"", w?w.kind:""].join(" ");
    const k = !w ? "" : w.kind==="ok" ? "○" : w.kind==="off" ? "休" : shortT(w.start)+"-"+shortT(w.end);
    html += `<div class="${cls}" onclick="tapDay('${d.date}')"><span class="n">${dn}</span>${k?`<span class="k">${k}</span>`:""}</div>`;
  });
  $("wishCal").innerHTML = html;
  const c = {ok:0,time:0,off:0}; Object.values(WISH.days).forEach(w=>{ c[w.kind]=(c[w.kind]||0)+1; });
  $("wishSummary").innerHTML = `<div><b>${c.ok}</b><span>出られる日</span></div><div><b>${c.time}</b><span>時間指定</span></div><div><b>${c.off}</b><span>休み希望</span></div>`;
}
function tapDay(ds){
  WISH.dirty = true;
  if (WISH.locked){ toast("締切を過ぎています。管理者に伝えてください"); return; }
  const od = WISH.openDays.find(x=>x.date===ds); if (od && !od.open){ toast("定休日です"); return; }
  const cur = WISH.days[ds]; const m = WISH.mode;
  if (m==="time"){ const a=$("wStart").value, b=$("wEnd").value; if(!a||!b){ toast("時間を入れてください"); return; } if(toMinC(a)>=toMinC(b)){ toast("終了は開始より後にしてください"); return; }
    if (cur && cur.kind==="time" && cur.start===a && cur.end===b) delete WISH.days[ds]; else WISH.days[ds] = {date:ds, kind:"time", start:a, end:b}; }
  else { if (cur && cur.kind===m) delete WISH.days[ds]; else WISH.days[ds] = {date:ds, kind:m}; }
  renderWishCal();
}
function selectAllOpen(){ WISH.dirty = true; WISH.openDays.filter(d=>d.open).forEach(d=>{ if(!WISH.days[d.date]) WISH.days[d.date]={date:d.date, kind:"ok"}; }); renderWishCal(); toast("営業日をすべて○にしました。出られない日をタップして外してください"); }
function clearAll(){ if(!confirm("この月の入力をすべて消しますか？（提出するまで保存はされません）")) return; WISH.dirty = true; WISH.days={}; renderWishCal(); }
async function saveWish(){
  const note = $("wNote").value.trim();
  const days = Object.values(WISH.days).map((w,i)=>Object.assign({}, w, {note: i===0 ? note : ""}));
  if(!days.length && !confirm("1日も○が付いていません。「出られる日なし」で提出しますか？")) return;
  $("wishSaveBtn").disabled = true;
  const r = await api("wishes_save", {month:WISH.month, days});
  $("wishSaveBtn").disabled = false;
  if(!r.ok){ showMsg($("msg"), r.error); return; }
  WISH.dirty = false; const ck = cget("wish:"+WISH.month) || cget("wish:next"); if (ck){ ck.days = days; cset("wish:"+WISH.month, ck); if (cget("wish:next") && cget("wish:next").month===WISH.month) cset("wish:next", ck); }
  const hc = cget("home"); if (hc && hc.wishMonth===WISH.month){ hc.wishCount = days.length; cset("home", hc); }
  toast(`${r.saved}日分を提出しました`); showMsg($("msg"), `${monthLabel(WISH.month)}分の希望を提出しました（${r.saved}日分）。締切までは何度でも直せます。`, "ok");
  $("main").scrollTo({top:0, behavior:"smooth"}); $("bdWish").classList.add("hide");

// 修正申請：その日の記録を表示し、直したい値をタップして選ぶ（時刻は端末のピッカー）
let FIX = null;
function openFix(date){
  const a = (HIST && HIST.list.find(x=>x.date===date)) || (HOME && HOME.att && HOME.today===date ? HOME.att : null);
  FIX = {date, cur:{in:a?a.in:"", out:a?a.out:"", brk:a?a.breakMin:0}, want:{in:a?a.in:"", out:a?a.out:"", brk:a?a.breakMin:0}};
  sheet(`
    <h3>${mdLabel(date)} の打刻を修正</h3>
    <div class="mini">直したい項目をタップして、正しい値を選んでください</div>
    <div class="editrow" style="margin:12px 0">
      <button id="fxIn" onclick="pickTime('in')"><small>出勤</small><b>${FIX.cur.in||"--:--"}</b></button>
      <button id="fxOut" onclick="pickTime('out')"><small>退勤</small><b>${FIX.cur.out||"--:--"}</b></button>
      <button id="fxBrk" onclick="pickBrk()"><small>休憩</small><b>${FIX.cur.brk}分</b></button>
    </div>
    <div id="fxPick"></div>
    <label>理由</label>
    <select id="fxReason"><option>打刻を忘れた</option><option>押すのが遅れた</option><option>早く押しすぎた</option><option>休憩の入力を間違えた</option><option>その他</option></select>
    <div style="height:12px"></div>
    <button class="btn" onclick="sendFix()">この内容で申請する</button>
    <button class="btn sec" style="margin-top:10px" onclick="closeOv()">やめる</button>`);
}
function pickTime(f){
  const v = FIX.want[f] || FIX.cur[f] || (f==="in" ? "10:15" : "15:15");
  $("fxPick").innerHTML = `<div class="mini">${f==="in"?"出勤":"退勤"}の正しい時刻</div><div class="timebox"><button onclick="fxAdd('${f}',-5)">−5分</button><div class="tdisp"><span id="fxd">${v}</span><small>タップで時刻を選ぶ</small><input type="time" id="fxt" value="${v}" step="300" onchange="fxSet('${f}', this.value)"></div><button onclick="fxAdd('${f}',5)">+5分</button></div>`;
  fxSet(f, v);
}
function fxSet(f, v){ if(!v) return; FIX.want[f]=v; const d=$("fxd"); if(d) d.textContent=v; const t=$("fxt"); if(t) t.value=v; const b=$(f==="in"?"fxIn":"fxOut"); b.querySelector("b").textContent=v; b.classList.toggle("changed", v!==FIX.cur[f]); }
function fxAdd(f,n){ let m=toMinC(FIX.want[f]||FIX.cur[f]||"10:00")+n; m=(m+1440)%1440; fxSet(f, pad2(Math.floor(m/60))+":"+pad2(m%60)); }
function pickBrk(){
  $("fxPick").innerHTML = `<div class="mini">休憩の正しい分数</div><div class="chips c4" style="margin-top:6px">${[0,15,30,45,60,75,90,120].map(n=>`<button class="chip ${FIX.want.brk===n?"on":""}" onclick="fxBrk(${n})">${n}分</button>`).join("")}</div>`;
}
function fxBrk(n){ FIX.want.brk=n; document.querySelectorAll("#fxPick .chip").forEach(c=>c.classList.toggle("on", c.textContent===n+"分")); const b=$("fxBrk"); b.querySelector("b").textContent=n+"分"; b.classList.toggle("changed", n!==FIX.cur.brk); }
async function sendFix(){
  const reqs = [];
  if (FIX.want.in && FIX.want.in!==FIX.cur.in) reqs.push({field:"出勤", wanted:FIX.want.in});
  if (FIX.want.out && FIX.want.out!==FIX.cur.out) reqs.push({field:"退勤", wanted:FIX.want.out});
  if (FIX.want.brk!==FIX.cur.brk) reqs.push({field:"休憩", wanted:String(FIX.want.brk)});
  if (!reqs.length){ toast("変更がありません。直したい項目をタップしてください"); return; }
  if (FIX.want.in && FIX.want.out && toMinC(FIX.want.out) <= toMinC(FIX.want.in)){ toast("退勤は出勤より後にしてください"); return; }
  const reason = $("fxReason").value;
  if(!confirm(`${mdLabel(FIX.date)}：${reqs.map(r=>r.field+"→"+r.wanted+(r.field==="休憩"?"分":"")).join("、")} で申請します。よろしいですか？`)) return;
  for (const q of reqs){ const r = await api("fix_request", {date:FIX.date, field:q.field, wanted:q.wanted, reason}); if(!r.ok){ showMsg($("msg"), r.error); closeOv(); return; } }
  closeOv(); toast("申請しました。管理者の承認をお待ちください"); loadHist(); if(HOME && HOME.today===FIX.date) loadHome();
}
function openPass(){
  sheet(`<h3>パスコードを変更</h3><div class="mini">4桁以上の数字。次回から新しいパスコードでログインします。</div>
    <label>新しいパスコード</label><input type="password" inputmode="numeric" id="npass" placeholder="●●●●●●">
    <label>もう一度</label><input type="password" inputmode="numeric" id="npass2" placeholder="●●●●●●">
    <div style="height:12px"></div><button class="btn" onclick="changePass()">変更する</button><button class="btn sec" style="margin-top:10px" onclick="closeOv()">やめる</button>`);
}
async function changePass(){
  const p = $("npass").value.trim(), p2 = $("npass2").value.trim();
  if(!/^\d{4,}$/.test(p)){ toast("4桁以上の数字にしてください"); return; } if(p!==p2){ toast("2回の入力が一致しません"); return; }
  const r = await api("change_pass", {newpass:p}); if(!r.ok){ showMsg($("msg"), r.error); return; } closeOv(); toast("パスコードを変更しました");
}

// ───── 起動 ─────
(async function(){
  if ("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
  if (!TOKEN){ showLogin(); return; }
  try{ const r = await api("home"); if(r.ok){ HOME=r; ME=r.staff; SET=r.settings; enterApp(); } else if(r.code!=="noauth"){ showLogin(r.error); } }
  catch(e){ showLogin("通信できません"); }
})();
</script>
</body>
</html>
