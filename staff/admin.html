<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a2a">
<title>ORION STAFF 管理</title>
<style>
:root{ --g:#2c4f39; --g-d:#1f3a2a; --g-l:#e4eee7; --cream:#faf6ee; --cream-d:#ece4d2; --ink:#2b2a26; --mute:#7a7265; --red:#a33c2e; --amber:#b7791f; --line:#d9d1bd; --blue:#2a5aa8; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5}
.app{max-width:860px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--g-d);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header .t{font-size:11px;letter-spacing:4px;opacity:.8} header .n{font-size:16px;font-weight:bold}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:54px;z-index:4}
.tabs button{flex:1;min-width:84px;border:0;background:none;padding:12px 6px;font-size:14px;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--g);font-weight:bold;border-bottom-color:var(--g)}
main{flex:1;padding:14px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:12px;letter-spacing:3px;color:var(--g);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{letter-spacing:0;color:var(--mute);font-weight:normal}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--cream);border-radius:10px;padding:10px 12px}
.kpi small{display:block;font-size:11px;letter-spacing:2px;color:var(--g)} .kpi b{font-size:22px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);gap:8px}
.row:last-child{border-bottom:0}
.btn{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:bold;color:#fff;background:var(--g);cursor:pointer}
.btn.sec{background:var(--cream-d);color:var(--ink);font-weight:normal} .btn.red{background:var(--red)} .btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--g-l);color:var(--g);white-space:nowrap}
.pickrow{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px} .pick{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:16px;font-weight:bold;cursor:pointer;background:#fff} .pick:has(input:checked){border-color:var(--g);background:var(--g-l)} .pick input{margin:0}
.pill.red{background:#f6e3df;color:var(--red)} .pill.amber{background:#f7ebd3;color:var(--amber)} .pill.gray{background:#eee;color:#666} .pill.blue{background:#e3eaf7;color:var(--blue)}
input,select,textarea{font-size:15px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--g)}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}
.msg{padding:10px 14px;border-radius:10px;font-size:14px;margin-bottom:12px}
.msg.err{background:#f6e3df;color:var(--red)} .msg.ok{background:var(--g-l);color:var(--g)}
.hide{display:none !important}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--g);font-size:11px;letter-spacing:0;font-weight:bold;background:var(--cream);white-space:nowrap}
td{white-space:nowrap}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.monthnav{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:10px}
.monthnav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font-size:16px}
.monthnav b{font-size:17px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:8;padding:14px}
.sheet{background:var(--cream);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.sheet h3{font-size:16px;margin-bottom:8px}
.mini{font-size:12px;color:var(--mute)}
.login{padding:40px 20px;max-width:420px;margin:0 auto}
.login h1{font-size:14px;letter-spacing:6px;color:var(--g);text-align:center;margin-bottom:24px}
/* シフト表 */
.sg{display:grid;grid-template-columns:70px repeat(var(--n),1fr);gap:3px;font-size:12px}
.sg .hd{font-weight:bold;color:var(--g);text-align:center;padding:4px 0;font-size:11px}
.sg .dt{padding:6px 4px;border-radius:6px;background:var(--cream);font-variant-numeric:tabular-nums}
.sg .dt.closed{background:#eee;color:#999}
.sg .dt .y{font-size:10px;color:var(--mute)} .sg .dt .sun{color:var(--red)} .sg .dt .sat{color:var(--blue)}
.sg .cell{border:1px solid var(--line);border-radius:6px;min-height:40px;padding:3px 4px;background:#fff;cursor:pointer;position:relative}
.sg .cell.closed{background:#f3f3f3;border-style:dashed;cursor:default}
.sg .cell .w{font-size:10px;color:var(--mute);line-height:1.2}
.sg .cell .w.ok{color:var(--g)} .sg .cell .w.ng,.sg .cell .w.off{color:var(--red)} .sg .cell .w.time{color:var(--amber)}
.sg .cell .s{display:block;font-weight:bold;font-size:12px;line-height:1.2}
.sg .cell .s.draft{color:var(--amber)} .sg .cell .s.confirmed{color:var(--g)}
.sg .cell .sync{position:absolute;top:2px;right:3px;font-size:9px}
.sg .need{font-size:10px;color:var(--mute);text-align:right}
.sg .need.short{color:var(--red);font-weight:bold}
.legend{font-size:11px;color:var(--mute);margin:6px 0}
pre.copy{white-space:pre-wrap;background:var(--cream);border-radius:8px;padding:10px;font-size:13px;line-height:1.6}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;background:linear-gradient(90deg,transparent 0%,#e9b949 40%,#e9b949 60%,transparent 100%);background-size:200% 100%;opacity:0;transition:opacity .2s;pointer-events:none}
#bar.on{opacity:1;animation:slide 1s linear infinite}
@keyframes slide{from{background-position:200% 0}to{background-position:-200% 0}}
body.lock .btn,body.lock .sg .cell{pointer-events:none;opacity:.55}
body.loading main{opacity:.6;transition:opacity .2s}
.loadmsg{display:flex;align-items:center;gap:10px;color:var(--mute);padding:18px 4px;font-size:14px}
.loadmsg::before{content:"";width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bk{width:100%;border-collapse:collapse;font-size:13px}.bk th,.bk td{border-bottom:1px dashed var(--line);padding:6px 4px;text-align:left;white-space:nowrap}.bk td.r,.bk th.r{text-align:right}
#ld{position:fixed;inset:0;z-index:30;background:rgba(250,246,238,.72);display:none;align-items:center;justify-content:center;backdrop-filter:blur(1px)}
#ld.on{display:flex}
#ld .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.12)}
#ld .sp{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div id="vLogin" class="login">
    <h1>ORION STAFF 管理</h1>
    <div id="loginMsg"></div>
    <label>管理者</label><select id="adminSel"></select>
    <label>パスコード</label><input type="password" inputmode="numeric" id="passIn" autocomplete="off">
    <div style="height:16px"></div>
    <button class="btn" style="width:100%;padding:16px;font-size:18px" id="loginBtn" onclick="doLogin()">ログイン</button>
  </div>

  <div id="vApp" class="hide" style="display:flex;flex-direction:column;flex:1">
    <header><div><div class="t">ORION STAFF 管理</div><div class="n" id="hName">-</div></div><div><a href="index.html" style="color:#fff;font-size:13px;margin-right:10px;opacity:.85">スタッフ画面</a><button onclick="doLogout()">ログアウト</button></div></header>
    <div class="tabs">
      <button class="on" data-t="today" onclick="go('today')">今日</button>
      <button data-t="shift" onclick="go('shift')">シフト</button>
      <button data-t="att" onclick="go('att')">勤怠</button>
      <button data-t="pay" onclick="go('pay')">給与</button>
      <button data-t="staff" onclick="go('staff')">スタッフ</button>
      <button data-t="set" onclick="go('set')">設定</button>
    </div>
    <main>
      <div id="msg"></div>
      <section id="pToday"></section>
      <section id="pShift" class="hide"></section>
      <section id="pAtt" class="hide"></section>
      <section id="pPay" class="hide"></section>
      <section id="pStaff" class="hide"></section>
      <section id="pSet" class="hide"></section>
    </main>
  </div>
</div>
<div id="bar"></div>
<div id="ld"><div class="box"><span class="sp"></span><span id="ldt">読み込み中…</span></div></div>
<div class="toast" id="toast"></div>
<div id="ov"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwgGW6rXzAW2rHVicdoCMdHOT_E3egrXPsaEJerX-_brZr0mYF6Qo_tRorX8PgLc7c/exec";
const $ = id => document.getElementById(id);
let TOKEN = localStorage.getItem("os-admin-token") || ""; let ME=null;
const YO = ["日","月","火","水","木","金","土"];
const yen = n => (Math.round(n||0)).toLocaleString()+"円";
const pad2 = n => String(n).padStart(2,"0");
const thisMonth = () => { const d=new Date(); return d.getFullYear()+"/"+pad2(d.getMonth()+1); };
const ymAdd = (ym,n) => { let [y,m]=ym.split("/").map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+"/"+pad2(m); };
const ymLabel = ym => ym.replace("/","年")+"月";
const youbi = ds => { const [y,m,d]=ds.split("/").map(Number); return new Date(y,m-1,d).getDay(); };
const fmtMin = m => Math.floor(m/60)+":"+pad2(m%60);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); }
function showMsg(text, cls){ $("msg").innerHTML = text ? `<div class="msg ${cls||"err"}">${esc(text)}</div>` : ""; if(text) window.scrollTo(0,0); }
// 読み取り以外は同時に1つだけ（二重タップ防止）。通信中は上部に黄色いバー、0.3秒超で画面を薄く
const READS = new Set(["admin.staff_list","admin.wishes_month","admin.shifts_month","admin.att_month","admin.payroll_month","admin.dashboard","admin.settings_get","admin.sync_status","admin.audit","admin.line_text","admin.bank_get","admin.payroll_csv","admin.bank_csv","staff_list"]);
let inflight = 0, dimT = null;
async function api(action, body){
  const isWrite = !READS.has(action);
  if (isWrite && document.body.classList.contains("lock")) return {ok:false, error:"処理中です。少しお待ちください", code:"busy"};
  inflight++; $("bar").classList.add("on"); if (isWrite) document.body.classList.add("lock");
  const LDMSG = {"admin.shifts_confirm":"確定してカレンダーに登録しています…","admin.payroll_close":"締めています…","admin.sync_retry":"カレンダーと同期しています…","admin.backup_now":"バックアップ中…","admin.shifts_save":"保存しています…","admin.shifts_copy":"コピーしています…","login":"ログインしています…"}; if (!window._ldT) window._ldT = setTimeout(()=>{ $("ldt").textContent = (isWrite ? (LDMSG[action]||"処理しています…") : "読み込み中…"); $("ld").classList.add("on"); }, 200); else if (isWrite) $("ldt").textContent = LDMSG[action]||"処理しています…";
  if (!dimT) dimT = setTimeout(()=>document.body.classList.add("loading"), 300);
  try{
    const res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(Object.assign({action, token:TOKEN}, body||{}))});
    const j = await res.json();
    if (!j.ok && j.code==="noauth"){ localStorage.removeItem("os-admin-token"); TOKEN=""; showLogin("ログインし直してください"); }
    return j;
  }catch(e){ return {ok:false, error:"通信エラーです。電波を確認してもう一度お試しください", code:"net"}; }
  finally{ inflight--; if (inflight<=0){ inflight=0; $("bar").classList.remove("on"); clearTimeout(window._ldT); window._ldT=null; $("ld").classList.remove("on"); clearTimeout(dimT); dimT=null; document.body.classList.remove("loading"); } if (isWrite) document.body.classList.remove("lock"); }
}
function loadingHtml(t){ return `<div class="loadmsg">${t||"読み込み中…"}</div>`; }
function closeOv(){ $("ov").innerHTML=""; }
function modal(html){ $("ov").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeOv()"><div class="sheet">${html}</div></div>`; }
function download(name, text){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:"text/csv"})); a.download=name; a.click(); }

// ───── ログイン ─────
async function showLogin(msg){
  $("vLogin").classList.remove("hide"); $("vApp").classList.add("hide");
  $("loginMsg").innerHTML = msg?`<div class="msg err">${esc(msg)}</div>`:"";
  try{ const r = await fetch(API_URL+"?action=staff_list").then(r=>r.json());
    $("adminSel").innerHTML = (r.staff||[]).filter(s=>s.role==="admin").map(s=>`<option value="${s.staff_id}">${esc(s.name)}</option>`).join("");
  }catch(e){ $("loginMsg").innerHTML = `<div class="msg err">通信できません</div>`; }
}
async function doLogin(){
  $("loginBtn").disabled=true;
  try{ const r = await api("login", {staff_id:$("adminSel").value, passcode:$("passIn").value.trim(), ua:navigator.userAgent});
    if(!r.ok){ $("loginMsg").innerHTML=`<div class="msg err">${esc(r.error)}</div>`; return; }
    if(r.staff.role!=="admin"){ $("loginMsg").innerHTML=`<div class="msg err">管理者ではありません</div>`; return; }
    TOKEN=r.token; localStorage.setItem("os-admin-token",TOKEN); ME=r.staff; $("passIn").value=""; enterApp();
  }catch(e){ $("loginMsg").innerHTML=`<div class="msg err">通信エラー</div>`; } finally{ $("loginBtn").disabled=false; }
}
async function doLogout(){ if(!confirm("ログアウトしますか？")) return; await api("logout"); localStorage.removeItem("os-admin-token"); TOKEN=""; showLogin(); }
function enterApp(){ $("vLogin").classList.add("hide"); $("vApp").classList.remove("hide"); $("hName").textContent = ME.name; go("today"); }
function go(t){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.t===t));
  ["today","shift","att","pay","staff","set"].forEach(x=>$("p"+x[0].toUpperCase()+x.slice(1)).classList.toggle("hide", x!==t));
  showMsg(""); ({today:loadToday, shift:loadShift, att:loadAtt, pay:loadPay, staff:loadStaff, set:loadSet})[t]();
}

// ───── 今日 ─────
async function loadToday(){ if(!$("pToday").dataset.loaded) $("pToday").innerHTML = loadingHtml(); $("pToday").dataset.loaded="1";
  $("pToday").innerHTML = `<div class="mini">読み込み中…</div>`;
  const r = await api("admin.dashboard"); if(!r.ok){ showMsg(r.error); return; }
  const attBy = {}; r.todayAtt.forEach(a=>attBy[a.staff_id]=a);
  const working = r.todayAtt.filter(a=>a.status==="working").length, done = r.todayAtt.filter(a=>a.status==="done").length;
  const notIn = r.todayShifts.filter(s=>!attBy[s.staff_id]);
  const laborToday = (r.labor.find(l=>l.date===r.today)||{}).cost||0;
  const monthCost = r.payroll.reduce((s,x)=>s+x.total,0), monthMin = r.payroll.reduce((s,x)=>s+x.minutes,0);
  let html = `<div class="card"><h2>本日 ${r.today.slice(5)}(${YO[youbi(r.today)]}) <small>${r.now} 時点</small></h2>
    <div class="grid3"><div class="kpi"><small>予定</small><b>${r.todayShifts.length}<span style="font-size:13px">人</span></b></div><div class="kpi"><small>勤務中</small><b>${working}<span style="font-size:13px">人</span></b></div><div class="kpi"><small>退勤済</small><b>${done}<span style="font-size:13px">人</span></b></div></div>
    <div style="margin-top:10px">` +
    (r.todayShifts.map(s=>{ const a=attBy[s.staff_id]; const st = !a?`<span class="pill gray">未出勤</span>`: a.status==="working"?`<span class="pill">勤務中 ${a.in}〜</span>`:`<span class="pill blue">退勤 ${a.in}〜${a.out}</span>`; return `<div class="row"><span><b>${esc(s.name)}</b> <span class="mini">${s.start}〜${s.end}</span></span>${st}</div>`; }).join("") || `<div class="mini">本日の確定シフトはありません</div>`) +
    r.todayAtt.filter(a=>!r.todayShifts.some(s=>s.staff_id===a.staff_id)).map(a=>`<div class="row"><span><b>${esc(a.name)}</b> <span class="mini">予定外</span></span><span class="pill amber">${a.in}〜${a.out||""}</span></div>`).join("") +
    `</div></div>`;
  const alerts = [];
  if (r.missing.length) alerts.push(`退勤打刻のない日が ${r.missing.length} 件（${r.missing.slice(0,3).map(m=>m.date.slice(5)+" "+esc(m.name)).join("、")}${r.missing.length>3?" ほか":""}）→ 勤怠タブで修正`);
  if (r.pendingFix) alerts.push(`修正申請が ${r.pendingFix} 件 承認待ち → 勤怠タブ`);
  if (r.syncIssues) alerts.push(`カレンダー未同期のシフトが ${r.syncIssues} 件 → 設定タブで再同期`);
  if (!r.calendarSet) alerts.push(`Googleカレンダーが未設定です → 設定タブ`);
  const wishNot = r.wishStatus.filter(w=>!w.submitted);
  if (wishNot.length) alerts.push(`${ymLabel(r.wishMonth)}の希望が未提出：${wishNot.map(w=>esc(w.name)).join("、")}（締切 ${r.wishDeadline.slice(5)}）`);
  html += `<div class="card"><h2>確認が必要なこと</h2>${alerts.length? alerts.map(a=>`<div class="row"><span>⚠ ${a}</span></div>`).join("") : `<div class="mini">特にありません</div>`}</div>`;
  html += `<div class="card"><h2>${ymLabel(r.month)}の人件費 <small>実績ベース</small></h2>
    <div class="grid3"><div class="kpi"><small>実績</small><b style="font-size:18px">${yen(monthCost)}</b></div><div class="kpi"><small>予定</small><b style="font-size:18px">${yen(r.plannedCost)}</b></div><div class="kpi"><small>労働時間</small><b style="font-size:18px">${fmtMin(monthMin)}</b></div></div>
    <div style="margin-top:8px">${r.payroll.filter(p=>p.days>0).map(p=>`<div class="row"><span>${esc(p.name)} <span class="mini">${p.days}日 ${fmtMin(p.minutes)}</span></span><b>${yen(p.total)}</b></div>`).join("") || `<div class="mini">今月の勤務実績はまだありません</div>`}</div></div>`;
  html += `<div class="card"><h2>日別人件費（今月）<small>人時売上高は分析シートで</small></h2><div class="scroll"><table><tr><th>日</th><th class="r">人数</th><th class="r">時間</th><th class="r">人件費</th></tr>${r.labor.slice().reverse().map(l=>`<tr><td>${l.date.slice(5)}(${YO[youbi(l.date)]})</td><td class="r">${l.staff}</td><td class="r">${fmtMin(l.minutes)}</td><td class="r">${yen(l.cost)}</td></tr>`).join("") || `<tr><td colspan="4" class="mini">まだありません</td></tr>`}</table></div></div>`;
  $("pToday").innerHTML = html;
}

// ───── シフト ─────
let SM = thisMonth(); let SD = null;
async function loadShift(){ if(!$("pShift").dataset.loaded) $("pShift").innerHTML = loadingHtml(); $("pShift").dataset.loaded="1";
  $("pShift").innerHTML = `<div class="mini">読み込み中…</div>`;
  const [s, w] = await Promise.all([api("admin.shifts_month",{month:SM}), api("admin.wishes_month",{month:SM})]);
  if(!s.ok){ showMsg(s.error); return; } SD = {s, w};
  const staff = s.staff.filter(x=>x.status==="active"); const n = staff.length;
  const byDate = {}; s.shifts.forEach(x=>{ (byDate[x.date]=byDate[x.date]||{})[x.staff_id]=x; });

    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="saveAtt(${a?`'${a.att_id}'`:"null"})">保存</button><button class="btn sec" onclick="closeOv()">閉じる</button></div>
    ${a?`<div style="margin-top:14px;text-align:right"><button class="btn sec sm" id="delAttBtn" onclick="deleteAtt('${a.att_id}','${a.date.slice(5)} ${esc(a.name)}')">この記録を削除</button></div>`:""}`);
  if(!a && !staffOpts.length){ api("admin.staff_list").then(r=>{ $("eStBox").innerHTML = pick(r.staff); }); }
}
async function saveAtt(att_id){
  const body = {att_id, in:$("eI").value, out:$("eO").value, breakMin:Number($("eB").value)||0, note:$("eN").value}; if($("eT").value!=="") body.transport=Number($("eT").value);
  if(!att_id){ body.create=true; const picked=document.querySelector('input[name="eSt"]:checked'); if(!picked){ toast("誰の勤怠か選んでください"); return; } body.staff_id=picked.value; body.date=$("eD").value.replace(/-/g,"/"); if(!body.date){ toast("日付を入れてください"); return; } }
  const r = await api("admin.att_edit", body); if(!r.ok){ toast(r.error); return; } closeOv(); toast("保存しました"); loadAtt();
}
async function deleteAtt(att_id, label){
  const b = $("delAttBtn"); if(!b) return;
  if(b.dataset.arm!=="1"){ b.dataset.arm="1"; b.textContent="もう一度押すと削除（"+label+"）"; b.style.color="#b3261e"; setTimeout(()=>{ if(b.isConnected){ b.dataset.arm=""; b.textContent="この記録を削除"; b.style.color=""; } }, 5000); return; }
  b.disabled = true;
  const r = await api("admin.att_delete", {att_id}); if(!r.ok){ toast(r.error); b.disabled=false; return; }
  closeOv(); toast("削除しました"); loadAtt();
}

// ───── 給与 ─────
let PM = thisMonth(); let PAYR=null;
async function loadPay(){ if(!$("pPay").dataset.loaded) $("pPay").innerHTML = loadingHtml(); $("pPay").dataset.loaded="1";
  $("pPay").innerHTML = `<div class="mini">読み込み中…</div>`;
  const r = await api("admin.payroll_month",{month:PM}); if(!r.ok){ showMsg(r.error); return; }
  const rows = r.rows.filter(x=>x.days>0); PAYR = rows;
  const tot = rows.reduce((s,x)=>s+x.total,0);
  $("pPay").innerHTML = `
    <div class="monthnav"><button onclick="PM=ymAdd(PM,-1);loadPay()">◀</button><b>${ymLabel(PM)}</b><button onclick="PM=ymAdd(PM,1);loadPay()">▶</button></div>
    <div class="card"><h2>給与集計 ${r.closed?`<span class="pill">締め済 ${r.closedAt}</span>`:`<small>未締め（実労働ベースの見込み）</small>`}</h2>
      <div class="scroll"><table><tr><th>スタッフ</th><th class="r">日数</th><th class="r">労働</th><th class="r">時給</th><th class="r">基本給</th><th class="r">割増</th><th class="r">交通費</th><th class="r">支給額</th><th></th></tr>
      ${rows.map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${x.days}</td><td class="r">${fmtMin(x.minutes)}</td><td class="r">${x.wage.toLocaleString()}</td><td class="r">${x.base.toLocaleString()}</td><td class="r">${x.overtime.toLocaleString()}</td><td class="r">${x.transport.toLocaleString()}</td><td class="r"><b>${x.total.toLocaleString()}</b></td><td><button class="btn sec" style="padding:6px 10px;font-size:12px;white-space:nowrap" onclick="payConfirmText('${x.staff_id}','${esc(x.name)}')">LINE確認文</button></td></tr>`).join("")}
      <tr><td><b>合計</b></td><td colspan="6"></td><td class="r"><b>${tot.toLocaleString()}</b></td><td></td></tr></table></div>
      <div class="mini" style="margin-top:8px">支給額 = 実労働分×時給÷60（月合計で円未満四捨五入）＋ 8時間/日超の25%割増 ＋ 交通費（出勤日×日額、上限1,000円）。所得税等の控除は含みません。</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn sec" onclick="csv('admin.payroll_csv')">給与CSV</button>
        <button class="btn sec" onclick="bankList()">振込一覧（三菱UFJ入力用）</button>
        <button class="btn ${r.closed?"sec":""}" onclick="closeMonth()">${r.closed?"再締め":"この月を締める"}</button>
      </div></div>`;
}
async function csv(action){ const r = await api(action,{month:PM}); if(!r.ok){ showMsg(r.error); return; } download(r.filename, r.csv); }
// 三菱UFJダイレクト（個人）は一括アップロード非対応 → 入力順に並べた一覧を表示し、タップでコピーできるようにする
let BANK = null;
async function bankList(){
  const r = await api("admin.bank_csv",{month:PM}); if(!r.ok){ showMsg(r.error); return; } BANK = r;
  const miss = r.list.filter(x=>!x.number||!x.kana);
  modal(`<h3>振込一覧 ${ymLabel(PM)}<small style="color:var(--mute);font-weight:normal;margin-left:8px">三菱UFJダイレクト入力順</small></h3>
    <div class="mini" style="margin-bottom:8px">個人口座のネットバンキングは一括アップロードができないため、1人ずつ「振込」画面に入力します。各値はタップでコピーできます。${miss.length?`<br><b style="color:var(--red)">口座未登録: ${miss.map(x=>x.name).join("、")}</b>（スタッフタブで登録）`:""}</div>
    <div class="scroll"><table class="bk"><tr><th>スタッフ</th><th>受取人名(カナ)</th><th>金融機関</th><th>支店</th><th>種目</th><th>口座番号</th><th class="r">金額</th></tr>
    ${r.list.map(x=>`<tr><td>${x.name}</td>${[x.kana,x.bank,x.branch,x.type,x.number].map(v=>`<td onclick="cp('${v}')" style="cursor:pointer;text-decoration:underline dotted">${v||"—"}</td>`).join("")}<td class="r" onclick="cp('${x.amount}')" style="cursor:pointer"><b>${Number(x.amount).toLocaleString()}</b></td></tr>`).join("")}
    <tr><td><b>合計</b></td><td colspan="5"></td><td class="r"><b>${r.list.reduce((s,x)=>s+Number(x.amount),0).toLocaleString()}</b></td></tr></table></div>
    <div class="mini" style="margin-top:8px">振込依頼人名に「${r.list[0]?r.list[0].memo:""}」のように入れると、本人の通帳で分かりやすくなります。手数料は他行宛 154円（3万円未満）/ 220円（3万円以上）、三菱UFJ宛は無料です。</div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn sec" style="flex:1" onclick="download(BANK.filename, BANK.csv)">CSVで保存</button><button class="btn sec" style="flex:1" onclick="closeOv()">閉じる</button></div>`);
}
function cp(v){ if(!v) return; navigator.clipboard.writeText(String(v)).then(()=>toast("コピー: "+v)).catch(()=>toast(v)); }
async function closeMonth(){
  if(!confirm(`${ymLabel(PM)}を締めます。締め後に勤怠を直した場合は「再締め」で更新してください。`)) return;
  let r = await api("admin.payroll_close",{month:PM});
  if(!r.ok && (r.code==="pending"||r.code==="working")){ if(!confirm(r.error+"\n\nそれでも締めますか？")) return; r = await api("admin.payroll_close",{month:PM, force:true}); }
  if(!r.ok){ showMsg(r.error); return; } toast("締めました（バックアップフォルダにCSVを保存）"); loadPay();
}

// ───── スタッフ ─────
async function loadStaff(){ if(!$("pStaff").dataset.loaded) $("pStaff").innerHTML = loadingHtml(); $("pStaff").dataset.loaded="1";
  $("pStaff").innerHTML = `<div class="mini">読み込み中…</div>`;
  const r = await api("admin.staff_list"); if(!r.ok){ showMsg(r.error); return; }
  const rows = r.staff.map(s=>`<div class="row"><span><b>${esc(s.name)}</b> ${s.role==="admin"?`<span class="pill blue">管理者</span>`:""} ${s.status==="stopped"?`<span class="pill gray">停止</span>`:""} ${s.last?`<span class="pill amber">最終 ${s.last.slice(5)}</span>`:""} ${!s.hasPass?`<span class="pill amber">パス未設定</span>`:""} ${s.locked?`<span class="pill red">ロック中</span>`:""}<br><span class="mini">時給 ${s.wage.toLocaleString()}円・交通費 ${s.transport}円/日・${s.joined}〜</span></span><button class="btn sec sm" onclick='editStaff(${JSON.stringify(s).replace(/'/g,"&#39;")})'>編集</button></div>`).join("");
  $("pStaff").innerHTML = `<div class="card"><h2>スタッフ <small><button class="btn sm" onclick="editStaff(null)">＋ 新規登録</button></small></h2>${rows}</div>
    <div class="card"><h2>パスコードの渡し方</h2><div class="mini">1. 「編集」→「パスコードを設定」で4桁以上の数字を決める　2. 本人に口頭かLINEで伝える　3. 本人はスタッフ画面の「履歴」タブで自分のパスコードに変更できます。5回間違えると15分ロックされ、ここで解除できます。</div></div>`;
}
function editStaff(s){
  modal(`<h3>${s?esc(s.name)+" の編集":"スタッフを新規登録"}</h3>
    <label>名前</label><input id="sN" value="${s?esc(s.name):""}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>役割</label><select id="sR"><option value="staff" ${s&&s.role==="staff"?"selected":""}>スタッフ</option><option value="admin" ${s&&s.role==="admin"?"selected":""}>管理者</option></select></div><div><label>状態</label><select id="sS"><option value="active" ${!s||s.status==="active"?"selected":""}>在籍</option><option value="stopped" ${s&&s.status==="stopped"?"selected":""}>停止（退職）</option></select></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>時給（円）</label><input type="number" id="sW" value="${s?s.wage:1500}"></div><div><label>交通費 日額（上限1,000）</label><input type="number" id="sT" value="${s?s.transport:0}"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>入社日</label><input type="date" id="sJ" value="${s&&s.joined?s.joined.replace(/\//g,"-"):new Date().toISOString().slice(0,10)}"></div><div><label>最終勤務日（退職予定）</label><input type="date" id="sL" value="${s&&s.last?s.last.replace(/\//g,"-"):""}"></div></div>
    <div class="mini">最終勤務日を入れると、その翌月以降のシフト表・希望一覧から外れます。勤怠と給与はそのまま残るので、給与を締めたあとに「停止」にしてください</div>
    <label>備考</label><input id="sM" value="${s?esc(s.note||""):""}">
    ${s?`<div style="border-top:1px dashed var(--line);margin-top:14px;padding-top:10px"><label>パスコード（4桁以上の数字）</label><div style="display:flex;gap:8px"><input type="text" inputmode="numeric" id="sP" placeholder="新しいパスコード"><button class="btn sec" onclick="setPass('${s.staff_id}')">設定</button></div>${s.locked?`<button class="btn sec sm" style="margin-top:8px" onclick="unlock('${s.staff_id}')">ロック解除</button>`:""}</div>
    <div style="border-top:1px dashed var(--line);margin-top:14px;padding-top:10px"><h3 style="font-size:14px">振込口座 <span class="mini">（管理者のみ閲覧）</span></h3><div id="bankBox" class="mini">読み込み中…</div></div>`:""}
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="saveStaff(${s?`'${s.staff_id}'`:"null"})">保存</button><button class="btn sec" onclick="closeOv()">閉じる</button></div>`);
  if (s) loadBank(s.staff_id);
}
async function loadBank(staff_id){
  const r = await api("admin.bank_get",{staff_id}); const b = (r.ok&&r.bank)||{};
  $("bankBox").innerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>銀行名</label><input id="bB" value="${esc(b.bank||"")}"></div><div><label>支店名</label><input id="bBr" value="${esc(b.branch||"")}"></div></div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px"><div><label>種別</label><select id="bT"><option ${b.type==="普通"||!b.type?"selected":""}>普通</option><option ${b.type==="当座"?"selected":""}>当座</option><option ${b.type==="貯蓄"?"selected":""}>貯蓄</option></select></div><div><label>口座番号</label><input id="bN" inputmode="numeric" value="${esc(b.number||"")}"></div></div>
    <label>口座名義（カナ）</label><input id="bH" value="${esc(b.holder||"")}">
    <button class="btn sec sm" style="margin-top:8px" onclick="saveBank('${staff_id}')">口座を保存</button> ${b.updated?`<span class="mini">更新 ${b.updated}</span>`:""}`;
}
async function saveBank(staff_id){ const r = await api("admin.bank_set",{staff_id, bank:{bank:$("bB").value, branch:$("bBr").value, type:$("bT").value, number:$("bN").value, holder:$("bH").value}}); toast(r.ok?"口座を保存しました":r.error); }
async function saveStaff(staff_id){
  const st = {staff_id:staff_id||undefined, name:$("sN").value.trim(), role:$("sR").value, status:$("sS").value, wage:Number($("sW").value)||0, transport:Number($("sT").value)||0, joined:$("sJ").value.replace(/-/g,"/"), last:$("sL").value.replace(/-/g,"/"), note:$("sM").value};
  if(!st.name){ toast("名前を入れてください"); return; }
  if(staff_id && st.status==="stopped" && !confirm("停止するとログインできなくなります。よろしいですか？")) return;
  const r = await api("admin.staff_save",{staff:st}); if(!r.ok){ toast(r.error); return; }
  if(!staff_id){ closeOv(); toast("登録しました。続けて「編集」からパスコードを設定してください"); } else { closeOv(); toast("保存しました"); }
  loadStaff();
}
async function setPass(staff_id){ const p=$("sP").value.trim(); if(!/^\d{4,}$/.test(p)){ toast("4桁以上の数字"); return; } const r = await api("admin.staff_setpass",{staff_id, passcode:p}); toast(r.ok?"パスコードを設定しました。本人に伝えてください":r.error); if(r.ok){ $("sP").value=""; loadStaff(); } }
async function unlock(staff_id){ const r = await api("admin.staff_unlock",{staff_id}); toast(r.ok?"解除しました":r.error); closeOv(); loadStaff(); }

// ───── 設定 ─────
async function loadSet(){ if(!$("pSet").dataset.loaded) $("pSet").innerHTML = loadingHtml(); $("pSet").dataset.loaded="1";
  $("pSet").innerHTML = `<div class="mini">読み込み中…</div>`;
  const [r, s] = await Promise.all([api("admin.settings_get"), api("admin.sync_status")]); if(!r.ok){ showMsg(r.error); return; }
  const hideKeys = ["backup_folder_id"];
  const rows = r.settings.filter(x=>!hideKeys.includes(x.key)).map(x=>`<div class="row" style="align-items:flex-start"><span style="flex:1"><b>${esc(x.key)}</b><br><span class="mini">${esc(x.desc)}</span></span><input style="width:48%" id="set_${esc(x.key)}" value="${esc(x.value)}"></div>`).join("");
  const issues = (s.issues||[]).map(i=>`<div class="row"><span>${i.date.slice(5)} ${esc(i.name)} ${i.start}〜${i.end} <span class="mini">${esc(i.syncError||"")}</span></span><span class="pill ${i.sync==="error"?"red":"amber"}">${i.sync}</span></div>`).join("");
  $("pSet").innerHTML = `
    <div class="card"><h2>Googleカレンダー同期 <small>${s.calendar_id?"設定済":"未設定"}</small></h2>${issues||`<div class="mini">未同期はありません</div>`}<div style="margin-top:10px"><button class="btn sec" onclick="resync()">今すぐ再同期</button></div>
      <div class="mini" style="margin-top:8px">カレンダーIDは Googleカレンダー → 「オリオン」の設定 → 「カレンダーの統合」にある ID（…@group.calendar.google.com）。このアプリを動かすアカウントに「予定の変更権限」で共有しておくこと。</div></div>
    <div class="card"><h2>設定</h2>${rows}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="saveSet()">設定を保存</button></div></div>
    <div class="card"><h2>メンテナンス</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" onclick="api('admin.labor_rebuild').then(r=>toast(r.ok?'人件費日次を再集計しました':r.error))">人件費日次を再集計</button><button class="btn sec" onclick="api('admin.backup_now').then(r=>toast(r.ok?'バックアップ: '+r.file:r.error))">今すぐバックアップ</button><button class="btn sec" onclick="showAudit()">操作ログ</button></div><div class="mini" style="margin-top:8px">毎日 15:30 に打刻漏れチェック（admin_email へ通知）、毎時カレンダー再同期、毎晩 2:00 にスプレッドシートをDriveへバックアップ（30世代）。</div></div>`;
}
async function saveSet(){ const o={}; document.querySelectorAll("[id^=set_]").forEach(i=>o[i.id.slice(4)]=i.value); const r = await api("admin.settings_set",{settings:o}); toast(r.ok?"保存しました":r.error); }
async function resync(){ const r = await api("admin.sync_retry"); if(!r.ok){ toast(r.error); return; } const s=r.sync; toast(s.skipped?s.skipped:`同期 ${s.synced}件 / エラー ${s.errors}件`); loadSet(); }
async function showAudit(){ const r = await api("admin.audit"); modal(`<h3>操作ログ（直近200件）</h3><div class="scroll"><table>${(r.log||[]).map(l=>`<tr><td class="mini" style="white-space:nowrap">${l.ts}</td><td>${esc(l.actor)}</td><td>${esc(l.action)}</td><td class="mini">${esc(l.target)} ${esc(l.detail)}</td></tr>`).join("")}</table></div><button class="btn sec" style="margin-top:10px" onclick="closeOv()">閉じる</button>`); }

(async function(){
  if(!TOKEN){ showLogin(); return; }
  try{ const r = await api("home"); if(r.ok && r.staff.role==="admin"){ ME=r.staff; enterApp(); } else if(r.ok){ showLogin("管理者ではありません"); } else if(r.code!=="noauth"){ showLogin(r.error); } } catch(e){ showLogin("通信できません"); }
})();
</script>
